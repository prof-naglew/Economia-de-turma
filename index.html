<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Economia de Fichas (ABA)</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #07070B;
      color: #F5F5F7;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      transition: background-color 500ms cubic-bezier(0.22, 1, 0.36, 1), color 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .glass-card, .glass-header, .glass-nav, .glass-pill {
      transition: background 500ms cubic-bezier(0.22, 1, 0.36, 1), border-color 500ms cubic-bezier(0.22, 1, 0.36, 1), color 500ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 500ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* Orbes de luz ambiente para o efeito Liquid Glass */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .orb-purple {
      position: absolute;
      width: 420px;
      height: 420px;
      top: -120px;
      left: -100px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.38) 0%, rgba(106, 27, 154, 0.08) 55%, transparent 75%);
      filter: blur(28px);
    }
    .orb-gold {
      position: absolute;
      width: 340px;
      height: 340px;
      bottom: 8%;
      right: -110px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(255, 214, 0, 0.20) 0%, rgba(255, 214, 0, 0.04) 55%, transparent 75%);
      filter: blur(32px);
    }
    .orb-deep {
      position: absolute;
      width: 380px;
      height: 380px;
      top: 42%;
      left: 25%;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(88, 28, 135, 0.24) 0%, transparent 70%);
      filter: blur(40px);
    }

    /* Superfícies Liquid Glass */
    .glass-card {
      background: linear-gradient(145deg, rgba(34, 30, 46, 0.58), rgba(16, 15, 22, 0.68));
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .glass-header {
      background: linear-gradient(180deg, rgba(28, 18, 44, 0.72), rgba(14, 12, 22, 0.62));
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.05);
    }
    .glass-nav {
      background: linear-gradient(180deg, rgba(22, 20, 30, 0.72), rgba(10, 10, 14, 0.86));
      backdrop-filter: blur(26px) saturate(190%);
      -webkit-backdrop-filter: blur(26px) saturate(190%);
      border-top: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .glass-accent-purple {
      background: linear-gradient(135deg, rgba(126, 87, 194, 0.48), rgba(56, 0, 107, 0.62));
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 16px 36px rgba(56, 0, 107, 0.45);
    }
    .glass-gold-btn {
      background: linear-gradient(135deg, #FFE44D, #FFD600);
      color: #09090D;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65), 0 8px 22px rgba(255, 214, 0, 0.25);
    }
    .text-amarelo { color: #FFD600; }
    .border-card { border-color: rgba(255, 255, 255, 0.13); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Tema Claro Liquid Glass */
    body.theme-light {
      background-color: #F2EFF9;
      color: #181622;
    }
    body.theme-light .orb-purple {
      background: radial-gradient(circle, rgba(138, 43, 226, 0.22) 0%, rgba(106, 27, 154, 0.04) 55%, transparent 75%);
    }
    body.theme-light .orb-gold {
      background: radial-gradient(circle, rgba(255, 196, 0, 0.25) 0%, transparent 75%);
    }
    body.theme-light .glass-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.78), rgba(242, 238, 252, 0.85));
      border-color: rgba(106, 27, 154, 0.16);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 8px 24px rgba(56, 0, 107, 0.08);
      color: #181622;
    }
    body.theme-light .glass-header {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.85), rgba(242, 238, 252, 0.78));
      border-bottom-color: rgba(106, 27, 154, 0.14);
      color: #181622;
    }
    body.theme-light .glass-nav {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(245, 242, 252, 0.95));
      border-top-color: rgba(106, 27, 154, 0.14);
    }
    body.theme-light .glass-pill {
      background: rgba(106, 27, 154, 0.08);
      border-color: rgba(106, 27, 154, 0.18);
      color: #181622;
    }
    body.theme-light .text-white { color: #181622 !important; }
    body.theme-light .text-gray-200,
    body.theme-light .text-gray-300 { color: #38344A !important; }
    body.theme-light .text-gray-400,
    body.theme-light .text-gray-500 { color: #635E78 !important; }
    body.theme-light .text-amarelo { color: #8A5A00 !important; }
    body.theme-light .glass-accent-purple,
    body.theme-light .glass-accent-purple *,
    body.theme-light .glass-accent-purple .text-white { color: #FFFFFF !important; }
    body.theme-light .glass-accent-purple .text-amarelo { color: #FFD600 !important; }
    body.theme-light .glass-gold-btn,
    body.theme-light .glass-gold-btn * { color: #09090D !important; }
    body.theme-light .bg-white\/10,
    body.theme-light .bg-white\/5 { background-color: rgba(106, 27, 154, 0.10) !important; }
    body.theme-light .bg-\[\#121218\],
    body.theme-light .bg-\[\#18181D\] {
      background-color: rgba(255, 255, 255, 0.92) !important;
      color: #181622 !important;
      border-color: rgba(106, 27, 154, 0.25) !important;
    }
    body.theme-light select option {
      background-color: #FFFFFF !important;
      color: #181622 !important;
    }
    body.theme-light .border-white\/10,
    body.theme-light .border-white\/15,
    body.theme-light .border-white\/20 {
      border-color: rgba(106, 27, 154, 0.18) !important;
    }
    body.theme-light .text-emerald-300,
    body.theme-light .text-emerald-400 { color: #047857 !important; }
    body.theme-light .text-red-400 { color: #B91C1C !important; }
    body.theme-light .text-purple-100,
    body.theme-light .text-purple-200,
    body.theme-light .text-purple-300 { color: #581C87 !important; }
    body.theme-light .glass-accent-purple .text-purple-100,
    body.theme-light .glass-accent-purple .text-purple-200 { color: #F3E8FF !important; }
    body.theme-light .bg-red-950\/50,
    body.theme-light .bg-red-950\/35 {
      background-color: #FEE2E2 !important;
      border-color: #DC2626 !important;
    }
    body.theme-light .text-red-300,
    body.theme-light .text-red-200\/90,
    body.theme-light .text-red-200 { color: #991B1B !important; }
  
    .broche-locked {
      filter: grayscale(100%) brightness(0.65) opacity(0.5);
      transition: filter 0.25s ease, transform 0.25s ease;
    }
    .broche-unlocked {
      filter: drop-shadow(0 2px 6px rgba(255, 214, 0, 0.45));
      transform: scale(1.03);
      transition: filter 0.25s ease, transform 0.25s ease;
    }
  </style>
</head>

    (function () {

      const TERMOS_PROIBIDOS = [
        'nazi', 'nazis', 'hitler', 'suastica', 'reich', 'ss88', '1488',
        'genocid', 'holocaust', 'fascis', 'kkk', 'klux', 'racis',
        'macaco', 'crioulo', 'favelado', 'viado', 'bicha', 'sapatao',
        'puta', 'vadia', 'vagabund', 'corno', 'arromb', 'fdp', 'caralho',
        'buceta', 'pau', 'merda', 'desgrac', 'retardad', 'aleijad',
        'terroris', 'extremis', 'eugenia', 'supremac'
      ];

      function contemTermoProibido(...textos) {
        const norm = s => String(s || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]/g, '');
        return textos.some(t => {
          const clean = norm(t);
          return TERMOS_PROIBIDOS.some(bad => clean.includes(bad));
        });
      }

      function validarSenhaForte(senha) {
        const s = String(senha || '');
        if (s.length < 8) return 'A senha deve ter pelo menos 8 caracteres.';
        if (!/[0-9]/.test(s)) return 'A senha deve conter pelo menos 1 número.';
        if (!/[^A-Za-z0-9\s]/.test(s)) return 'A senha deve conter pelo menos 1 caractere especial (ex: !@#$%).';
        return '';
      }

      async function sha256Hex(texto) {
        if (window.crypto && crypto.subtle) {
          const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        return texto;
      }

      function getCloudCfg() {
        try {
          const raw = localStorage.getItem(CLOUD_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return { url: '', key: '' };
      }

      function saveCloudCfg(url, key) {
        try {
          localStorage.setItem(CLOUD_KEY, JSON.stringify({ url: url.trim().replace(/\/+$/, ''), key: key.trim() }));
        } catch (e) {}
      }

      async function supaFetch(path, opts = {}) {
        const cfg = getCloudCfg();
        if (!cfg.url || !cfg.key) return null;
        const headers = {
          'apikey': cfg.key,
          'Authorization': 'Bearer ' + cfg.key,
          'Content-Type': 'application/json',
          ...(opts.headers || {})
        };
        const res = await fetch(`${cfg.url}/rest/v1/${path}`, { ...opts, headers });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        return text ? JSON.parse(text) : null;
      }

      async function sincronizarComNuvem(silencioso = false) {
        const cfg = getCloudCfg();

        try {

              aplicarEstadoEscola(est[0].dados);

              await enviarEstadoEscolaParaNuvem(escolaId);

          salvarEstadoLocalOnly();
          if (!silencioso) toast('Sincronizado com a nuvem!', 'sucesso');

            headers: { 'Prefer': 'resolution=merge-duplicates' },
            body: JSON.stringify({ escola_id: escolaId, dados, atualizado_em: new Date().toISOString() })

      function hojeISO() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function formatarDataCurta(yyyyMmDd) {
        const [y, m, d] = yyyyMmDd.split('-');
        return `${d}/${m}/${y}`;
      }

      function formatarDataHora(iso) {
        const d = new Date(iso);
        const day = String(d.getDate()).padStart(2, '0');
        const mon = String(d.getMonth() + 1).padStart(2, '0');
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${day}/${mon} ${h}:${min}`;
      }

      function carregarEstado() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed.horariosAula)) parsed.horariosAula = [];
            if (!parsed.config.tema) parsed.config.tema = 'escuro';
            if (typeof parsed.config.biometriaAtivada !== 'boolean') parsed.config.biometriaAtivada = false;
            if (typeof parsed.config.presencaAtiva !== 'boolean') parsed.config.presencaAtiva = true;
            if (typeof parsed.config.presencaValor !== 'number') parsed.config.presencaValor = 1;
            if (!Array.isArray(parsed.bimestres)) parsed.bimestres = [];
            parsed.regras = (parsed.regras || []).filter(r => !r.ehPresenca && r.titulo.toLowerCase() !== 'presença');
            if (!parsed.presencaMigrada) {
              const jaTem = (parsed.regras || []).some(r => r.ehPresenca || r.titulo.toLowerCase() === 'presença');
              if (!jaTem) {
                parsed.regras.unshift({ id: 99, titulo: 'Presença', valor: 1, icone: 'check', ehPresenca: true });
              }
              parsed.presencaMigrada = true;
            }
            return parsed;
          }
        } catch (e) {}

      function svgBrocheBloco2(simbolo, sizeClass = 'w-12 h-12') {
        const fs = simbolo.length >= 6 ? 10 : simbolo.length >= 4 ? 12 : 15;
        return `<svg class="${sizeClass}" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="29" fill="#FFD600" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4 2"/>
          <circle cx="32" cy="32" r="25" fill="#7C3AED" stroke="#FEF08A" stroke-width="1.8"/>
          <text x="32" y="37" text-anchor="middle" fill="#FFD600" font-size="${fs}" font-weight="900" font-family="system-ui, sans-serif">${escapeHtml(simbolo)}</text>
        </svg>`;
      }

      function renderBrocheImg(broche, bloco, unlocked, sizeClass = 'w-11 h-11') {
        const cls = unlocked ? 'broche-unlocked' : 'broche-locked';
        if (bloco === 1) {
          return `<img src="${broche.img}" alt="${escapeHtml(broche.nome)}" class="${sizeClass} rounded-full object-cover ${cls}" />`;
        }
        return `<div class="${cls} inline-flex items-center justify-center">${svgBrocheBloco2(broche.simbolo, sizeClass)}</div>`;
      }

      function getBrochesAluno(aluno) {
        return Array.isArray(aluno && aluno.broches) ? aluno.broches : [];
      }

      function abrirModalBrochesAluno(alunoId) {
        const aluno = db.usuarios.find(u => u.id === alunoId);
        if (!aluno) return;
        if (!Array.isArray(aluno.broches)) aluno.broches = [];

        function drawModal() {
          const set = new Set(aluno.broches);
          const total = BROCHES_BLOCO_1.length + BROCHES_BLOCO_2.length;
          abrirModal(`
            <div class="flex items-center justify-between mb-2">
              <div>
                <h3 class="font-bold text-base">Broches de ${escapeHtml(aluno.apelido)}</h3>
                <p class="text-[11px] text-gray-400">${set.size} de ${total} conquistados • Toque para alternar</p>
              </div>
              <button id="btn-fechar-modal" class="text-gray-400 text-xl px-2">&times;</button>
            </div>
            <div class="flex flex-wrap gap-1.5 mb-3">
              <button id="btn-b-all-1" class="glass-pill text-[11px] font-bold px-2.5 py-1 rounded-xl text-amarelo">Tudo Bloco I</button>
              <button id="btn-b-all-2" class="glass-pill text-[11px] font-bold px-2.5 py-1 rounded-xl text-purple-300">Tudo Bloco II</button>
              <button id="btn-b-clear" class="glass-pill text-[11px] font-bold px-2.5 py-1 rounded-xl text-red-300">Limpar</button>
            </div>
            <div class="max-h-[58vh] overflow-y-auto pr-1 space-y-4">
              <div>
                <div class="text-xs font-extrabold text-red-300 mb-2">Bloco I (Vermelho e Amarelo • ${BROCHES_BLOCO_1.filter(b => set.has(b.id)).length}/${BROCHES_BLOCO_1.length})</div>
                <div class="grid grid-cols-5 sm:grid-cols-6 gap-2">
                  ${BROCHES_BLOCO_1.map(b => `
                    <button type="button" data-toggle-broche="${b.id}" title="${escapeHtml(b.nome)}" class="btn-toggle-broche flex flex-col items-center p-1 rounded-xl hover:bg-white/5">
                      ${renderBrocheImg(b, 1, set.has(b.id), 'w-11 h-11')}
                    </button>
                  `).join('')}
                </div>
              </div>
              <div>
                <div class="text-xs font-extrabold text-purple-300 mb-2">Bloco II (Roxo e Amarelo • ${BROCHES_BLOCO_2.filter(b => set.has(b.id)).length}/${BROCHES_BLOCO_2.length})</div>
                <div class="grid grid-cols-4 gap-2">
                  ${BROCHES_BLOCO_2.map(b => `
                    <button type="button" data-toggle-broche="${b.id}" title="${escapeHtml(b.nome)}" class="btn-toggle-broche flex flex-col items-center p-1.5 rounded-xl hover:bg-white/5 text-center">
                      ${renderBrocheImg(b, 2, set.has(b.id), 'w-11 h-11')}
                      <span class="text-[9px] text-gray-300 mt-1 leading-tight line-clamp-2">${escapeHtml(b.nome)}</span>
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>
          `);
          document.getElementById('btn-fechar-modal').onclick = () => { fecharModal(); render(); };
          document.querySelectorAll('.btn-toggle-broche').forEach(btn => {
            btn.onclick = () => {
              const bid = btn.dataset.toggleBroche;
              const idx = aluno.broches.indexOf(bid);
              if (idx >= 0) aluno.broches.splice(idx, 1);
              else aluno.broches.push(bid);
              salvarEstado();
              drawModal();
            };
          });
          document.getElementById('btn-b-all-1').onclick = () => {
            const s = new Set(aluno.broches);
            BROCHES_BLOCO_1.forEach(b => s.add(b.id));
            aluno.broches = Array.from(s);
            salvarEstado();
            drawModal();
          };
          document.getElementById('btn-b-all-2').onclick = () => {
            const s = new Set(aluno.broches);
            BROCHES_BLOCO_2.forEach(b => s.add(b.id));
            aluno.broches = Array.from(s);
            salvarEstado();
            drawModal();
          };
          document.getElementById('btn-b-clear').onclick = () => {
            aluno.broches = [];
            salvarEstado();
            drawModal();
          };
        }
        drawModal();
      }

      function abrirTrilhaBloco2(alunoId) {
        const b64El = document.getElementById('bloco2-html-b64');
        if (!b64El) return;
        const binStr = atob(b64El.textContent.trim());
        const bytes = new Uint8Array(binStr.length);
        for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
        let html = new TextDecoder('utf-8').decode(bytes);
        const storageKey = 'matematrilha_bloco2_' + (alunoId || 'prof');
        const bridge = `<script>
          window.notebookAppApi = {
            getAppState: async () => { try { return JSON.parse(localStorage.getItem('${storageKey}') || 'null'); } catch(e){ return null; } },
            setAppState: async (s) => { try { localStorage.setItem('${storageKey}', JSON.stringify(s)); } catch(e){} },
            notifyAppReady: () => {}
          };
        <\/script>`;
        html = html.replace('</head>', bridge + '</head>');

        let overlay = document.getElementById('overlay-trilha-b2');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'overlay-trilha-b2';
          overlay.className = 'fixed inset-0 z-50 flex flex-col bg-[#07070B]';
          document.body.appendChild(overlay);
        }
        overlay.innerHTML = `
          <div class="glass-header px-4 py-2.5 flex items-center justify-between">
            <span class="font-extrabold text-sm text-amarelo">MatemaTrilha — Bloco II</span>
            <button id="btn-fechar-trilha-b2" class="glass-pill text-xs font-bold px-3.5 py-1.5 rounded-xl text-white">← Voltar ao App</button>
          </div>
          <iframe id="iframe-trilha-b2" class="flex-1 w-full border-0 bg-[#fef7ff]"></iframe>
        `;
        overlay.classList.remove('hidden');
        document.getElementById('iframe-trilha-b2').srcdoc = html;
        document.getElementById('btn-fechar-trilha-b2').onclick = () => {
          overlay.classList.add('hidden');
          overlay.innerHTML = '';
        };
      }

      function iconeMoedaImg(sizeClass = 'w-4 h-4') {
        const src = db.config.moedaIcone || IPE_ICON_DEFAULT;
        return `<img src="${src}" alt="Ficha" class="${sizeClass} object-contain inline-block shrink-0" />`;
      }

      function fmtMoeda(valor) {
        const n = Number(valor) || 0;
        return `${n} ${n === 1 ? db.config.moedaSingular : db.config.moedaPlural}`;

      function toast(msg, tipo = 'roxo') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const div = document.createElement('div');
        const ehPerigo = tipo === 'erro' || tipo === 'perigo';
        const cor = ehPerigo
          ? 'bg-red-700/95 border-red-300/70'
          : (tipo === 'sucesso' ? 'bg-emerald-800/90 border-emerald-400/40' : 'bg-purple-900/90 border-purple-300/30');
        div.className = `${cor} backdrop-blur-xl text-white px-4 py-3 rounded-2xl shadow-2xl text-sm font-bold flex items-center justify-center gap-2 border transition-opacity`;
        div.innerHTML = `${ehPerigo ? svgIcon('alertTriangle', 'w-5 h-5 text-white') : ''}<span>${escapeHtml(msg)}</span>`;
        container.appendChild(div);
        setTimeout(() => {
          div.style.opacity = '0';
          setTimeout(() => div.remove(), 250);
        }, 2600);
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function lancarIps(origemId, destinoIds, valor, motivo, tipo = 'ganho', dataRef = null) {
        const hoje = hojeISO();
        const alvoData = dataRef || hoje;
        const criadoEm = alvoData === hoje ? new Date().toISOString() : `${alvoData}T12:00:00.000Z`;
        destinoIds.forEach(id => {
          const u = db.usuarios.find(x => x.id === id);
          if (!u) return;
          u.saldo = (u.saldo || 0) + valor;
          db.transacoes.unshift({
            id: genId(),
            turmaId: session.turmaAtualId,
            origemId,
            destinoId: id,
            valor,
            tipo,
            motivo,
            criadoEm
          });
        });
        salvarEstado();
      }

      function pontosDoAlunoNaData(alunoId, dataYmd) {
        return db.transacoes
          .filter(t => t.destinoId === alunoId && t.valor > 0 && t.criadoEm.startsWith(dataYmd))
          .reduce((acc, t) => acc + t.valor, 0);
      }

      function abrirModalCalendario() {
        const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        const hoje = hojeISO();

        function renderCal() {
          const ano = session.calAno;
          const mes = session.calMes;
          const primeiroDia = new Date(ano, mes, 1).getDay();
          const diasNoMes = new Date(ano, mes + 1, 0).getDate();
          const diasComRegistro = new Set(
            db.transacoes
              .filter(t => t.turmaId === session.turmaAtualId && t.valor > 0)
              .map(t => t.criadoEm.slice(0, 10))
          );

          let celulas = '';
          for (let i = 0; i < primeiroDia; i++) {
            celulas += '<div></div>';
          }
          for (let d = 1; d <= diasNoMes; d++) {
            const ymd = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const futuro = ymd > hoje;
            const sel = ymd === session.dataSelecionada;
            const temReg = diasComRegistro.has(ymd);
            celulas += `
              <button type="button" data-cal-ymd="${ymd}" ${futuro ? 'disabled' : ''} class="btn-cal-dia h-10 rounded-xl text-xs font-bold flex flex-col items-center justify-center relative transition ${sel ? 'glass-gold-btn' : (futuro ? 'text-gray-600 opacity-40' : 'glass-pill text-white hover:border-[#FFD600]/60')}">
                <span>${d}</span>
                ${temReg ? `<span class="w-1.5 h-1.5 rounded-full ${sel ? 'bg-black' : 'bg-[#FFD600]'} mt-0.5"></span>` : ''}
              </button>
            `;
          }

          abrirModal(`
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-bold text-base flex items-center gap-2">${svgIcon('calendar', 'w-5 h-5 text-amarelo')} <span>Calendário de Lançamentos</span></h3>

            </div>
            <div class="flex items-center justify-between mb-3">

            <div class="grid grid-cols-7 gap-1 text-center text-[10px] text-gray-400 font-semibold mb-1.5">

          document.getElementById('cal-next').onclick = () => {

            };
          });
        }
        renderCal();
      }

      const BIO_KEY = 'economia_turma_bio_id';

      function bufferToBase64(buf) {
        return btoa(String.fromCharCode(...new Uint8Array(buf)));
      }

      function base64ToBuffer(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes.buffer;
      }

      async function cadastrarBiometriaWeb() {
        if (!window.PublicKeyCredential || !navigator.credentials) {
          throw new Error('Navegador sem suporte a biometria web');
        }
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);
        const userId = new Uint8Array(16);
        crypto.getRandomValues(userId);
        const cred = await navigator.credentials.create({
          publicKey: {
            challenge,
            rp: { name: 'Economia da Turma' },
            user: { id: userId, name: 'professor', displayName: 'Professor' },
            pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
            timeout: 60000
          }
        });
        if (cred && cred.rawId) {
          try { localStorage.setItem(BIO_KEY, bufferToBase64(cred.rawId)); } catch (e) {}
          return true;
        }
        return false;
      }

      async function verificarBiometriaWeb() {
        let savedId = null;
        try { savedId = localStorage.getItem(BIO_KEY); } catch (e) {}
        if (!savedId) return false;
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);
        const assertion = await navigator.credentials.get({
          publicKey: {
            challenge,
            allowCredentials: [{ type: 'public-key', id: base64ToBuffer(savedId) }],
            userVerification: 'required',
            timeout: 60000
          }
        });
        return Boolean(assertion);
      }

      function pedirPinProfessor() {
        if (!db.config.biometriaAtivada) {
          concluirEntradaProfessor();
          return;
        }
        let bioCadastrada = false;
        try { bioCadastrada = Boolean(localStorage.getItem(BIO_KEY)); } catch (e) {}

        abrirModal(`
          <div class="flex items-center justify-between mb-3">

        `);

        document.getElementById('btn-usar-digital').onclick = async () => {

              if (ok) concluirEntradaProfessor();
            } else {
              const ok = await verificarBiometriaWeb();

      function renderGradeSemanalHtml() {
        const dias = [1, 2, 3, 4, 5, 6]; // Seg a Sáb
        const aulas = (db.horariosAula || []).filter(h => h.diaSemana >= 1 && h.diaSemana <= 6);
        const toMin = (hhmm) => {
          const [h, m] = hhmm.split(':').map(Number);
          return h * 60 + m;
        };

        let minStart = 7 * 60;
        let maxEnd = 12 * 60 + 30;
        if (aulas.length > 0) {
          minStart = Math.min(...aulas.map(a => toMin(a.inicio)));
          maxEnd = Math.max(...aulas.map(a => toMin(a.fim)));
          minStart = Math.floor(minStart / 60) * 60;
          maxEnd = Math.ceil(maxEnd / 60) * 60;
        }
        const totalMin = Math.max(60, maxEnd - minStart);
        const pxPerMin = 1.15;
        const heightPx = Math.round(totalMin * pxPerMin);

        const hourMarks = [];
        for (let m = minStart; m <= maxEnd; m += 60) {
          const top = Math.round((m - minStart) * pxPerMin);
          const lbl = `${String(Math.floor(m / 60)).padStart(2, '0')}:00`;
          hourMarks.push({ top, lbl });
        }

        const colsHtml = dias.map(d => {
          const doDia = aulas.filter(a => a.diaSemana === d);
          const blocos = doDia.map(a => {
            const top = Math.round((toMin(a.inicio) - minStart) * pxPerMin);
            const h = Math.max(26, Math.round((toMin(a.fim) - toMin(a.inicio)) * pxPerMin) - 2);
            const t = db.turmas.find(x => x.id === a.turmaId);
            return `
              <div style="top:${top}px;height:${h}px" class="absolute left-0.5 right-0.5 rounded-xl bg-[#6A1B9A]/80 border border-[#FFD600]/45 px-1 py-0.5 flex flex-col justify-center overflow-hidden shadow">
                <div class="text-[9px] font-extrabold text-[#FFD600] leading-tight truncate">${t ? escapeHtml(t.nome) : 'Aula'}</div>
                <div class="text-[8px] text-white/90 leading-tight">${a.inicio}–${a.fim}</div>
              </div>
            `;
          }).join('');
          const linhas = hourMarks.map(hm => `<div style="top:${hm.top}px" class="absolute left-0 right-0 border-t border-white/10"></div>`).join('');
          return `
            <div class="flex-1 min-w-[68px] border-l border-white/10 relative" style="height:${heightPx}px">
              ${linhas}
              ${blocos}
            </div>
          `;
        }).join('');

        return `
          <div class="overflow-x-auto">
            <div class="min-w-[460px]">
              <div class="flex border-b border-white/15 pb-1.5 mb-1 text-[10px] font-bold text-gray-300">
                <div class="w-10 shrink-0">Hora</div>
                ${dias.map(d => `<div class="flex-1 min-w-[68px] text-center">${DIAS_SEMANA[d]}</div>`).join('')}
              </div>
              <div class="flex">
                <div class="w-10 shrink-0 relative" style="height:${heightPx}px">
                  ${hourMarks.map(hm => `<div style="top:${Math.max(0, hm.top - 6)}px" class="absolute left-0 text-[9px] font-mono text-gray-400">${hm.lbl}</div>`).join('')}
                </div>
                ${colsHtml}
              </div>
            </div>
          </div>
        `;
      }

          document.getElementById('btn-confirmar-cad').onclick = async () => {

            const nome = document.getElementById('cad-nome').value.trim();
            const login = document.getElementById('cad-login').value.trim().toLowerCase();

            if (!escola_id || !nome || !login || !senha) {
              toast('Preencha todos os campos.', 'erro');
              return;
            }
            if (contemTermoProibido(nome, login, senha)) {
              toast('Termo proibido detectado no nome, login ou senha.', 'erro');
              return;
            }
            const erroSenha = validarSenhaForte(senha);
            if (erroSenha) {
              toast(erroSenha, 'erro');
              return;
            }
            if ((db.contas || []).some(c => c.login.toLowerCase() === login)) {
              toast('Este login já existe.', 'erro');
              return;
            }
            const senha_hash = await sha256Hex(senha);
            const nova = { id: genId(), escola_id, login, senha_hash, nome, papel: 'professor' };
            try {
              const res = await supaFetch('contas', {

            salvarEstadoLocalOnly();
            fecharModal();
            toast('Conta criada! Já pode entrar.', 'sucesso');
          };

          if (conta.papel === 'admin') {

            session.modo = 'professor';
            session.abaProfessor = 'turma';

            else { session.escolhendoTurma = true; }
          }
          toast(`Bem-vindo, ${conta.nome}!`, 'sucesso');
          render();
        };
      }

      function bindAdmin() {
        document.getElementById('btn-admin-nuvem').onclick = abrirModalConfigNuvem;
        document.getElementById('btn-admin-sair').onclick = () => {
          session.contaAtiva = null;
          session.modo = 'login';
          render();
        };

        document.getElementById('inp-csv-escolas').onchange = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async () => {
            const linhas = String(reader.result || '').split(/\r?\n/).filter(l => l.trim().length > 0);
            let importadas = 0;
            const novasParaNuvem = [];
            for (const linha of linhas) {
              const sep = linha.includes(';') ? ';' : ',';
              const cols = linha.split(sep).map(c => c.replace(/^"|"$/g, '').trim());
              const cod = cols.find(c => /^53\d{6}$/.test(c));
              if (!cod) continue;
              const nome = cols.find(c => c !== cod && c.length > 4 && !/^\d+$/.test(c));
              if (!nome) continue;
              if (db.escolas.some(x => x.codigo === cod)) continue;
              const obj = { id: genId(), codigo: cod, nome };
              db.escolas.push(obj);
              novasParaNuvem.push({ codigo: cod, nome });
              importadas++;
            }
            if (novasParaNuvem.length > 0) {
              try {
                await supaFetch('escolas?on_conflict=codigo', {
                  method: 'POST',
                  headers: { 'Prefer': 'resolution=ignore-duplicates' },
                  body: JSON.stringify(novasParaNuvem)
                });
                const rem = await supaFetch('escolas?select=*&order=id.asc');
                if (Array.isArray(rem) && rem.length) db.escolas = rem;
              } catch (err) {}
            }
            salvarEstadoLocalOnly();
            toast(importadas > 0 ? `${importadas} escola(s) do DF importadas!` : 'Nenhuma escola nova encontrada no CSV.', importadas > 0 ? 'sucesso' : 'erro');
            render();
          };
          reader.readAsText(file, 'UTF-8');
        };
        document.getElementById('btn-nova-escola').onclick = () => {
          abrirModal(`
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-bold text-lg">Nova Escola</h3>
              <button id="btn-fechar-modal" class="text-gray-400 text-xl px-2">&times;</button>
            </div>
            <input id="inp-esc-cod" placeholder="Código ou INEP (ex.: ESC02)" class="w-full glass-pill rounded-xl px-3 py-2 text-sm mb-2.5 text-white" />
            <input id="inp-esc-nome" placeholder="Nome da escola" class="w-full glass-pill rounded-xl px-3 py-2 text-sm mb-4 text-white" />
            <button id="btn-save-esc" class="w-full glass-gold-btn font-bold py-2.5 rounded-xl">Criar Escola</button>
          `);
          document.getElementById('btn-fechar-modal').onclick = fecharModal;
          document.getElementById('btn-save-esc').onclick = async () => {
            const codigo = document.getElementById('inp-esc-cod').value.trim().toUpperCase();
            const nome = document.getElementById('inp-esc-nome').value.trim();
            if (!codigo || !nome) { toast('Preencha código e nome.', 'erro'); return; }
            const nova = { id: genId(), codigo, nome };
            try {
              const res = await supaFetch('escolas', { method: 'POST', headers: { 'Prefer': 'return=representation' }, body: JSON.stringify({ codigo, nome }) });
              if (Array.isArray(res) && res[0]) nova.id = res[0].id;
            } catch (e) {}
            db.escolas.push(nova);
            salvarEstadoLocalOnly();
            fecharModal();
            toast('Escola criada!', 'sucesso');
            render();
          };
        };
        document.getElementById('btn-novo-coord').onclick = () => {
          abrirModal(`
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-bold text-lg">Novo Coordenador</h3>
              <button id="btn-fechar-modal" class="text-gray-400 text-xl px-2">&times;</button>
            </div>
            <select id="inp-crd-esc" class="w-full glass-pill rounded-xl px-3 py-2 text-sm text-white mb-2.5">
              ${db.escolas.map(e => `<option value="${e.id}" class="bg-[#18181D]">${escapeHtml(e.nome)}</option>`).join('')}
            </select>
            <input id="inp-crd-nome" placeholder="Nome completo" class="w-full glass-pill rounded-xl px-3 py-2 text-sm mb-2.5 text-white" />
            <input id="inp-crd-login" placeholder="Login (sem espaços)" class="w-full glass-pill rounded-xl px-3 py-2 text-sm mb-2.5 text-white" />
            <input id="inp-crd-senha" type="password" placeholder="Senha" class="w-full glass-pill rounded-xl px-3 py-2 text-sm mb-1.5 text-white" />
            <p class="text-[11px] text-gray-400 mb-3">Mínimo 8 caracteres, 1 número e 1 caractere especial.</p>
            <button id="btn-save-crd" class="w-full glass-gold-btn font-bold py-2.5 rounded-xl">Criar Coordenador</button>
          `);
          document.getElementById('btn-fechar-modal').onclick = fecharModal;
          document.getElementById('btn-save-crd').onclick = async () => {
            const escola_id = Number(document.getElementById('inp-crd-esc').value);
            const nome = document.getElementById('inp-crd-nome').value.trim();
            const login = document.getElementById('inp-crd-login').value.trim().toLowerCase();
            const senha = document.getElementById('inp-crd-senha').value;
            if (!nome || !login || !senha) { toast('Preencha todos os campos.', 'erro'); return; }
            if (contemTermoProibido(nome, login, senha)) {
              toast('Termo proibido detectado no nome, login ou senha.', 'erro');
              return;
            }
            const erroSenha = validarSenhaForte(senha);
            if (erroSenha) {
              toast(erroSenha, 'erro');
              return;
            }
            const senha_hash = await sha256Hex(senha);
            const novo = { id: genId(), escola_id, login, senha_hash, nome, papel: 'coordenador' };
            try {
              const res = await supaFetch('contas', { method: 'POST', headers: { 'Prefer': 'return=representation' }, body: JSON.stringify({ escola_id, login, senha_hash, nome, papel: 'coordenador' }) });
              if (Array.isArray(res) && res[0]) novo.id = res[0].id;
            } catch (e) {}
            db.contas.push(novo);
            salvarEstadoLocalOnly();
            fecharModal();
            toast('Coordenador criado!', 'sucesso');
            render();
          };
        };
        document.querySelectorAll('.btn-del-conta').forEach(b => {
          b.onclick = async () => {
            const id = Number(b.dataset.delConta);
            try { await supaFetch(`contas?id=eq.${id}`, { method: 'DELETE' }); } catch (e) {}
            db.contas = db.contas.filter(c => c.id !== id);
            salvarEstadoLocalOnly();
            render();
          };
        });
      }

      function renderTelaBloqueio() {
        return `

            <h1 class="text-2xl font-extrabold mb-2">Sessão encerrada</h1>
            <p class="text-sm text-gray-400 mb-6 max-w-xs">Para proteger os dados da turma, o painel foi bloqueado por inatividade.</p>
            <button id="btn-desbloquear-prof" class="glass-gold-btn font-bold px-6 py-3.5 rounded-2xl mb-3 w-full max-w-xs flex items-center justify-center gap-2">${svgIcon('lock', 'w-4 h-4')} <span>Entrar como Professor</span></button>
            <button id="btn-entrar-aluno-bloq" class="glass-card text-white font-semibold px-6 py-3.5 rounded-2xl w-full max-w-xs flex items-center justify-center gap-2">${svgIcon('backpack', 'w-4 h-4')} <span>Abrir Modo Aluno</span></button>

      function bindTelaBloqueio() {
        document.getElementById('btn-desbloquear-prof').onclick = pedirPinProfessor;
        document.getElementById('btn-entrar-aluno-bloq').onclick = () => {
          session.modo = 'aluno';
          session.alunoAtivoId = null;
          render();
        };
      }

      function renderModoProfessor() {
        const turmaAtual = db.turmas.find(t => t.id === session.turmaAtualId) || db.turmas[0];
        const pendentesCount = db.pedidos.filter(p => p.status === 'pendente_entrega').length;

        const horarioAtivo = encontrarHorarioAtivoAgora();
        const bimestreAtual = encontrarBimestreAtual();
        const podeVoltar = (session.abaProfessor === 'turma' && !session.escolhendoTurma) || (session.abaProfessor === 'config' && session.subConfig !== null) || (session.abaProfessor !== 'turma' && session.abaProfessor !== 'config');
        const header = `
          <header class="glass-header px-4 py-3 flex items-center justify-between sticky top-0 z-30">
            <div class="flex items-center gap-2">
              ${podeVoltar ? `<button id="btn-voltar-secao" title="Voltar" class="glass-pill w-9 h-9 rounded-xl flex items-center justify-center text-white hover:border-[#FFD600]/60 transition">${svgIcon('arrowLeft', 'w-4 h-4')}</button>` : ''}
              ${session.abaProfessor === 'turma' && session.escolhendoTurma
                ? `<span class="font-extrabold text-sm text-white">Turmas</span>`
                : (turmaAtual ? `<select id="sel-turma" class="glass-pill text-white font-bold text-sm px-3 py-2 rounded-2xl outline-none">
                    ${turmasOrdenadas().map(t => `<option value="${t.id}" class="bg-[#18181D]" ${t.id === turmaAtual.id ? 'selected' : ''}>${escapeHtml(t.nome)}</option>`).join('')}
                   </select>` : '<span class="font-bold text-sm">Turmas</span>')
              }
              ${bimestreAtual ? `<span class="text-[10px] glass-accent-purple px-2.5 py-1 rounded-full font-bold text-amarelo">${escapeHtml(bimestreAtual.nome)}</span>` : ''}
            </div>
            <button id="btn-ir-aluno" class="glass-pill text-amarelo text-xs font-bold px-3.5 py-2 rounded-2xl flex items-center gap-1.5 hover:border-[#FFD600]/40 transition">
              ${svgIcon('backpack', 'w-4 h-4')} <span>Aluno</span>
            </button>
          </header>
        `;

        let conteudo = '';
        if (session.abaProfessor === 'turma') conteudo = renderAbaTurma(turmaAtual);
        if (session.abaProfessor === 'entregas') conteudo = renderAbaEntregas();
        if (session.abaProfessor === 'cargos') conteudo = renderAbaCargos(turmaAtual);
        if (session.abaProfessor === 'mercadinho') conteudo = renderAbaMercadinhoAdmin();
        if (session.abaProfessor === 'historico') conteudo = renderAbaHistorico();
        if (session.abaProfessor === 'config') conteudo = renderAbaConfig();

        const nav = `
          <nav class="fixed bottom-0 left-0 right-0 glass-nav z-30">
            <div class="max-w-5xl mx-auto flex justify-around py-2 px-1 text-[11px] font-semibold">
              ${navBtn('config', 'settings', 'Config')}
              ${navBtn('mercadinho', 'store', 'Loja')}
              ${navBtn('turma', 'users', 'Turmas')}
              ${navBtn('historico', 'history', 'Histórico')}
              ${navBtn('entregas', 'gift', 'Entregas', pendentesCount)}
            </div>
          </nav>
        `;

        const mostrarFab = ['turma', 'mercadinho'].includes(session.abaProfessor) || (session.abaProfessor === 'config' && session.subConfig !== 'app');
        const fabHtml = mostrarFab ? `
          <div id="fab-speed-dial" class="fixed bottom-36 right-4 z-40 flex flex-col items-end gap-2 ${session.fabMenuAberto ? '' : 'hidden'}"></div>
          <button id="btn-fab-adicionar" aria-label="Adicionar" style="transition: opacity 750ms cubic-bezier(0.22, 1, 0.36, 1), transform 750ms cubic-bezier(0.22, 1, 0.36, 1);" class="fixed bottom-20 right-4 z-40 glass-gold-btn w-12 h-12 rounded-full shadow-2xl flex items-center justify-center text-2xl font-extrabold leading-none ${session.fabMenuAberto ? 'opacity-100 scale-100 pointer-events-auto' : 'opacity-0 scale-90 pointer-events-none'}">
            ${session.fabMenuAberto ? '&times;' : '+'}
          </button>
        ` : '';
        return header + `<main class="flex-1 p-4">${conteudo}</main>` + fabHtml + nav;
      }

      function navBtn(aba, icone, label, badge = 0) {
        const ativo = session.abaProfessor === aba;
        return `
          <button data-aba="${aba}" class="btn-nav flex flex-col items-center px-2.5 py-1 rounded-2xl relative transition ${ativo ? 'text-amarelo' : 'text-gray-400 hover:text-white'}">
            <span class="mb-1">${svgIcon(icone, 'w-5 h-5')}</span>
            <span>${label}</span>
            ${badge > 0 ? `<span class="absolute -top-0.5 right-0.5 bg-red-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">${badge}</span>` : ''}
          </button>
        `;

      function renderAbaTurma(turma) {
        if (session.escolhendoTurma) {
          return `
            <div class="glass-card !border-red-500/70 !bg-red-950/35 rounded-3xl p-5 mb-4 flex items-start gap-3">
              <span class="text-red-400 shrink-0 mt-0.5">${svgIcon('alertTriangle', 'w-6 h-6')}</span>
              <div>
                <h2 class="font-extrabold text-base text-red-300 mb-0.5">Sem aula no horário atual</h2>
                <p class="text-xs text-red-200/90">Escolha a turma que queira abrir.</p>
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${turmasOrdenadas().map(t => {
                const qtd = db.usuarios.filter(u => u.turmaId === t.id && u.papel !== 'professor').length;
                const totalTurma = totalTokensTurma(t.id);
                const hs = (db.horariosAula || []).filter(h => h.turmaId === t.id);
                const resumoH = hs.length
                  ? hs.map(h => `${DIAS_SEMANA[h.diaSemana]} ${h.inicio}–${h.fim}`).join(' • ')
                  : 'Sem horário cadastrado';
                return `
                  <button data-pick-turma="${t.id}" class="btn-pick-turma glass-card hover:border-[#FFD600] rounded-3xl p-4 text-left flex items-center justify-between gap-3 transition">
                    <div>
                      <div class="font-extrabold text-base text-white">${escapeHtml(t.nome)}</div>
                      <div class="text-xs text-gray-400 mt-0.5">${qtd} aluno(s) • <span class="text-amarelo font-bold">${fmtMoeda(totalTurma)} acumulados</span></div>
                      <div class="text-[11px] text-gray-400 mt-1">${escapeHtml(resumoH)}</div>
                    </div>
                    <span class="glass-gold-btn text-xs font-extrabold px-3 py-2 rounded-xl shrink-0">Abrir &rarr;</span>
                  </button>
                `;
              }).join('')}
            </div>
          `;
        }
        const alunos = alunosDaTurmaOrdenados(turma.id);
        const hoje = hojeISO();
        const ehRetro = session.dataSelecionada !== hoje;
        return `
          <div class="glass-card rounded-2xl p-2.5 mb-3 flex items-center justify-between gap-2 ${ehRetro ? '!border-[#FFD600]/60' : ''}">
            <button id="btn-dia-anterior" class="glass-pill px-3 py-1.5 rounded-xl text-xs font-bold">&larr;</button>
            <button id="btn-abrir-cal" class="flex items-center gap-2 text-xs font-bold px-3 py-1.5 rounded-xl hover:bg-white/5">
              ${svgIcon('calendar', 'w-4 h-4 text-amarelo')}
              <span>${ehRetro ? 'Retroativo: ' : 'Hoje: '}${formatarDataCurta(session.dataSelecionada)}</span>
            </button>
            ${ehRetro
              ? `<button id="btn-voltar-hoje" class="glass-gold-btn px-3 py-1.5 rounded-xl text-xs font-bold">Hoje</button>`
              : `<span class="text-[11px] text-gray-400 px-2">Atual</span>`
            }
          </div>
          <div class="flex items-center justify-between mb-4">
            <div>
              <h2 class="font-extrabold text-lg">Alunos (${alunos.length})</h2>
              <p class="text-xs text-gray-400">Total da turma: <span class="text-amarelo font-bold">${fmtMoeda(totalTokensTurma(turma.id))}</span> • ${formatarDataCurta(session.dataSelecionada)}</p>
            </div>
            <div class="flex gap-1.5 flex-wrap justify-end">
              <button id="btn-trilha-prof" class="glass-pill text-purple-200 px-3 py-2 rounded-2xl text-xs font-bold flex items-center gap-1">${svgIcon('compass', 'w-3.5 h-3.5 text-amarelo')} <span>Bloco II</span></button>
              <button id="btn-chamada" class="glass-accent-purple text-white px-3 py-2 rounded-2xl text-xs font-bold flex items-center gap-1">${svgIcon('clipboardCheck', 'w-3.5 h-3.5 text-amarelo')} <span>Chamada</span></button>
              <button id="btn-cargos-turma" class="glass-pill text-white px-3 py-2 rounded-2xl text-xs font-bold flex items-center gap-1">${svgIcon('briefcase', 'w-3.5 h-3.5 text-amarelo')} <span>Cargos</span></button>
              <button id="btn-multi" class="px-3 py-2 rounded-2xl text-xs font-bold transition ${session.selecaoMultipla ? 'glass-gold-btn' : 'glass-pill text-gray-200'}">
                ${session.selecaoMultipla ? 'Cancelar' : '✓ Vários'}
              </button>
            </div>
          </div>
          ${alunos.length === 0 ? `
            <div class="glass-card rounded-3xl p-8 text-center">
              <div class="w-14 h-14 mx-auto rounded-2xl bg-white/10 flex items-center justify-center text-white mb-3">${svgIcon('users', 'w-7 h-7')}</div>
              <p class="font-semibold mb-1">Turma vazia</p>
              <p class="text-xs text-gray-400">Toque em "+ Aluno" para cadastrar com apelido e silhueta.</p>
            </div>
          ` : `
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
              ${alunos.map(a => {
                const sel = session.selecionados.has(a.id);
                const cargo = cargosDaTurma(turma.id).find(c => getOcupanteCargo(c, turma.id) === a.id);
                return `
                  <button data-aluno-id="${a.id}" class="card-aluno text-center p-4 rounded-3xl glass-card transition flex flex-col items-center ${sel ? '!border-[#FFD600] ring-2 ring-[#FFD600]/40' : 'hover:border-white/30'}">
                    <div class="w-14 h-14 rounded-2xl bg-white/10 border border-white/15 flex items-center justify-center text-white/95 mb-2.5">${renderAvatar(a.avatarId, 'w-7 h-7')}</div>

            <div class="fixed bottom-20 right-20 z-40">
              <button id="btn-lancar-lote" class="glass-gold-btn font-extrabold px-5 py-3.5 rounded-full shadow-2xl flex items-center gap-2">
                ${svgIcon('bolt', 'w-4 h-4')} <span>Dar ${escapeHtml(db.config.moedaPlural)} (${session.selecionados.size})</span>
              </button>
            </div>
          ` : ''}
        `;

                      <div class="text-xs text-amarelo font-semibold mt-0.5">Diária: ${fmtMoeda(c.salario)} / dia</div>
                      <div class="text-xs text-gray-400 mt-1 flex items-center gap-1.5">Responsável: ${ocupante ? renderAvatar(ocupante.avatarId, 'w-3.5 h-3.5') + ' <span>' + escapeHtml(ocupante.apelido) + '</span>' : 'Vago'}</div>

                    <select data-cargo-id="${c.id}" class="sel-ocupante glass-pill rounded-xl px-2.5 py-2 text-xs text-white max-w-[140px]">
                      <option value="" class="bg-[#18181D]">Vago</option>
                      ${alunos.map(a => `<option value="${a.id}" class="bg-[#18181D]" ${a.id === ocupId ? 'selected' : ''}>${escapeHtml(a.apelido)}</option>`).join('')}

                  </div>

      function renderAbaMercadinhoAdmin() {

      function renderAbaHistorico() {
        const hoje = hojeISO();
        const agoraMs = Date.now();
        const filtradas = db.transacoes.filter(t => {
          if (session.historicoTurmaId !== 'todas' && t.turmaId !== Number(session.historicoTurmaId)) {
            return false;
          }
          if (session.historicoPeriodo === 'hoje') {
            return t.criadoEm.startsWith(hoje);
          }
          if (session.historicoPeriodo === 'semana') {
            return (agoraMs - new Date(t.criadoEm).getTime()) <= 7 * 86400000;
          }
          if (session.historicoPeriodo === 'mes') {
            return (agoraMs - new Date(t.criadoEm).getTime()) <= 30 * 86400000;
          }
          return true;
        });
        const lista = filtradas.slice(0, 80);
        const periodos = [
          ['tudo', 'Tudo'],
          ['hoje', 'Dia atual'],
          ['semana', '1 semana'],
          ['mes', '1 mês']
        ];
        return `
          <div class="flex items-center justify-between mb-3">
            <h2 class="font-extrabold text-lg">Histórico (${filtradas.length})</h2>
            <select id="sel-hist-turma" class="glass-pill rounded-xl px-3 py-1.5 text-xs text-white font-semibold">
              <option value="todas" class="bg-[#18181D]" ${session.historicoTurmaId === 'todas' ? 'selected' : ''}>Todas as turmas</option>
              ${turmasOrdenadas().map(t => `<option value="${t.id}" class="bg-[#18181D]" ${String(t.id) === String(session.historicoTurmaId) ? 'selected' : ''}>${escapeHtml(t.nome)}</option>`).join('')}
            </select>
          </div>
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar mb-4">
            ${periodos.map(([id, label]) => `
              <button data-hist-per="${id}" class="btn-hist-per px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 ${session.historicoPeriodo === id ? 'glass-gold-btn' : 'glass-pill text-gray-300'}">${label}</button>
            `).join('')}
          </div>
          ${lista.length === 0 ? `<p class="text-sm text-gray-400">Sem registros.</p>` : `
            <div class="space-y-2.5">
              ${lista.map(t => {
                const orig = db.usuarios.find(u => u.id === t.origemId);
                const dest = db.usuarios.find(u => u.id === t.destinoId);
                const turma = db.turmas.find(tu => tu.id === t.turmaId);
                const sinal = t.valor >= 0 ? '+' : '';
                return `
                  <div class="glass-card rounded-3xl p-3.5 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                      <span class="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center text-white/90">${dest ? renderAvatar(dest.avatarId, 'w-5 h-5') : svgIcon('user', 'w-5 h-5')}</span>
                      <div>
                        <div class="font-bold text-sm">${dest ? escapeHtml(dest.apelido) : 'Aluno'} • ${escapeHtml(t.motivo)}</div>
                        <div class="text-[11px] text-gray-400 mt-0.5">Por ${orig ? escapeHtml(orig.apelido) : 'Sistema'} (${turma ? escapeHtml(turma.nome) : ''}) • ${formatarDataHora(t.criadoEm)}</div>
                      </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                      <span class="font-extrabold text-sm ${t.valor >= 0 ? 'text-amarelo' : 'text-red-400'}">${sinal}${fmtMoeda(t.valor)}</span>
                      <button data-estornar-tx="${t.id}" title="Estornar lançamento" class="btn-estornar-tx glass-pill text-red-400 p-1.5 rounded-lg hover:border-red-400/50">${svgIcon('trash', 'w-3.5 h-3.5')}</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        `;
      }

      function bindModoProfessor() {
        const selTurma = document.getElementById('sel-turma');
        if (selTurma) {
          selTurma.onchange = (e) => {
            session.turmaAtualId = Number(e.target.value);
            session.escolhendoTurma = false;
            session.selecionados.clear();
            session.selecaoMultipla = false;
            render();
          };
        }
        const btnVoltarSecao = document.getElementById('btn-voltar-secao');
        if (btnVoltarSecao) {
          btnVoltarSecao.onclick = () => {
            if (session.abaProfessor === 'turma' && !session.escolhendoTurma) {
              session.escolhendoTurma = true;
            } else if (session.abaProfessor === 'config' && session.subConfig !== null) {
              session.subConfig = null;
            } else {
              session.abaProfessor = session.abaAnterior && session.abaAnterior !== session.abaProfessor ? session.abaAnterior : 'turma';
            }
            render();
          };
        }

        document.getElementById('btn-ir-aluno').onclick = () => {
          session.modo = 'aluno';
          session.alunoTurmaId = null;
          session.alunoBusca = '';
          session.alunoAtivoId = null;
          session.carrinho = {};
          render();
        };
        document.querySelectorAll('.btn-nav').forEach(b => {
          b.onclick = () => {
            if (b.dataset.aba !== session.abaProfessor) {
              session.abaAnterior = session.abaProfessor;
            }
            session.abaProfessor = b.dataset.aba;
            session.fabMenuAberto = false;
            if (b.dataset.aba === 'config') session.subConfig = null;
            render();
          };
        });

              <div>
                <label class="block text-[10px] text-gray-400 mb-1">Fim</label>

          `);

            db.bimestres.push({ id: genId(), nome, inicio, fim });
            salvarEstado();
            fecharModal();
            toast('Bimestre cadastrado!', 'sucesso');
            render();
          };
        }

        function abrirModalHorariosGlobal(turmaIdInicial) {
          let turmaIdSel = turmaIdInicial || turmasOrdenadas()[0]?.id;
          let rascunhos = (db.horariosAula || [])
            .filter(h => h.turmaId === turmaIdSel)
            .sort((a, b) => a.diaSemana - b.diaSemana || a.inicio.localeCompare(b.inicio))
            .map(h => ({ id: h.id, diaSemana: h.diaSemana, inicio: h.inicio, fim: h.fim }));
          if (rascunhos.length === 0) {
            rascunhos.push({ id: genId(), diaSemana: new Date().getDay(), inicio: '07:30', fim: somarMinutos('07:30', 45) });
          }

          function lerCamposAtuais() {
            rascunhos = rascunhos.map((r, idx) => {
              const diaEl = document.getElementById(`hor-dia-${idx}`);
              const iniEl = document.getElementById(`hor-ini-${idx}`);
              const fimEl = document.getElementById(`hor-fim-${idx}`);
              return {
                id: r.id,
                diaSemana: diaEl ? Number(diaEl.value) : r.diaSemana,
                inicio: iniEl ? iniEl.value : r.inicio,
                fim: fimEl ? fimEl.value : r.fim
              };
            });
          }

          function renderEditor() {
            const linhas = rascunhos.length === 0
              ? `<p class="text-xs text-gray-400 mb-3">Nenhum horário para esta turma. Adicione abaixo.</p>`
              : rascunhos.map((r, idx) => `
                  <div class="glass-pill rounded-2xl p-3 mb-2.5">
                    <div class="flex items-center justify-between gap-2 mb-2">
                      <select id="hor-dia-${idx}" class="bg-[#121218] border border-white/15 rounded-xl px-2.5 py-1.5 text-xs text-white font-semibold">
                        ${DIAS_SEMANA.map((d, i) => `<option value="${i}" ${i === r.diaSemana ? 'selected' : ''}>${d}</option>`).join('')}
                      </select>
                      <button type="button" data-rem-slot="${idx}" class="btn-rem-slot text-red-400 text-xs font-bold px-2 py-1">Remover &times;</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                      <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">Início</label>
                        <input id="hor-ini-${idx}" data-slot-idx="${idx}" type="time" value="${r.inicio}" class="inp-hor-ini w-full bg-[#121218] border border-white/15 rounded-xl px-2.5 py-1.5 text-xs text-white" />
                      </div>
                      <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">Fim</label>
                        <input id="hor-fim-${idx}" type="time" value="${r.fim}" class="w-full bg-[#121218] border border-white/15 rounded-xl px-2.5 py-1.5 text-xs text-white" />
                      </div>
                    </div>
                  </div>
                `).join('');

            abrirModal(`
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-lg">Horários da Turma</h3>
                <button id="btn-fechar-modal" class="text-gray-400 text-xl px-2">&times;</button>
              </div>
              <label class="block text-xs text-gray-400 mb-1">Turma</label>
              <select id="inp-hor-turma" class="w-full glass-pill rounded-xl px-3 py-2.5 text-sm text-white mb-3">
                ${turmasOrdenadas().map(t => `<option value="${t.id}" class="bg-[#18181D]" ${t.id === turmaIdSel ? 'selected' : ''}>${escapeHtml(t.nome)}</option>`).join('')}
              </select>
              <div class="max-h-64 overflow-y-auto pr-0.5 mb-3">${linhas}</div>
              <button type="button" id="btn-add-mais-horario" class="w-full glass-accent-purple text-white text-xs font-bold py-2.5 rounded-xl mb-2.5">+ Adicionar outro horário</button>
              <button type="button" id="btn-save-hor" class="w-full glass-gold-btn font-bold py-3 rounded-xl">Salvar e encerrar</button>
            `);

            document.getElementById('btn-fechar-modal').onclick = fecharModal;
            document.getElementById('inp-hor-turma').onchange = (e) => {
              turmaIdSel = Number(e.target.value);
              rascunhos = (db.horariosAula || [])
                .filter(h => h.turmaId === turmaIdSel)
                .sort((a, b) => a.diaSemana - b.diaSemana || a.inicio.localeCompare(b.inicio))
                .map(h => ({ id: h.id, diaSemana: h.diaSemana, inicio: h.inicio, fim: h.fim }));
              renderEditor();
            };
            document.querySelectorAll('.btn-rem-slot').forEach(b => {
              b.onclick = () => {
                lerCamposAtuais();
                rascunhos.splice(Number(b.dataset.remSlot), 1);
                renderEditor();
              };
            });
            document.querySelectorAll('.inp-hor-ini').forEach(inp => {
              inp.onchange = () => {
                const idx = Number(inp.dataset.slotIdx);
                const fimEl = document.getElementById(`hor-fim-${idx}`);
                if (fimEl && inp.value) fimEl.value = somarMinutos(inp.value, 45);
              };
            });
            document.getElementById('btn-add-mais-horario').onclick = () => {
              lerCamposAtuais();
              const ultimo = rascunhos[rascunhos.length - 1];
              const novoIni = ultimo ? ultimo.fim : '07:30';
              rascunhos.push({
                id: genId(),
                diaSemana: ultimo ? ultimo.diaSemana : new Date().getDay(),
                inicio: novoIni,
                fim: somarMinutos(novoIni, 45)
              });
              renderEditor();
            };
            document.getElementById('btn-save-hor').onclick = () => {
              lerCamposAtuais();
              for (const r of rascunhos) {
                if (!r.inicio || !r.fim || r.fim <= r.inicio) {
                  toast('Verifique um horário com fim menor ou igual ao início.', 'erro');
                  return;
                }
              }
              db.horariosAula = (db.horariosAula || []).filter(h => h.turmaId !== turmaIdSel);
              rascunhos.forEach(r => {
                db.horariosAula.push({ id: r.id || genId(), turmaId: turmaIdSel, diaSemana: r.diaSemana, inicio: r.inicio, fim: r.fim });
              });
              salvarEstado();
              fecharModal();
              toast('Horários salvos!', 'sucesso');
              render();
            };
          }
          renderEditor();
        }

        function abrirModalRegraGlobal(regraExistente = null) {
          let iconeSel = regraExistente ? regraExistente.icone : ICONES_ATIVIDADES[0];
          let titVal = regraExistente ? regraExistente.titulo : '';
          let valVal = regraExistente ? String(regraExistente.valor) : '2';

          function renderRegraModal() {
            const iconesHtml = ICONES_ATIVIDADES.map(ic => `
              <button type="button" data-ic="${ic}" class="btn-ic-regra w-10 h-10 rounded-xl flex items-center justify-center border transition ${iconeSel === ic ? 'border-[#FFD600] bg-yellow-400/20 text-amarelo' : 'border-white/10 bg-white/5 text-white/80'}">
                ${svgIcon(ic, 'w-5 h-5')}
              </button>
            `).join('');

            abrirModal(`
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-lg">${regraExistente ? 'Editar Atividade' : 'Nova Atividade'}</h3>
                <button id="btn-fechar-modal" class="text-gray-400 text-xl px-2">&times;</button>
              </div>
              <label class="block text-xs text-gray-400 mb-1">Nome da atividade</label>
              <input id="inp-regra-tit" value="${escapeHtml(titVal)}" placeholder="Ex.: Caderno organizado" class="w-full glass-pill rounded-xl px-3 py-2 text-sm mb-2.5 text-white" />
              <label class="block text-xs text-gray-400 mb-1">Quantidade de ${escapeHtml(db.config.moedaPlural)}</label>
              <input id="inp-regra-val" type="number" value="${escapeHtml(valVal)}" class="w-full glass-pill rounded-xl px-3 py-2 text-sm mb-3 text-white" />
              <label class="block text-xs text-gray-400 mb-2">Ícone da atividade (20 opções)</label>
              <div class="grid grid-cols-5 gap-2 mb-4">${iconesHtml}</div>
              <button id="btn-save-regra" class="w-full glass-gold-btn font-bold py-2.5 rounded-xl mb-2">${regraExistente ? 'Salvar Alterações' : 'Criar Atividade'}</button>
              ${regraExistente ? `<button id="btn-del-regra" class="w-full bg-red-900/50 border border-red-400/30 text-red-200 font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5">${svgIcon('trash', 'w-4 h-4')} <span>Excluir Atividade</span></button>` : ''}
            `);

            document.getElementById('btn-fechar-modal').onclick = fecharModal;
            document.querySelectorAll('.btn-ic-regra').forEach(b => {
              b.onclick = () => {
                titVal = document.getElementById('inp-regra-tit').value;
                valVal = document.getElementById('inp-regra-val').value;
                iconeSel = b.dataset.ic;
                renderRegraModal();
              };
            });
            document.getElementById('btn-save-regra').onclick = () => {
              const titulo = document.getElementById('inp-regra-tit').value.trim();
              const valor = Number(document.getElementById('inp-regra-val').value) || 0;
              if (!titulo || valor <= 0) { toast('Preencha nome e valor válido.', 'erro'); return; }
              if (regraExistente) {
                regraExistente.titulo = titulo;
                regraExistente.valor = valor;
                regraExistente.icone = iconeSel;
                toast('Atividade atualizada!', 'sucesso');
              } else {
                db.regras.push({ id: genId(), titulo, valor, icone: iconeSel, monitorPode: true });
                toast('Atividade criada!', 'sucesso');
              }
              salvarEstado();
              fecharModal();
              render();
            };
            const btnDel = document.getElementById('btn-del-regra');
            if (btnDel) {
              btnDel.onclick = () => {
                db.regras = db.regras.filter(r => r.id !== regraExistente.id);
                salvarEstado();
                fecharModal();
                toast('Atividade excluída.', 'sucesso');
                render();
              };
            }
          }
          renderRegraModal();
        }

        limparTimersFab();
        const btnFab = document.getElementById('btn-fab-adicionar');
        const speedDial = document.getElementById('fab-speed-dial');
        if (btnFab) {
          const opcoes = [];
          if (session.abaProfessor === 'turma') {
            if (session.escolhendoTurma) {
              opcoes.push({ label: 'Nova Turma', icone: 'users', fn: abrirModalNovaTurma });
            } else {
              opcoes.push({ label: 'Adicionar Alunos', icone: 'user', fn: () => abrirModalNovoAluno() });
              opcoes.push({ label: 'Nova Turma', icone: 'users', fn: abrirModalNovaTurma });
            }
          } else if (session.abaProfessor === 'mercadinho') {
            opcoes.push({ label: 'Novo Item', icone: 'store', fn: abrirModalNovoItemLoja });
          } else if (session.abaProfessor === 'config') {
            if (session.subConfig === 'escola') {
              opcoes.push({ label: 'Nova Turma', icone: 'users', fn: abrirModalNovaTurma });
              opcoes.push({ label: 'Novo Horário', icone: 'calendar', fn: () => abrirModalHorariosGlobal(turmasOrdenadas()[0]?.id) });
              opcoes.push({ label: 'Novo Bimestre', icone: 'clock', fn: abrirModalNovoBimestre });
            } else if (session.subConfig === 'regras') {
              opcoes.push({ label: 'Novo Cargo', icone: 'briefcase', fn: abrirModalNovoCargo });
              opcoes.push({ label: 'Nova Atividade', icone: 'star', fn: () => abrirModalRegraGlobal(null) });
            } else {
              opcoes.push({ label: 'Nova Turma', icone: 'users', fn: abrirModalNovaTurma });
              opcoes.push({ label: 'Novo Horário', icone: 'calendar', fn: () => abrirModalHorariosGlobal(turmasOrdenadas()[0]?.id) });
              opcoes.push({ label: 'Novo Bimestre', icone: 'clock', fn: abrirModalNovoBimestre });
              opcoes.push({ label: 'Novo Cargo', icone: 'briefcase', fn: abrirModalNovoCargo });
              opcoes.push({ label: 'Nova Atividade', icone: 'star', fn: () => abrirModalRegraGlobal(null) });
            }
          }

          if (speedDial && session.fabMenuAberto) {
            speedDial.innerHTML = opcoes.map((op, i) => `
              <button data-fab-op="${i}" class="btn-fab-op flex items-center gap-2 transition hover:scale-105">
                <span class="glass-card px-2.5 py-1 rounded-full text-[11px] font-bold shadow-lg whitespace-nowrap">${op.label}</span>
                <span class="glass-gold-btn w-8 h-8 rounded-full flex items-center justify-center shadow-lg shrink-0">${svgIcon(op.icone, 'w-4 h-4')}</span>
              </button>
            `).join('');
            document.querySelectorAll('.btn-fab-op').forEach(b => {
              b.onclick = () => {
                const idx = Number(b.dataset.fabOp);
                session.fabMenuAberto = false;
                render();
                opcoes[idx].fn();
              };
            });
          } else {
            fabAppearTimer = setTimeout(() => {
              const el = document.getElementById('btn-fab-adicionar');
              if (!el || session.fabMenuAberto) return;
              el.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
              el.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
              fabFadeTimer = setTimeout(() => {
                const el2 = document.getElementById('btn-fab-adicionar');
                if (!el2 || session.fabMenuAberto) return;
                el2.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
                el2.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
              }, 2000);
            }, 1500);
          }

          btnFab.onclick = () => {
            limparTimersFab();
            session.fabMenuAberto = !session.fabMenuAberto;
            render();
          };
        }

        if (session.abaProfessor === 'turma') {
          if (session.escolhendoTurma) {
            document.querySelectorAll('.btn-pick-turma').forEach(b => {
              b.onclick = () => {
                session.turmaAtualId = Number(b.dataset.pickTurma);
                session.escolhendoTurma = false;
                render();
              };
            });
            return;
          }
          document.getElementById('btn-abrir-cal').onclick = abrirModalCalendario;
          document.getElementById('btn-dia-anterior').onclick = () => {
            const d = new Date(session.dataSelecionada + 'T12:00:00');
            d.setDate(d.getDate() - 1);
            session.dataSelecionada = d.toISOString().slice(0, 10);
            render();
          };
          const btnVoltarHoje = document.getElementById('btn-voltar-hoje');
          if (btnVoltarHoje) {
            btnVoltarHoje.onclick = () => {
              session.dataSelecionada = hojeISO();
              render();
            };
          }
          const btnTrilhaProf = document.getElementById('btn-trilha-prof');
          if (btnTrilhaProf) btnTrilhaProf.onclick = () => abrirTrilhaBloco2(null);
          document.querySelectorAll('.btn-broches-aluno').forEach(b => {
            b.onclick = (ev) => {
              ev.stopPropagation();
              abrirModalBrochesAluno(Number(b.dataset.brochesAluno));
            };
          });
          document.getElementById('btn-chamada').onclick = () => {
            const turmaObj = db.turmas.find(t => t.id === session.turmaAtualId) || db.turmas[0];
            if (turmaObj) abrirModalChamada(turmaObj);
          };
          document.getElementById('btn-cargos-turma').onclick = () => {
            session.abaAnterior = 'turma';
            session.abaProfessor = 'cargos';
            render();
          };
          document.getElementById('btn-multi').onclick = () => {
            session.selecaoMultipla = !session.selecaoMultipla;
            session.selecionados.clear();
            render();
          };
          document.querySelectorAll('.card-aluno').forEach(c => {
            c.onclick = () => {
              const id = Number(c.dataset.alunoId);
              if (session.selecaoMultipla) {
                if (session.selecionados.has(id)) session.selecionados.delete(id);
                else session.selecionados.add(id);
                render();
              } else {
                abrirModalLancar([id]);
              }
            };
          });
          const btnLote = document.getElementById('btn-lancar-lote');
          if (btnLote) btnLote.onclick = () => abrirModalLancar(Array.from(session.selecionados));
        }

        if (session.abaProfessor === 'entregas') {
          document.querySelectorAll('.btn-entregar').forEach(b => {
            b.onclick = () => {
              const pid = Number(b.dataset.pedidoId);
              const ped = db.pedidos.find(p => p.id === pid);
              if (ped) {
                ped.status = 'entregue';
                ped.entregueEm = new Date().toISOString();
                salvarEstado();
                toast('Recompensa marcada como entregue!', 'sucesso');
                render();
              }
            };
          });
        }

        if (session.abaProfessor === 'cargos') {
          document.getElementById('btn-pagar-dia').onclick = () => {
            const dataRef = session.dataSelecionada;
            const tid = session.turmaAtualId;
            const cargos = cargosDaTurma(tid).filter(c => {
              const uid = getOcupanteCargo(c, tid);
              const ult = getPagamentoCargo(c, tid);
              return uid && !(ult && ult.startsWith(dataRef));
            });
            if (!cargos.length) {
              toast('Todos os cargos ocupados já foram pagos neste dia.', 'erro');
              return;
            }
            cargos.forEach(c => {
              const uid = getOcupanteCargo(c, tid);
              lancarIps(1, [uid], c.salario, `Diária: ${c.titulo}`, 'salario', dataRef);
              setPagamentoCargo(c, tid, dataRef);
            });
            salvarEstado();
            toast(`Diária de ${cargos.length} cargo(s) paga!`, 'sucesso');
            render();
          };
          document.querySelectorAll('.sel-ocupante').forEach(s => {
            s.onchange = () => {
              const cid = Number(s.dataset.cargoId);
              const cargo = db.cargos.find(c => c.id === cid);
              if (cargo) {
                setOcupanteCargo(cargo, session.turmaAtualId, s.value ? Number(s.value) : null);
                salvarEstado();
                toast('Cargo atualizado!');
                render();
              }
            };
          });
        }

        if (session.abaProfessor === 'mercadinho') {
          document.querySelectorAll('.btn-edit-item').forEach(b => {
            b.onclick = () => {
              const item = db.itensMercadinho.find(i => i.id === Number(b.dataset.editItem));

              abrirModal(`
                <div class="flex items-center justify-between mb-3">
                  <h3 class="font-bold text-lg">Editar Item</h3>

                  const scale = Math.min(maxDim / img.width, maxDim / img.height, 1);
                  const w = Math.max(1, Math.round(img.width * scale));
                  const h = Math.max(1, Math.round(img.height * scale));
                  const canvas = document.createElement('canvas');
                  canvas.width = w;
                  canvas.height = h;
                  const ctx = canvas.getContext('2d');
                  ctx.drawImage(img, 0, 0, w, h);
                  const imgData = ctx.getImageData(0, 0, w, h);
                  const data = imgData.data;
                  // Amostra a cor de fundo do canto superior esquerdo

                    const dr = data[i] - bgR;
                    const dg = data[i + 1] - bgG;
                    const db2 = data[i + 2] - bgB;
                    const dist = Math.sqrt(dr * dr + dg * dg + db2 * db2);
                    if (dist < 48) {
