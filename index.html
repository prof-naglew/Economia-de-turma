<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Economia de Fichas (ABA)</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #07070B;
      color: #F5F5F7;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      transition: background-color 180ms ease-out, color 180ms ease-out;
    }
    .glass-card, .glass-pill, .glass-accent-purple {
      contain: layout style;
      transition: transform 120ms cubic-bezier(0.22, 1, 0.36, 1), opacity 120ms ease-out;
    }
    /* Orbes de luz ambiente para o efeito Liquid Glass (GPU-leve, sem blur pesado) */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      contain: strict;
      transform: translate3d(0, 0, 0);
    }
    .orb-purple {
      position: absolute;
      width: 480px;
      height: 480px;
      top: -150px;
      left: -130px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.34) 0%, rgba(106, 27, 154, 0.10) 48%, transparent 72%);
    }
    .orb-gold {
      position: absolute;
      width: 400px;
      height: 400px;
      bottom: 6%;
      right: -130px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(255, 214, 0, 0.18) 0%, rgba(255, 214, 0, 0.04) 48%, transparent 72%);
    }
    .orb-deep {
      position: absolute;
      width: 440px;
      height: 440px;
      top: 40%;
      left: 22%;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(88, 28, 135, 0.22) 0%, transparent 68%);
    }

    /* Superfícies Liquid Glass (otimizadas para 60–120 FPS) */
    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.10) 0%, rgba(36, 30, 54, 0.72) 45%, rgba(16, 15, 24, 0.86) 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), 0 8px 22px rgba(0, 0, 0, 0.30);
    }
    .glass-header {
      background: linear-gradient(180deg, rgba(38, 26, 62, 0.72), rgba(16, 14, 26, 0.68));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.07);
      transform: translate3d(0, 0, 0);
    }
    .glass-nav {
      background: linear-gradient(180deg, rgba(30, 26, 46, 0.76), rgba(12, 12, 18, 0.86));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 255, 255, 0.20);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
      transform: translate3d(0, 0, 0);
    }
    .glass-pill {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.06));
      border: 1px solid rgba(255, 255, 255, 0.20);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }
    .glass-accent-purple {
      background: linear-gradient(135deg, rgba(130, 78, 210, 0.68), rgba(56, 0, 107, 0.82));
      border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.30), 0 10px 26px rgba(56, 0, 107, 0.34);
    }
    #modal-content {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.16) 0%, rgba(34, 28, 52, 0.64) 45%, rgba(18, 16, 28, 0.78) 100%) !important;
      backdrop-filter: blur(18px) saturate(160%) !important;
      -webkit-backdrop-filter: blur(18px) saturate(160%) !important;
      border: 1px solid rgba(255, 255, 255, 0.26) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.34), 0 18px 42px rgba(0, 0, 0, 0.44) !important;
      will-change: transform, opacity;
      transform: translate3d(0, 12px, 0) scale(0.97);
      opacity: 0;
      transition: transform 150ms cubic-bezier(0.22, 1, 0.36, 1), opacity 150ms ease-out;
    }
    #modal-backdrop.is-open #modal-content {
      transform: translate3d(0, 0, 0) scale(1);
      opacity: 1;
    }
    .toast-gpu {
      will-change: transform, opacity;
      transform: translate3d(0, -10px, 0) scale(0.96);
      opacity: 0;
      transition: transform 140ms cubic-bezier(0.22, 1, 0.36, 1), opacity 140ms ease-out;
    }
    .toast-gpu.is-visible {
      transform: translate3d(0, 0, 0) scale(1);
      opacity: 1;
    }
    .glass-gold-btn {
      background: linear-gradient(135deg, #FFE44D, #FFD600);
      color: #09090D;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65), 0 8px 22px rgba(255, 214, 0, 0.25);
    }
    .text-amarelo { color: #FFD600; }
    .border-card { border-color: rgba(255, 255, 255, 0.13); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Tema Claro Liquid Glass */
    body.theme-light {
      background-color: #F2EFF9;
      color: #181622;
    }
    body.theme-light .orb-purple {
      background: radial-gradient(circle, rgba(138, 43, 226, 0.22) 0%, rgba(106, 27, 154, 0.04) 55%, transparent 75%);
    }
    body.theme-light .orb-gold {
      background: radial-gradient(circle, rgba(255, 196, 0, 0.25) 0%, transparent 75%);
    }
    body.theme-light .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.68), rgba(240, 234, 255, 0.52));
      border-color: rgba(106, 27, 154, 0.20);
      box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, 0.92), 0 8px 24px rgba(56, 0, 107, 0.10);
      color: #181622;
    }
    body.theme-light #modal-content {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.66), rgba(242, 236, 255, 0.56)) !important;
      border-color: rgba(106, 27, 154, 0.24) !important;
      box-shadow: inset 0 1.5px 1px rgba(255, 255, 255, 0.95), 0 24px 48px rgba(56, 0, 107, 0.18) !important;
    }
    body.theme-light .glass-header {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.85), rgba(242, 238, 252, 0.78));
      border-bottom-color: rgba(106, 27, 154, 0.14);
      color: #181622;
    }
    body.theme-light .glass-nav {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(245, 242, 252, 0.95));
      border-top-color: rgba(106, 27, 154, 0.14);
    }
    body.theme-light .glass-pill {
      background: rgba(106, 27, 154, 0.08);
      border-color: rgba(106, 27, 154, 0.18);
      color: #181622;
    }
    body.theme-light .text-white { color: #181622 !important; }
    body.theme-light .text-gray-200,
    body.theme-light .text-gray-300 { color: #38344A !important; }
    body.theme-light .text-gray-400,
    body.theme-light .text-gray-500 { color: #635E78 !important; }
    body.theme-light .text-amarelo { color: #8A5A00 !important; }
    body.theme-light .glass-accent-purple,
    body.theme-light .glass-accent-purple *,
    body.theme-light .glass-accent-purple .text-white { color: #FFFFFF !important; }
    body.theme-light .glass-accent-purple .text-amarelo { color: #FFD600 !important; }
    body.theme-light .glass-gold-btn,
    body.theme-light .glass-gold-btn * { color: #09090D !important; }
    body.theme-light .bg-white\/10,
    body.theme-light .bg-white\/5 { background-color: rgba(106, 27, 154, 0.10) !important; }
    body.theme-light .bg-\[\#121218\],
    body.theme-light .bg-\[\#18181D\] {
      background-color: rgba(255, 255, 255, 0.92) !important;

      border-color: rgba(106, 27, 154, 0.25) !important;
    }
    body.theme-light select option {

    body.theme-light .border-white\/10,
    body.theme-light .border-white\/15,
    body.theme-light .border-white\/20 {
      border-color: rgba(106, 27, 154, 0.18) !important;
    }
    body.theme-light .text-emerald-300,
    body.theme-light .text-emerald-400 { color: #047857 !important; }
    body.theme-light .text-red-400 { color: #B91C1C !important; }
    body.theme-light .text-purple-100,
    body.theme-light .text-purple-200,
    body.theme-light .text-purple-300 { color: #581C87 !important; }
    body.theme-light .glass-accent-purple .text-purple-100,
    body.theme-light .glass-accent-purple .text-purple-200 { color: #F3E8FF !important; }
    body.theme-light .bg-red-950\/50,
    body.theme-light .bg-red-950\/35 {
      background-color: #FEE2E2 !important;
      border-color: #DC2626 !important;
    }
    body.theme-light .text-red-300,
    body.theme-light .text-red-200\/90,
    body.theme-light .text-red-200 { color: #991B1B !important; }
  
    .broche-locked {
      filter: grayscale(100%);
      opacity: 0.36;
      transform: translate3d(0, 0, 0) scale(0.96);
      transition: transform 140ms cubic-bezier(0.22, 1, 0.36, 1), opacity 140ms ease-out;
    }
    .broche-unlocked {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1.03);
      transition: transform 140ms cubic-bezier(0.22, 1, 0.36, 1), opacity 140ms ease-out;
    }
  </style>

  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'economia_turma_v1';
      const CLOUD_KEY = 'economia_turma_cloud_cfg';
      const ADMIN_HASH = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';
      const NAGLEW_HASH = '1692738f7d5e4389e3aaceabdd1506fb0c41b5edd1ba184474c69de7f085e236';

      const TERMOS_PROIBIDOS = [
        'nazi', 'nazis', 'hitler', 'suastica', 'reich', 'ss88', '1488',
        'genocid', 'holocaust', 'fascis', 'kkk', 'klux', 'racis',
        'macaco', 'crioulo', 'favelado', 'viado', 'bicha', 'sapatao',
        'puta', 'vadia', 'vagabund', 'corno', 'arromb', 'fdp', 'caralho',
        'buceta', 'pau', 'merda', 'desgrac', 'retardad', 'aleijad',
        'terroris', 'extremis', 'eugenia', 'supremac'
      ];

      function contemTermoProibido(...textos) {
        const norm = s => String(s || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]/g, '');
        return textos.some(t => {
          const clean = norm(t);
          return TERMOS_PROIBIDOS.some(bad => clean.includes(bad));
        });
      }

      function validarSenhaForte(senha) {
        const s = String(senha || '');
        if (s.length < 8) return 'A senha deve ter pelo menos 8 caracteres.';
        if (!/[A-Z]/.test(s)) return 'A senha deve conter pelo menos 1 letra maiúscula.';
        if (!/[0-9]/.test(s)) return 'A senha deve conter pelo menos 1 número.';
        if (!/[^A-Za-z0-9\s]/.test(s)) return 'A senha deve conter pelo menos 1 caractere especial (ex: !@#$%).';
        return '';
      }

      async function sha256Hex(texto) {
        if (window.crypto && crypto.subtle) {
          const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
        return texto;
      }

      function normalizeSupaUrl(raw) {
        let u = (raw || '').trim().replace(/^SUPABASE_URL\s*=\s*/i, '').replace(/^["']|["']$/g, '').trim();
        if (!u) return '';
        u = u.replace(/^https?:\/\//i, (m) => m.toLowerCase());
        if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
        return u.replace(/\/+$/, '');
      }
      function normalizeSupaKey(raw) {
        return (raw || '').trim().replace(/^SUPABASE_(PUBLISHABLE_KEY|ANON_KEY)\s*=\s*/i, '').replace(/^["']|["']$/g, '').trim();
      }
      const DEFAULT_CLOUD_URL = 'https://eseoqxzpfudlchehrwuy.supabase.co';
      const DEFAULT_CLOUD_KEY = 'sb_publishable_ZIPAPngHGdnvhd1Y4IQJjA_fOpQWW0J';

      function getCloudCfg() {
        try {
          const raw = localStorage.getItem(CLOUD_KEY);
          if (raw) {
            const p = JSON.parse(raw);
            const u = normalizeSupaUrl(p.url);
            const k = normalizeSupaKey(p.key);
            if (u && k) return { url: u, key: k };
          }
        } catch (e) {}
        return { url: DEFAULT_CLOUD_URL, key: DEFAULT_CLOUD_KEY };
      }

      function saveCloudCfg(url, key) {
        try {
          localStorage.setItem(CLOUD_KEY, JSON.stringify({ url: normalizeSupaUrl(url), key: normalizeSupaKey(key) }));
        } catch (e) {}
      }

      let _supaClientCache = { url: '', key: '', client: null };
      function getSupaClient() {
        const cfg = getCloudCfg();
        if (!cfg.url || !cfg.key || !window.supabase || typeof window.supabase.createClient !== 'function') return null;
        if (_supaClientCache.client && _supaClientCache.url === cfg.url && _supaClientCache.key === cfg.key) {
          return _supaClientCache.client;
        }
        const client = window.supabase.createClient(cfg.url, cfg.key, {
          auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
        });
        _supaClientCache = { url: cfg.url, key: cfg.key, client };
        return client;
      }

      async function supaFetch(path, opts = {}) {
        const cfg = getCloudCfg();
        if (!cfg.url || !cfg.key) return null;
        const client = getSupaClient();
        if (client) {
          const [tablePart, queryPart = ''] = path.split('?');
          const params = new URLSearchParams(queryPart);
          const method = (opts.method || 'GET').toUpperCase();
          const body = opts.body ? JSON.parse(opts.body) : null;
          let q;
          if (method === 'GET') {
            q = client.from(tablePart).select(params.get('select') || '*');
            for (const [k, v] of params.entries()) {
              if (k !== 'select' && k !== 'order' && v.startsWith('eq.')) {
                q = q.eq(k, v.slice(3));
              }
            }
            const ord = params.get('order');
            if (ord) {
              const [col, dir] = ord.split('.');
              q = q.order(col, { ascending: dir !== 'desc' });
            }
          } else if (method === 'POST') {
            const onConf = params.get('on_conflict');
            if (onConf) {
              q = client.from(tablePart).upsert(body, { onConflict: onConf });
            } else {
              q = client.from(tablePart).insert(body);
            }
            const prefer = opts.headers && (opts.headers['Prefer'] || opts.headers['prefer']);
            if (prefer && prefer.includes('return=representation')) {
              q = q.select();
            }
          } else if (method === 'DELETE') {
            q = client.from(tablePart).delete();
            for (const [k, v] of params.entries()) {
              if (v.startsWith('eq.')) q = q.eq(k, v.slice(3));
            }
          }
          if (q) {
            const { data, error } = await q;
            if (error) throw new Error(error.message || `HTTP ${error.code || 400}`);
            return data;
          }
        }
        const headers = {
          'apikey': cfg.key,
          'Content-Type': 'application/json',
          ...(opts.headers || {})
        };
        if (!cfg.key.startsWith('sb_')) {
          headers['Authorization'] = 'Bearer ' + cfg.key;
        }
        const res = await fetch(`${cfg.url}/rest/v1/${path}`, { ...opts, headers });
        if (!res.ok) {
          let errDetail = '';
          try { errDetail = (await res.json())?.message || ''; } catch (e) {}
          throw new Error(`HTTP ${res.status}${errDetail ? ' - ' + errDetail : ''}`);
        }
        const text = await res.text();
        return text ? JSON.parse(text) : null;
      }

      async function sincronizarComNuvem(silencioso = false) {
        const cfg = getCloudCfg();
        if (!cfg.url || !cfg.key) return false;
        try {
          const escolaId = session.contaAtiva?.escola_id || db.escolas[0]?.id;
          const [escolasRem, contasRem, est] = await Promise.all([
            (!db.escolas || db.escolas.length < 10) ? supaFetch('escolas?select=*&order=id.asc') : Promise.resolve(null),
            supaFetch('contas?select=*&order=id.asc'),
            escolaId ? supaFetch(`escola_estado?escola_id=eq.${escolaId}&select=*`) : Promise.resolve(null)
          ]);
          if (Array.isArray(escolasRem) && escolasRem.length) db.escolas = escolasRem;
          if (Array.isArray(contasRem) && contasRem.length) db.contas = contasRem;

          if (escolaId) {
            if (Array.isArray(est) && est.length && est[0].dados) {
              aplicarEstadoEscola(est[0].dados);
              const novosAlunos = sincronizarNomesFaltantesCEDVB();
              if (novosAlunos > 0) {
                await enviarEstadoEscolaParaNuvem(escolaId);
                toast(`${novosAlunos} estudante(s) faltante(s) adicionado(s) às turmas!`, 'sucesso');
              }
            } else {
              sincronizarNomesFaltantesCEDVB();
              await enviarEstadoEscolaParaNuvem(escolaId);
            }
          }
          salvarEstadoLocalOnly();
          if (!silencioso) toast('Sincronizado com a nuvem!', 'sucesso');
          return true;
        } catch (err) {
          if (!silencioso) toast(`Erro ao conectar ao Supabase (${err?.message || 'sem conexão'}). Usando modo offline.`, 'erro');
          return false;
        }
      }

      let syncStatus = getCloudCfg().url ? 'ok' : 'local';
      function updateSyncDot() {
        const dot = document.getElementById('sync-dot');
        const lbl = document.getElementById('sync-lbl');
        if (!dot || !lbl) return;
        const cfg = getCloudCfg();
        const st = (!cfg.url || !cfg.key) ? 'local' : syncStatus;
        dot.className = 'w-1.5 h-1.5 rounded-full ' + (
          st === 'syncing' ? 'bg-amber-400 animate-pulse' :
          st === 'ok' ? 'bg-emerald-400/80' :
          st === 'erro' ? 'bg-red-400/80' : 'bg-gray-400/60'
        );
        lbl.textContent = st === 'syncing' ? 'Sincronizando' : st === 'ok' ? 'Nuvem' : st === 'erro' ? 'Offline' : 'Local';
      }

      async function enviarEstadoEscolaParaNuvem(escolaId) {
        const cfg = getCloudCfg();
        if (!cfg.url || !cfg.key || !escolaId) { syncStatus = 'local'; updateSyncDot(); return; }
        syncStatus = 'syncing';
        updateSyncDot();
        try {
          const dados = extrairEstadoEscola();
          await supaFetch('escola_estado?on_conflict=escola_id', {
            method: 'POST',
            headers: { 'Prefer': 'resolution=merge-duplicates' },
            body: JSON.stringify({ escola_id: escolaId, dados, atualizado_em: new Date().toISOString() })
          });
          syncStatus = 'ok';
        } catch (e) {
          syncStatus = 'erro';
        }
        updateSyncDot();
      }

      // Ícones em silhueta monocromática (SVG puro)
      const SVG_PATHS = {
        users: '<path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>',
        user: '<path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>',

      function hojeISO() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function formatarDataCurta(yyyyMmDd) {
        const [y, m, d] = yyyyMmDd.split('-');
        return `${d}/${m}/${y}`;
      }

      function formatarDataHora(iso) {
        const d = new Date(iso);
        const day = String(d.getDate()).padStart(2, '0');
        const mon = String(d.getMonth() + 1).padStart(2, '0');
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${day}/${mon} ${h}:${min}`;
      }

      function carregarEstado() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed.horariosAula)) parsed.horariosAula = [];
            if (!parsed.config.tema) parsed.config.tema = 'escuro';
            if (typeof parsed.config.biometriaAtivada !== 'boolean') parsed.config.biometriaAtivada = false;
            if (typeof parsed.config.presencaAtiva !== 'boolean') parsed.config.presencaAtiva = true;
            if (typeof parsed.config.presencaValor !== 'number') parsed.config.presencaValor = 1;
            if (!Array.isArray(parsed.bimestres)) parsed.bimestres = [];
            parsed.regras = (parsed.regras || []).filter(r => !r.ehPresenca && r.titulo.toLowerCase() !== 'presença');
            if (!parsed.presencaMigrada) {
              const jaTem = (parsed.regras || []).some(r => r.ehPresenca || r.titulo.toLowerCase() === 'presença');
              if (!jaTem) {
                parsed.regras.unshift({ id: 99, titulo: 'Presença', valor: 1, icone: 'check', ehPresenca: true });
              }
              parsed.presencaMigrada = true;
            }
            return parsed;
          }
        } catch (e) {}
        return criarEstadoInicial();

      function somarMinutos(hhmm, minutos = 45) {
        if (!hhmm || !hhmm.includes(':')) return '08:15';
        const [h, m] = hhmm.split(':').map(Number);
        const total = Math.min(23 * 60 + 59, h * 60 + m + minutos);
        return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
      }

      function turmasOrdenadas() {
        return db.turmas.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { numeric: true, sensitivity: 'base' }));
      }

      function alunosDaTurmaOrdenados(turmaId) {
        return db.usuarios
          .filter(u => u.turmaId === turmaId && u.papel !== 'professor')
          .sort((a, b) => a.apelido.localeCompare(b.apelido, 'pt-BR', { sensitivity: 'base' }));
      }

      function totalTokensTurma(turmaId) {
        return db.usuarios
          .filter(u => u.turmaId === turmaId && u.papel !== 'professor')
          .reduce((acc, u) => acc + (u.saldo || 0), 0);
      }

        return db.cargos.filter(c => c.turmaId === null || c.turmaId === turmaId);

        if (cargo.turmaId === null) {

      const SCALLOP_PATH = (() => {
        const pts = [];
        const n = 22;
        for (let i = 0; i < n; i++) {
          const a1 = (i / n) * Math.PI * 2;
          const a2 = ((i + 0.5) / n) * Math.PI * 2;
          const rOut = 30.5, rIn = 27.2;
          pts.push(`${i === 0 ? 'M' : 'L'}${(32 + rOut * Math.cos(a1)).toFixed(1)},${(32 + rOut * Math.sin(a1)).toFixed(1)}`);
          pts.push(`L${(32 + rIn * Math.cos(a2)).toFixed(1)},${(32 + rIn * Math.sin(a2)).toFixed(1)}`);
        }
        return pts.join(' ') + ' Z';
      })();

                   <polygon points="18,26 25,29 20,34" fill="#FFFFFF"/>`;
        } else if (b.kind === 'sim') {
          inner = `<polygon points="23,24 30,40 16,40" fill="none" stroke="#FFFFFF" stroke-width="2"/>
                   <polygon points="40,18 49,40 31,40" fill="none" stroke="#FFD600" stroke-width="2"/>`;
        } else if (b.kind === 'tales') {
          inner = `<path d="M16 23 H48 M16 32 H48 M16 41 H48" stroke="#FFFFFF" stroke-width="1.8"/>
                   <path d="M24 18 L20 46 M38 18 L44 46" stroke="#FFD600" stroke-width="2.4"/>`;
        } else if (b.kind === 'pitag') {
          inner = `<polygon points="22,20 22,42 44,42" fill="none" stroke="#FFD600" stroke-width="2.5" stroke-linejoin="round"/>
                   <rect x="22" y="36" width="6" height="6" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>`;
        } else if (b.kind === 'pitagApp') {
          inner = `<polygon points="21,19 21,42 44,42" fill="rgba(255,214,0,0.22)" stroke="#FFD600" stroke-width="2.2"/>
                   <text x="35" y="30" fill="#FFFFFF" font-size="11" font-weight="900">c</text>`;
        } else if (b.kind === 'circ') {
          inner = `<circle cx="32" cy="32" r="13" fill="none" stroke="#FFD600" stroke-width="2.5"/>
                   <line x1="32" y1="32" x2="45" y2="32" stroke="#FFFFFF" stroke-width="2"/>`;
        } else if (b.kind === 'angCirc') {
          inner = `<circle cx="32" cy="32" r="13" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
                   <path d="M41 23 L23 32 L41 41" fill="none" stroke="#FFD600" stroke-width="2.4" stroke-linejoin="round"/>`;
        } else if (b.kind === 'units') {
          inner = `<text x="26" y="29" text-anchor="middle" fill="#FFD600" font-size="12" font-weight="900">Hz</text>
                   <text x="38" y="42" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="900">W</text>`;
        } else {
          const t = b.txt || '';
          const fs = t.length >= 6 ? 10 : t.length >= 4 ? 12.5 : t.length >= 2 ? 16 : 21;
          inner = `<text x="32" y="${fs >= 18 ? 39 : 36.5}" text-anchor="middle" fill="#FFD600" font-size="${fs}" font-weight="900" font-family="system-ui, sans-serif">${escapeHtml(t)}</text>`;
        }
        return `<svg class="${sizeClass}" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path d="${SCALLOP_PATH}" fill="#FFD600" stroke="#F59E0B" stroke-width="1"/>
          <circle cx="32" cy="32" r="24.5" fill="${bg}"/>
          ${inner}
        </svg>`;
      }

      function renderBrocheImg(broche, bloco, unlocked, sizeClass = 'w-11 h-11') {
        const cls = unlocked ? 'broche-unlocked' : 'broche-locked';
        if (bloco === 1) {
          return `<img src="${broche.img}" alt="${escapeHtml(broche.nome)}" class="${sizeClass} rounded-full object-cover ${cls}" />`;
        }
        return `<div class="${cls} inline-flex items-center justify-center">${svgBrocheBloco2(broche, sizeClass)}</div>`;
      }

      function getBrochesAluno(aluno) {
        return Array.isArray(aluno && aluno.broches) ? aluno.broches : [];
      }

      function detectarBlocoAluno(aluno) {
        if (!aluno) return 'ambos';
        const turma = db.turmas.find(t => t.id === aluno.turmaId);
        if (!turma) return 'ambos';
        const ano = String(turma.ano || '');
        if (ano === '6' || ano === '7') return 'b1';
        if (ano === '8' || ano === '9') return 'b2';
        const nome = String(turma.nome || '');
        if (/\b[67]|6º|7º|6o|7o/i.test(nome)) return 'b1';
        if (/\b[89]|8º|9º|8o|9o|EM|Médio/i.test(nome)) return 'b2';
        return 'ambos';
      }

      function detectarAnoAluno(aluno) {
        if (!aluno) return '';
        const turma = db.turmas.find(t => t.id === aluno.turmaId);
        if (!turma) return '';
        const ano = String(turma.ano || '');
        if (['6', '7', '8', '9'].includes(ano)) return ano;
        const nome = String(turma.nome || '');
        const m = nome.match(/\b([6789])|([6789])[ºo]/i);
        return m ? (m[1] || m[2]) : '';
      }

      function isRoteirosVisiveis() {
        return Boolean(db.config && db.config.mostrarRoteiros);
      }

      function isDispositivoPortatil() {
        return (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ||
          /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent || '') ||
          window.innerWidth < 768;
      }

      function calcularNotaAvaliacoesAluno(alunoId, turmaId) {
        if (!Array.isArray(db.avaliacoes)) return 0;
        return +(db.avaliacoes
          .filter(av => av.turmaId === turmaId)
          .reduce((acc, av) => acc + (Number((av.notas && av.notas[alunoId]) || 0)), 0)).toFixed(2);
      }

      function periodosPorRegime(regime) {
        if (regime === 'bimestre') return { teto: 10, periodos: ['1º Bimestre', '2º Bimestre', '3º Bimestre', '4º Bimestre'] };
        if (regime === 'trimestre') return { teto: 30, periodos: ['1º Trimestre', '2º Trimestre', '3º Trimestre'] };
        return { teto: 40, periodos: ['Geral'] };
      }

      function abrirModalAvaliacoesTurma(turma) {
        if (!Array.isArray(db.avaliacoes)) db.avaliacoes = [];
        if (!turma.regimeAvaliacao) turma.regimeAvaliacao = 'livre';

        function drawAvaliacoes() {
          const regime = turma.regimeAvaliacao || 'livre';
          const info = periodosPorRegime(regime);
          const avals = db.avaliacoes.filter(a => a.turmaId === turma.id);
          const alunos = alunosDaTurmaOrdenados(turma.id);

          const resumoPeriodos = info.periodos.map(p => {
            const soma = +(avals.filter(a => a.periodo === p).reduce((s, a) => s + Number(a.valorMax || 0), 0)).toFixed(2);
            const rest = +(info.teto - soma).toFixed(2);
            return `<div class="glass-pill rounded-xl px-2.5 py-1.5 text-[11px] flex items-center justify-between gap-2">
              <span class="font-bold text-gray-200">${escapeHtml(p)}</span>
              <span class="font-extrabold ${rest <= 0 ? 'text-amarelo' : 'text-emerald-300'}">${soma.toLocaleString('pt-BR')} / ${info.teto} pts</span>
            </div>`;
          }).join('');

          abrirModal(`
            <div class="flex items-center justify-between mb-2">
              <div>
                <h3 class="font-bold text-lg">Avaliações — ${escapeHtml(turma.nome)}</h3>
                <p class="text-[11px] text-gray-400">Teto: 40 pts (sem divisão) · 10 pts/bim · 30 pts/trim</p>
              </div>
              <button id="btn-fechar-modal" class="text-gray-400 text-xl px-2">&times;</button>
            </div>

            <div class="mb-3">
              <label class="block text-[11px] text-gray-400 mb-1 font-semibold">Regime de pontuação da turma</label>
              <select id="sel-regime-av" class="w-full glass-pill rounded-xl px-3 py-2 text-xs text-white outline-none">
                <option value="livre" ${regime === 'livre' ? 'selected' : ''}>Sem bimestres definidos (máx. 40 pts)</option>
                <option value="bimestre" ${regime === 'bimestre' ? 'selected' : ''}>Com bimestres (máx. 10 pts por bimestre)</option>
                <option value="trimestre" ${regime === 'trimestre' ? 'selected' : ''}>Com trimestres (máx. 30 pts por trimestre)</option>
              </select>
            </div>

            <div class="grid ${info.periodos.length > 1 ? 'grid-cols-2' : 'grid-cols-1'} gap-1.5 mb-3">${resumoPeriodos}</div>

            <div class="glass-card rounded-2xl p-3 mb-3 space-y-2">
              <div class="text-xs font-bold text-amarelo">+ Nova Avaliação</div>
              <input id="inp-av-titulo" type="text" placeholder="Ex.: Prova 1, Trabalho em grupo..." class="w-full glass-pill rounded-xl px-3 py-2 text-xs text-white outline-none" />
              <div class="grid ${info.periodos.length > 1 ? 'grid-cols-2' : 'grid-cols-1'} gap-2">
                ${info.periodos.length > 1 ? `
                  <select id="sel-av-periodo" class="w-full glass-pill rounded-xl px-3 py-2 text-xs text-white outline-none">
                    ${info.periodos.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('')}
                  </select>
                ` : `<input type="hidden" id="sel-av-periodo" value="Geral" />`}
                <input id="inp-av-valor" type="number" step="0.5" min="0.5" max="${info.teto}" placeholder="Valor em pts (ex: 5)" class="w-full glass-pill rounded-xl px-3 py-2 text-xs text-white outline-none" />
              </div>
              <button id="btn-criar-av" type="button" class="w-full glass-gold-btn text-xs font-extrabold py-2 rounded-xl">Adicionar Avaliação</button>
            </div>

            <div class="max-h-[38vh] overflow-y-auto space-y-2 pr-1">
              ${avals.length === 0 ? `<p class="text-xs text-gray-400 text-center py-4">Nenhuma avaliação cadastrada nesta turma ainda.</p>` : avals.map(av => {
                const lancados = alunos.filter(al => av.notas && av.notas[al.id] !== undefined && av.notas[al.id] !== '').length;
                return `
                  <div class="glass-card rounded-2xl p-3 flex items-center justify-between gap-2">
                    <div class="min-w-0">
                      <div class="font-bold text-xs truncate">${escapeHtml(av.titulo)}</div>
                      <div class="text-[10px] text-gray-400">${escapeHtml(av.periodo)} • Vale <span class="text-amarelo font-bold">${Number(av.valorMax).toLocaleString('pt-BR')} pts</span> • ${lancados}/${alunos.length} notas</div>
                    </div>
                    <div class="flex gap-1.5 shrink-0">
                      <button data-lancar-av="${av.id}" class="btn-lancar-av glass-accent-purple text-[11px] font-bold px-2.5 py-1.5 rounded-xl text-white">Notas</button>
                      <button data-del-av="${av.id}" class="btn-del-av glass-pill text-[11px] font-bold px-2.5 py-1.5 rounded-xl text-red-300">Excluir</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `);

          document.getElementById('btn-fechar-modal').onclick = fecharModal;
          document.getElementById('sel-regime-av').onchange = (e) => {
            turma.regimeAvaliacao = e.target.value;
            salvarEstado();
            drawAvaliacoes();
          };
          document.getElementById('btn-criar-av').onclick = () => {
            const titulo = (document.getElementById('inp-av-titulo').value || '').trim();
            const periodo = document.getElementById('sel-av-periodo').value || 'Geral';
            const valor = Number(String(document.getElementById('inp-av-valor').value || '').replace(',', '.'));
            if (!titulo) { toast('Digite o nome da avaliação.', 'erro'); return; }
            if (!valor || valor <= 0) { toast('Informe um valor em pontos maior que zero.', 'erro'); return; }
            const somaAtual = avals.filter(a => a.periodo === periodo).reduce((s, a) => s + Number(a.valorMax || 0), 0);
            if (somaAtual + valor > info.teto + 1e-6) {
              const disp = Math.max(0, +(info.teto - somaAtual).toFixed(2));
              toast(`Limite de ${info.teto} pts excedido em ${periodo}. Restam ${disp.toLocaleString('pt-BR')} pts.`, 'erro');
              return;
            }
            db.avaliacoes.push({
              id: db.nextId++,
              turmaId: turma.id,
              titulo,
              regime,
              periodo,
              valorMax: +valor.toFixed(2),
              notas: {},
              criadaEm: new Date().toISOString()
            });
            salvarEstado();
            toast('Avaliação adicionada!', 'sucesso');
            drawAvaliacoes();
          };
          document.querySelectorAll('.btn-del-av').forEach(b => {
            b.onclick = () => {
              const avId = Number(b.dataset.delAv);
              db.avaliacoes = db.avaliacoes.filter(a => a.id !== avId);
              salvarEstado();
              toast('Avaliação excluída.', 'info');
              drawAvaliacoes();
            };
          });
          document.querySelectorAll('.btn-lancar-av').forEach(b => {
            b.onclick = () => {
              const av = db.avaliacoes.find(a => a.id === Number(b.dataset.lancarAv));
              if (!av) return;
              abrirModalLancarNotasAvaliacao(av, turma, drawAvaliacoes);
            };
          });
        }
        drawAvaliacoes();
      }

      function abrirModalLancarNotasAvaliacao(av, turma, onVoltar) {
        const alunos = alunosDaTurmaOrdenados(turma.id);
        abrirModal(`
          <div class="flex items-center justify-between mb-2">
            <div>
              <h3 class="font-bold text-base">${escapeHtml(av.titulo)}</h3>
              <p class="text-[11px] text-gray-400">${escapeHtml(av.periodo)} • Máximo: <span class="text-amarelo font-bold">${Number(av.valorMax).toLocaleString('pt-BR')} pts</span></p>
            </div>
            <button id="btn-fechar-modal" class="text-gray-400 text-xl px-2">&times;</button>
          </div>
          <div class="max-h-[52vh] overflow-y-auto space-y-2 pr-1 mb-3">
            ${alunos.length === 0 ? `<p class="text-xs text-gray-400 text-center py-4">Nenhum estudante na turma.</p>` : alunos.map(al => {
              const val = (av.notas && av.notas[al.id] !== undefined) ? av.notas[al.id] : '';
              return `
                <div class="glass-pill rounded-xl px-3 py-2 flex items-center justify-between gap-2">
                  <span class="text-xs font-bold truncate">${escapeHtml(al.apelido)}</span>
                  <input data-nota-aluno="${al.id}" type="number" step="0.1" min="0" max="${av.valorMax}" value="${val}" placeholder="0 a ${av.valorMax}" class="inp-nota-av w-24 glass-card rounded-lg px-2 py-1 text-xs text-right text-white outline-none focus:border-[#FFD600]" />
                </div>
              `;
            }).join('')}
          </div>
          <div class="flex gap-2">
            <button id="btn-voltar-av" type="button" class="flex-1 glass-pill text-xs font-bold py-2.5 rounded-xl text-white">← Voltar</button>
            <button id="btn-salvar-notas-av" type="button" class="flex-1 glass-gold-btn text-xs font-extrabold py-2.5 rounded-xl">Salvar Notas</button>
          </div>
        `);
        document.getElementById('btn-fechar-modal').onclick = fecharModal;
        document.getElementById('btn-voltar-av').onclick = onVoltar;
        document.getElementById('btn-salvar-notas-av').onclick = () => {
          if (!av.notas) av.notas = {};
          let invalido = false;
          document.querySelectorAll('.inp-nota-av').forEach(inp => {
            const aid = Number(inp.dataset.notaAluno);
            const raw = (inp.value || '').trim();
            if (raw === '') {
              delete av.notas[aid];
            } else {
              const n = Number(raw.replace(',', '.'));
              if (isNaN(n) || n < 0 || n > Number(av.valorMax)) {
                invalido = true;
              } else {
                av.notas[aid] = +n.toFixed(2);
              }
            }
          });
          if (invalido) {
            toast(`As notas devem estar entre 0 e ${av.valorMax}.`, 'erro');
            return;
          }
          salvarEstado();
          toast('Notas salvas!', 'sucesso');
          onVoltar();
        };
      }

      function calcularNotaRoteiros(aluno) {
        const ano = detectarAnoAluno(aluno);
        const set = new Set(getBrochesAluno(aluno));
        let b1 = 0, b2 = 0, extras = 0;
        set.forEach(id => {
          const s = String(id);
          const m = s.match(/^(b1|b2)_(\d+)$/);
          if (!m) return;
          const num = Number(m[2]);
          if (num >= 41) {
            extras++;
          } else if (m[1] === 'b1') {
            b1++;
          } else {
            b2++;
          }
        });
        let p1 = 1.2, p2 = 1.2;
        if (ano === '6') { p1 = 1.2; p2 = 2.4; }
        else if (ano === '7') { p1 = 0.6; p2 = 2.4; }
        else if (ano === '8') { p1 = 0.6; p2 = 1.2; }
        else if (ano === '9') { p1 = 0.6; p2 = 0.6; }
        const nota = +(b1 * p1 + b2 * p2 + extras * 1.0).toFixed(2);
        return nota.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 2 });
      }

      function abrirModalBrochesAluno(alunoId) {
        const aluno = db.usuarios.find(u => u.id === alunoId);
        if (!aluno) return;
        if (!Array.isArray(aluno.broches)) aluno.broches = [];
        const blocoPrincipal = detectarBlocoAluno(aluno);
        let mostrarB1 = blocoPrincipal !== 'b2';
        let mostrarB2 = blocoPrincipal !== 'b1';
        let ultimaAcao = null;

        function drawModal(prevScroll = 0) {
          const set = new Set(aluno.broches);
          const allList = [...BROCHES_BLOCO_1, ...BROCHES_BLOCO_2];
          const b1Done = BROCHES_BLOCO_1.filter(b => set.has(b.id)).length;
          const b2Done = BROCHES_BLOCO_2.filter(b => set.has(b.id)).length;
          const totalAtivo = blocoPrincipal === 'b1' ? BROCHES_BLOCO_1.length : blocoPrincipal === 'b2' ? BROCHES_BLOCO_2.length : allList.length;
          const doneAtivo = blocoPrincipal === 'b1' ? b1Done : blocoPrincipal === 'b2' ? b2Done : set.size;

          abrirModal(`
            <div class="flex items-center justify-between mb-2">
              <div>
                <h3 class="font-bold text-base">Roteiros de ${escapeHtml(aluno.apelido)}</h3>
                <p class="text-[11px] text-amarelo font-bold">Nota: ${calcularNotaRoteiros(aluno)} <span class="text-gray-400 font-normal">• Toque para alternar</span></p>
              </div>
              <div class="flex items-center gap-1.5">
                <button id="btn-roteiros-dar-ips" type="button" class="glass-gold-btn text-[11px] font-extrabold px-2.5 py-1.5 rounded-xl flex items-center gap-1">${svgIcon('bolt', 'w-3.5 h-3.5')} <span>Dar ${escapeHtml(db.config.moedaPlural)}</span></button>
                <button id="btn-fechar-modal" class="text-gray-400 text-xl px-2">&times;</button>
              </div>
            </div>
            ${ultimaAcao ? `
              <div class="mb-2.5 glass-accent-purple rounded-2xl px-3 py-2 flex items-center justify-between gap-2 text-xs">
                <span class="truncate"><strong>${ultimaAcao.adicionado ? 'Concluído:' : 'Removido:'}</strong> ${escapeHtml(ultimaAcao.nome)}</span>
                <button id="btn-desfazer-roteiro" type="button" class="shrink-0 glass-gold-btn text-[11px] font-extrabold px-2.5 py-1 rounded-xl">Desfazer</button>
              </div>
            ` : ''}
            <div class="flex flex-wrap gap-1.5 mb-3">
              ${mostrarB1 ? `<button id="btn-b-all-1" class="glass-pill text-[11px] font-bold px-2.5 py-1 rounded-xl text-amarelo">Tudo Bloco I</button>` : ''}
              ${mostrarB2 ? `<button id="btn-b-all-2" class="glass-pill text-[11px] font-bold px-2.5 py-1 rounded-xl text-purple-300">Tudo Bloco II</button>` : ''}
              <button id="btn-b-clear" class="glass-pill text-[11px] font-bold px-2.5 py-1 rounded-xl text-red-300">Limpar</button>
            </div>
            <div id="roteiros-scroll-box" class="max-h-[55vh] overflow-y-auto pr-1 space-y-3">
              <div>
                <button type="button" id="btn-tog-b1" class="w-full flex items-center justify-between text-xs font-extrabold text-red-300 py-1.5 px-2 rounded-xl hover:bg-white/5">
                  <span>${mostrarB1 ? '▾' : '▸'} Bloco I (Vermelho e Amarelo • ${b1Done}/${BROCHES_BLOCO_1.length})</span>
                  ${blocoPrincipal === 'b2' && !mostrarB1 ? '<span class="text-[10px] text-gray-400 font-normal">Oculto • tocar para abrir</span>' : ''}
                </button>
                ${mostrarB1 ? `
                  <div class="grid grid-cols-5 gap-2.5 mt-2">
                    ${BROCHES_BLOCO_1.map(b => `
                      <button type="button" data-toggle-broche="${b.id}" title="${escapeHtml(b.nome)}" class="btn-toggle-broche flex flex-col items-center p-1 rounded-xl hover:bg-white/5">
                        ${renderBrocheImg(b, 1, set.has(b.id), 'w-12 h-12 sm:w-14 sm:h-14')}
                      </button>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
              <div>
                <button type="button" id="btn-tog-b2" class="w-full flex items-center justify-between text-xs font-extrabold text-purple-300 py-1.5 px-2 rounded-xl hover:bg-white/5">
                  <span>${mostrarB2 ? '▾' : '▸'} Bloco II (Roxo e Amarelo • ${b2Done}/${BROCHES_BLOCO_2.length})</span>
                  ${blocoPrincipal === 'b1' && !mostrarB2 ? '<span class="text-[10px] text-gray-400 font-normal">Oculto • tocar para abrir</span>' : ''}
                </button>
                ${mostrarB2 ? `
                  <div class="grid grid-cols-5 gap-2.5 mt-2">
                    ${BROCHES_BLOCO_2.map(b => `
                      <button type="button" data-toggle-broche="${b.id}" title="${escapeHtml(b.nome)}" class="btn-toggle-broche flex flex-col items-center p-1 rounded-xl hover:bg-white/5">
                        ${renderBrocheImg(b, 2, set.has(b.id), 'w-12 h-12 sm:w-14 sm:h-14')}
                      </button>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            </div>
          `);
          const box = document.getElementById('roteiros-scroll-box');
          if (box && prevScroll > 0) box.scrollTop = prevScroll;

          document.getElementById('btn-fechar-modal').onclick = () => { fecharModal(); render(); };
          const btnDarIps = document.getElementById('btn-roteiros-dar-ips');
          if (btnDarIps) btnDarIps.onclick = () => { fecharModal(); abrirModalLancar([aluno.id]); };
          document.getElementById('btn-tog-b1').onclick = () => {
            const curScroll = box ? box.scrollTop : 0;
            mostrarB1 = !mostrarB1;
            drawModal(curScroll);
          };
          document.getElementById('btn-tog-b2').onclick = () => {
            const curScroll = box ? box.scrollTop : 0;
            mostrarB2 = !mostrarB2;
            drawModal(curScroll);
          };
          const btnDesf = document.getElementById('btn-desfazer-roteiro');
          if (btnDesf && ultimaAcao) {
            btnDesf.onclick = () => {
              const curScroll = box ? box.scrollTop : 0;
              const idx = aluno.broches.indexOf(ultimaAcao.id);
              if (ultimaAcao.adicionado && idx >= 0) aluno.broches.splice(idx, 1);
              else if (!ultimaAcao.adicionado && idx < 0) aluno.broches.push(ultimaAcao.id);
              toast(`Desfeito: ${ultimaAcao.nome}`, 'info');

      function toast(msg, tipo = 'roxo') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const div = document.createElement('div');
        const ehPerigo = tipo === 'erro' || tipo === 'perigo';
        const cor = ehPerigo
          ? 'bg-red-700/95 border-red-300/70'
          : (tipo === 'sucesso' ? 'bg-emerald-800/95 border-emerald-400/40' : 'bg-purple-900/95 border-purple-300/30');
        div.className = `${cor} toast-gpu text-white px-4 py-3 rounded-2xl shadow-xl text-sm font-bold flex items-center justify-center gap-2 border`;
        div.innerHTML = `${ehPerigo ? svgIcon('alertTriangle', 'w-5 h-5 text-white') : ''}<span>${escapeHtml(msg)}</span>`;
        container.appendChild(div);
        requestAnimationFrame(() => div.classList.add('is-visible'));
        setTimeout(() => {
          div.classList.remove('is-visible');
          setTimeout(() => div.remove(), 160);
        }, 2200);
      }

      let modalHistoryPushed = false;
      function abrirModal(html) {
        const backdrop = document.getElementById('modal-backdrop');
        const content = document.getElementById('modal-content');
        const estavaFechado = backdrop.classList.contains('hidden');
        content.innerHTML = html;
        backdrop.classList.remove('hidden', 'is-open');
        backdrop.classList.add('flex');
        requestAnimationFrame(() => backdrop.classList.add('is-open'));
        if (estavaFechado && typeof history !== 'undefined' && history.pushState) {
          try {
            history.pushState({ appNav: true, modal: true }, '');
            modalHistoryPushed = true;
          } catch (e) {}
        }
      }

      function fecharModal(fromPopState = false) {
        const backdrop = document.getElementById('modal-backdrop');
        const estavaAberto = !backdrop.classList.contains('hidden');
        backdrop.classList.remove('is-open');
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex');
        if (!fromPopState && estavaAberto && modalHistoryPushed) {
          modalHistoryPushed = false;
          try {
            if (history.state && history.state.modal) history.back();
          } catch (e) {}
        } else if (fromPopState) {
          modalHistoryPushed = false;
        }
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');

      function lancarIps(origemId, destinoIds, valor, motivo, tipo = 'ganho', dataRef = null) {
        const hoje = hojeISO();
        const alvoData = dataRef || hoje;
        const criadoEm = alvoData === hoje ? new Date().toISOString() : `${alvoData}T12:00:00.000Z`;
        destinoIds.forEach(id => {
          const u = db.usuarios.find(x => x.id === id);
          if (!u) return;
          u.saldo = (u.saldo || 0) + valor;
          db.transacoes.unshift({
            id: genId(),
            turmaId: session.turmaAtualId,
            origemId,
            destinoId: id,
            valor,
            tipo,
            motivo,
            criadoEm
          });
        });
        salvarEstado();
      }

          .reduce((acc, t) => acc + t.valor, 0);
      }

      function abrirModalCalendario() {
        const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        const hoje = hojeISO();

        function renderCal() {
          const ano = session.calAno;
          const mes = session.calMes;
          const primeiroDia = new Date(ano, mes, 1).getDay();
          const diasNoMes = new Date(ano, mes + 1, 0).getDate();
          const diasComRegistro = new Set(
            db.transacoes
              .filter(t => t.turmaId === session.turmaAtualId && t.valor > 0)
              .map(t => t.criadoEm.slice(0, 10))
          );

          let celulas = '';
          for (let i = 0; i < primeiroDia; i++) {
            celulas += '<div></div>';
          }
          for (let d = 1; d <= diasNoMes; d++) {
            const ymd = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const futuro = ymd > hoje;
            const sel = ymd === session.dataSelecionada;
            const temReg = diasComRegistro.has(ymd);
            celulas += `
              <button type="button" data-cal-ymd="${ymd}" ${futuro ? 'disabled' : ''} class="btn-cal-dia h-10 rounded-xl text-xs font-bold flex flex-col items-center justify-center relative transition ${sel ? 'glass-gold-btn' : (futuro ? 'text-gray-600 opacity-40' : 'glass-pill text-white hover:border-[#FFD600]/60')}">
                <span>${d}</span>
                ${temReg ? `<span class="w-1.5 h-1.5 rounded-full ${sel ? 'bg-black' : 'bg-[#FFD600]'} mt-0.5"></span>` : ''}
              </button>
            `;
          }

          abrirModal(`
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-bold text-base flex items-center gap-2">${svgIcon('calendar', 'w-5 h-5 text-amarelo')} <span>Calendário de Lançamentos</span></h3>
              <button id="btn-fechar-modal" class="text-gray-400 text-xl px-2">&times;</button>
            </div>
            <div class="flex items-center justify-between mb-3">
              <button id="cal-prev" class="glass-pill px-3 py-1.5 rounded-xl text-xs font-bold">&larr;</button>
              <span class="font-bold text-sm">${meses[mes]} ${ano}</span>
              <button id="cal-next" class="glass-pill px-3 py-1.5 rounded-xl text-xs font-bold">&rarr;</button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-[10px] text-gray-400 font-semibold mb-1.5">
              <div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div>
            </div>
            <div class="grid grid-cols-7 gap-1.5 mb-4">${celulas}</div>
            <button id="cal-hoje" class="w-full glass-accent-purple text-white text-xs font-bold py-2.5 rounded-xl">Voltar para Hoje (${formatarDataCurta(hoje)})</button>
          `);

          document.getElementById('btn-fechar-modal').onclick = fecharModal;
          const cadNome = document.getElementById('cad-nome');
          const cadLogin = document.getElementById('cad-login');
          const cadSenha = document.getElementById('cad-senha');
          const btnCad = document.getElementById('btn-confirmar-cad');

          if (cadLogin && cadSenha) cadLogin.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); cadSenha.focus(); } });
          if (cadSenha && btnCad) cadSenha.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); btnCad.click(); } });
          document.getElementById('cal-prev').onclick = () => {
            session.calMes -= 1;

      function salvarContaBioLogin() {
        if (session.contaAtiva && session.contaAtiva.papel !== 'admin') {

      function bufferToBase64(buf) {
        return btoa(String.fromCharCode(...new Uint8Array(buf)));
      }

      function base64ToBuffer(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes.buffer;
      }

      async function cadastrarBiometriaWeb() {
        if (!window.PublicKeyCredential || !navigator.credentials) {
          throw new Error('Navegador sem suporte a biometria web');
        }
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);
        const userId = new Uint8Array(16);
        crypto.getRandomValues(userId);
        const cred = await navigator.credentials.create({
          publicKey: {
            challenge,
            rp: { name: 'Economia da Turma' },
            user: { id: userId, name: 'professor', displayName: 'Professor' },
            pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
            timeout: 60000
          }
        });
        if (cred && cred.rawId) {
          try { localStorage.setItem(BIO_KEY, bufferToBase64(cred.rawId)); } catch (e) {}
          salvarContaBioLogin();
          return true;
        }
        return false;
      }

      async function verificarBiometriaWeb() {
        let savedId = null;
        try { savedId = localStorage.getItem(BIO_KEY); } catch (e) {}
        if (!savedId) return false;
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);
        const assertion = await navigator.credentials.get({
          publicKey: {
            challenge,
            allowCredentials: [{ type: 'public-key', id: base64ToBuffer(savedId) }],
            userVerification: 'required',
            timeout: 60000
          }
        });
        return Boolean(assertion);
      }

      function montarTecladoPin4(titulo, subtitulo, btnLabel, onSubmit) {
        let pinVal = '';
        let keyHandler = null;
        function fecharPin() {
          if (keyHandler) document.removeEventListener('keydown', keyHandler);
          fecharModal();
        }
        function drawPin() {
          abrirModal(renderPinKeypadHtml(pinVal, titulo, subtitulo, btnLabel));
          document.getElementById('btn-fechar-modal').onclick = fecharPin;
          document.querySelectorAll('.btn-pin-key').forEach(b => {
            b.onclick = () => {
              const k = b.dataset.pinKey;
              if (k === 'Limpar') pinVal = '';
              else if (k === '⌫') pinVal = pinVal.slice(0, -1);
              else if (pinVal.length < 4 && /^\d$/.test(k)) pinVal += k;
              drawPin();
            };
          });
          document.getElementById('btn-confirmar-pin4').onclick = () => {
            if (pinVal.length !== 4) {
              toast('Digite exatamente 4 dígitos.', 'erro');
              return;
            }
            const res = onSubmit(pinVal, () => { pinVal = ''; drawPin(); }, fecharPin);
            if (res === true) fecharPin();
          };
        }
        keyHandler = (e) => {
          if (document.getElementById('modal-backdrop')?.classList.contains('hidden')) {
            document.removeEventListener('keydown', keyHandler);
            return;
          }
          if (/^\d$/.test(e.key) && pinVal.length < 4) {
            e.preventDefault();
            pinVal += e.key;
            drawPin();
          } else if (e.key === 'Backspace') {
            e.preventDefault();
            pinVal = pinVal.slice(0, -1);
            drawPin();
          } else if (e.key === 'Enter') {
            e.preventDefault();
            const btn = document.getElementById('btn-confirmar-pin4');
            if (btn) btn.click();
          }
        };
        document.addEventListener('keydown', keyHandler);
        drawPin();
      }

      function renderGradeSemanalHtml() {
        const dias = [1, 2, 3, 4, 5, 6]; // Seg a Sáb
        const aulas = (db.horariosAula || []).filter(h => h.diaSemana >= 1 && h.diaSemana <= 6);
        const toMin = (hhmm) => {
          const [h, m] = hhmm.split(':').map(Number);
          return h * 60 + m;
        };

        let minStart = 7 * 60;
        let maxEnd = 12 * 60 + 30;
        if (aulas.length > 0) {
          minStart = Math.min(...aulas.map(a => toMin(a.inicio)));
          maxEnd = Math.max(...aulas.map(a => toMin(a.fim)));
          minStart = Math.floor(minStart / 60) * 60;
          maxEnd = Math.ceil(maxEnd / 60) * 60;
        }
        const totalMin = Math.max(60, maxEnd - minStart);
        const pxPerMin = 1.15;
        const heightPx = Math.round(totalMin * pxPerMin);

        const hourMarks = [];
        for (let m = minStart; m <= maxEnd; m += 60) {
          const top = Math.round((m - minStart) * pxPerMin);
          const lbl = `${String(Math.floor(m / 60)).padStart(2, '0')}:00`;
          hourMarks.push({ top, lbl });
        }

        const colsHtml = dias.map(d => {
          const doDia = aulas.filter(a => a.diaSemana === d);
          const blocos = doDia.map(a => {
            const top = Math.round((toMin(a.inicio) - minStart) * pxPerMin);
            const h = Math.max(26, Math.round((toMin(a.fim) - toMin(a.inicio)) * pxPerMin) - 2);
            const t = db.turmas.find(x => x.id === a.turmaId);
            return `
              <div style="top:${top}px;height:${h}px" class="absolute left-0.5 right-0.5 rounded-xl bg-[#6A1B9A]/80 border border-[#FFD600]/45 px-1 py-0.5 flex flex-col justify-center overflow-hidden shadow">
                <div class="text-[9px] font-extrabold text-[#FFD600] leading-tight truncate">${t ? escapeHtml(t.nome) : 'Aula'}</div>
                <div class="text-[8px] text-white/90 leading-tight">${a.inicio}–${a.fim}</div>
              </div>
            `;
          }).join('');
          const linhas = hourMarks.map(hm => `<div style="top:${hm.top}px" class="absolute left-0 right-0 border-t border-white/10"></div>`).join('');
          return `
            <div class="flex-1 min-w-[68px] border-l border-white/10 relative" style="height:${heightPx}px">
              ${linhas}
              ${blocos}
            </div>
          `;
        }).join('');

        return `
          <div class="overflow-x-auto">
            <div class="min-w-[460px]">
              <div class="flex border-b border-white/15 pb-1.5 mb-1 text-[10px] font-bold text-gray-300">
                <div class="w-10 shrink-0">Hora</div>
                ${dias.map(d => `<div class="flex-1 min-w-[68px] text-center">${DIAS_SEMANA[d]}</div>`).join('')}
              </div>
              <div class="flex">
                <div class="w-10 shrink-0 relative" style="height:${heightPx}px">
                  ${hourMarks.map(hm => `<div style="top:${Math.max(0, hm.top - 6)}px" class="absolute left-0 text-[9px] font-mono text-gray-400">${hm.lbl}</div>`).join('')}
                </div>
                ${colsHtml}
              </div>
            </div>
          </div>
        `;
      }

              return;

            if ((db.contas || []).some(c => c.login.toLowerCase() === login)) {
              toast('Este login já existe.', 'erro');
              return;
            }
            const senha_hash = await sha256Hex(senha);
            const nova = { id: genId(), escola_id, login, senha_hash, nome, papel: 'professor' };
            try {
              const res = await supaFetch('contas', {
                method: 'POST',
                headers: { 'Prefer': 'return=representation' },
                body: JSON.stringify({ escola_id, login, senha_hash, nome, papel: 'professor' })

          const txtOrig = btn ? btn.textContent : 'Entrar';
          if (btn) { btn.disabled = true; btn.textContent = 'Entrando...'; }
          try {
            const hash = await sha256Hex(senha);
            let conta = (db.contas || []).find(c =>
              c.login.toLowerCase() === login && (c.senha_hash === hash || c.senha_hash === senha)
            );
            if (!conta) {
              try {
                const rem = await supaFetch(`contas?login=eq.${encodeURIComponent(login)}&select=*`);
                if (Array.isArray(rem) && rem[0]) {
                  const cand = rem[0];
                  if (cand.senha_hash === hash || cand.senha_hash === senha) {
                    conta = cand;
                    db.contas.push(cand);
                  }
                }
              } catch (e) {}
            }
            if (!conta) {
              toast('Login ou senha incorretos.', 'erro');
              return;
            }
            session.contaAtiva = conta;
            if (conta.papel !== 'admin') {
              try { localStorage.setItem(BIO_LOGIN_KEY, conta.login.toLowerCase()); } catch (e) {}
            }
            if (conta.papel === 'admin') {
              session.modo = 'admin';
            } else {
              trocarEscolaAtiva(conta.escola_id || db.escolas[0]?.id);
              session.modo = 'professor';
              session.abaProfessor = 'turma';
              const h = encontrarHorarioAtivoAgora();
              if (h) { session.turmaAtualId = h.turmaId; session.escolhendoTurma = false; }
              else { session.escolhendoTurma = true; }
            }
            toast(`Bem-vindo, ${conta.nome}!`, 'sucesso');
            render();
            sincronizarComNuvem(true).then(ok => {
              if (ok && session.contaAtiva && session.modo !== 'login') render();
            }).catch(() => {});
          } finally {
            if (btn && document.body.contains(btn)) {
              btn.disabled = false;
              btn.textContent = txtOrig;
            }
          }
        };
      }

      function bindAdmin() {
        document.getElementById('btn-admin-nuvem').onclick = abrirModalConfigNuvem;
        document.getElementById('btn-admin-sair').onclick = () => {
          session.contaAtiva = null;
          session.modo = 'login';
          render();
        };

        document.getElementById('inp-csv-escolas').onchange = (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async () => {
            const linhas = String(reader.result || '').split(/\r?\n/).filter(l => l.trim().length > 0);
            let importadas = 0;
            const novasParaNuvem = [];
            for (const linha of linhas) {
              const sep = linha.includes(';') ? ';' : ',';
              const cols = linha.split(sep).map(c => c.replace(/^"|"$/g, '').trim());
              const cod = cols.find(c => /^53\d{6}$/.test(c));
              if (!cod) continue;
              const nome = cols.find(c => c !== cod && c.length > 4 && !/^\d+$/.test(c));
              if (!nome) continue;
              if (db.escolas.some(x => x.codigo === cod)) continue;
              const obj = { id: genId(), codigo: cod, nome };
              db.escolas.push(obj);
              novasParaNuvem.push({ codigo: cod, nome });
              importadas++;
            }
            if (novasParaNuvem.length > 0) {
              try {
                await supaFetch('escolas?on_conflict=codigo', {
                  method: 'POST',
                  headers: { 'Prefer': 'resolution=ignore-duplicates' },
                  body: JSON.stringify(novasParaNuvem)
                });
                const rem = await supaFetch('escolas?select=*&order=id.asc');
                if (Array.isArray(rem) && rem.length) db.escolas = rem;
              } catch (err) {}
            }
            salvarEstadoLocalOnly();
            toast(importadas > 0 ? `${importadas} escola(s) do DF importadas!` : 'Nenhuma escola nova encontrada no CSV.', importadas > 0 ? 'sucesso' : 'erro');
            render();
          };
          reader.readAsText(file, 'UTF-8');
        };
        document.getElementById('btn-nova-escola').onclick = () => {
          abrirModal(`
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-bold text-lg">Nova Escola</h3>
              <button id="btn-fechar-modal" class="text-gray-400 text-xl px-2">&times;</button>
            </div>
            <input id="inp-esc-cod" placeholder="Código ou INEP (ex.: ESC02)" class="w-full glass-pill rounded-xl px-3 py-2 text-sm mb-2.5 text-white" />
            <input id="inp-esc-nome" placeholder="Nome da escola" class="w-full glass-pill rounded-xl px-3 py-2 text-sm mb-4 text-white" />
            <button id="btn-save-esc" class="w-full glass-gold-btn font-bold py-2.5 rounded-xl">Criar Escola</button>
          `);
          document.getElementById('btn-fechar-modal').onclick = fecharModal;
          document.getElementById('btn-save-esc').onclick = async () => {
            const codigo = document.getElementById('inp-esc-cod').value.trim().toUpperCase();
            const nome = document.getElementById('inp-esc-nome').value.trim();
            if (!codigo || !nome) { toast('Preencha código e nome.', 'erro'); return; }
            const nova = { id: genId(), codigo, nome };
            try {
              const res = await supaFetch('escolas', { method: 'POST', headers: { 'Prefer': 'return=representation' }, body: JSON.stringify({ codigo, nome }) });
              if (Array.isArray(res) && res[0]) nova.id = res[0].id;
            } catch (e) {}
            db.escolas.push(nova);
            salvarEstadoLocalOnly();
            fecharModal();
            toast('Escola criada!', 'sucesso');
            render();
          };
        };
        document.getElementById('btn-novo-coord').onclick = () => {
          abrirModal(`
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-bold text-lg">Novo Coordenador</h3>
              <button id="btn-fechar-modal" class="text-gray-400 text-xl px-2">&times;</button>
            </div>
            <select id="inp-crd-esc" class="w-full glass-pill rounded-xl px-3 py-2 text-sm text-white mb-2.5">
              ${db.escolas.map(e => `<option value="${e.id}" class="bg-[#18181D]">${escapeHtml(e.nome)}</option>`).join('')}
            </select>
            <input id="inp-crd-nome" placeholder="Nome completo" class="w-full glass-pill rounded-xl px-3 py-2 text-sm mb-2.5 text-white" />
            <input id="inp-crd-login" placeholder="Login (sem espaços)" class="w-full glass-pill rounded-xl px-3 py-2 text-sm mb-2.5 text-white" />
            <input id="inp-crd-senha" type="password" placeholder="Senha" class="w-full glass-pill rounded-xl px-3 py-2 text-sm mb-1.5 text-white" />
            <p class="text-[11px] text-gray-400 mb-3">Mínimo 8 caracteres, 1 letra maiúscula, 1 número e 1 caractere especial.</p>
            <button id="btn-save-crd" class="w-full glass-gold-btn font-bold py-2.5 rounded-xl">Criar Coordenador</button>
          `);
          document.getElementById('btn-fechar-modal').onclick = fecharModal;
          document.getElementById('btn-save-crd').onclick = async () => {
            const escola_id = Number(document.getElementById('inp-crd-esc').value);
            const nome = document.getElementById('inp-crd-nome').value.trim();
            const login = document.getElementById('inp-crd-login').value.trim().toLowerCase();
            const senha = document.getElementById('inp-crd-senha').value;
            if (!nome || !login || !senha) { toast('Preencha todos os campos.', 'erro'); return; }
            if (contemTermoProibido(nome, login, senha)) {
              toast('Termo proibido detectado no nome, login ou senha.', 'erro');
              return;
            }
            const erroSenha = validarSenhaForte(senha);
            if (erroSenha) {
              toast(erroSenha, 'erro');
              return;
            }
            const senha_hash = await sha256Hex(senha);
            const novo = { id: genId(), escola_id, login, senha_hash, nome, papel: 'coordenador' };
            try {
              const res = await supaFetch('contas', { method: 'POST', headers: { 'Prefer': 'return=representation' }, body: JSON.stringify({ escola_id, login, senha_hash, nome, papel: 'coordenador' }) });
              if (Array.isArray(res) && res[0]) novo.id = res[0].id;
            } catch (e) {}
            db.contas.push(novo);
            salvarEstadoLocalOnly();
            fecharModal();
            toast('Coordenador criado!', 'sucesso');
            render();
          };
        };
        document.querySelectorAll('.btn-del-conta').forEach(b => {
          b.onclick = async () => {
            const id = Number(b.dataset.delConta);
            try { await supaFetch(`contas?id=eq.${id}`, { method: 'DELETE' }); } catch (e) {}
            db.contas = db.contas.filter(c => c.id !== id);
            salvarEstadoLocalOnly();
            render();
          };
        });
      }

      function renderAbaHistorico() {
        const hoje = hojeISO();
        const agoraMs = Date.now();
        const filtradas = db.transacoes.filter(t => {
          if (session.historicoTurmaId !== 'todas' && t.turmaId !== Number(session.historicoTurmaId)) {
            return false;
          }
          if (session.historicoPeriodo === 'hoje') {
            return t.criadoEm.startsWith(hoje);
          }
          if (session.historicoPeriodo === 'semana') {
            return (agoraMs - new Date(t.criadoEm).getTime()) <= 7 * 86400000;
          }
          if (session.historicoPeriodo === 'mes') {
            return (agoraMs - new Date(t.criadoEm).getTime()) <= 30 * 86400000;
          }
          return true;
        });
        const lista = filtradas.slice(0, 80);
        const periodos = [
          ['tudo', 'Tudo'],
          ['hoje', 'Dia atual'],
          ['semana', '1 semana'],
          ['mes', '1 mês']
        ];
        return `
          <div class="flex items-center justify-between mb-3">
            <h2 class="font-extrabold text-lg">Histórico (${filtradas.length})</h2>
            <select id="sel-hist-turma" class="glass-pill rounded-xl px-3 py-1.5 text-xs text-white font-semibold">
              <option value="todas" class="bg-[#18181D]" ${session.historicoTurmaId === 'todas' ? 'selected' : ''}>Todas as turmas</option>
              ${turmasOrdenadas().map(t => `<option value="${t.id}" class="bg-[#18181D]" ${String(t.id) === String(session.historicoTurmaId) ? 'selected' : ''}>${escapeHtml(t.nome)}</option>`).join('')}
            </select>
          </div>
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar mb-4">
            ${periodos.map(([id, label]) => `
              <button data-hist-per="${id}" class="btn-hist-per px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 ${session.historicoPeriodo === id ? 'glass-gold-btn' : 'glass-pill text-gray-300'}">${label}</button>
            `).join('')}
          </div>
          ${lista.length === 0 ? `<p class="text-sm text-gray-400">Sem registros.</p>` : `
            <div class="space-y-2.5">
              ${lista.map(t => {
                const orig = db.usuarios.find(u => u.id === t.origemId);
                const dest = db.usuarios.find(u => u.id === t.destinoId);
                const turma = db.turmas.find(tu => tu.id === t.turmaId);
                const sinal = t.valor >= 0 ? '+' : '';
                return `
                  <div class="glass-card rounded-3xl p-3.5 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                      <span class="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center text-white/90">${dest ? renderAvatar(dest.avatarId, 'w-5 h-5') : svgIcon('user', 'w-5 h-5')}</span>
                      <div>
                        <div class="font-bold text-sm">${dest ? escapeHtml(dest.apelido) : 'Aluno'} • ${escapeHtml(t.motivo)}</div>
                        <div class="text-[11px] text-gray-400 mt-0.5">Por ${orig ? escapeHtml(orig.apelido) : 'Sistema'} (${turma ? escapeHtml(turma.nome) : ''}) • ${formatarDataHora(t.criadoEm)}</div>
                      </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                      <span class="font-extrabold text-sm ${t.valor >= 0 ? 'text-amarelo' : 'text-red-400'}">${sinal}${fmtMoeda(t.valor)}</span>
                      <button data-estornar-tx="${t.id}" title="Estornar lançamento" class="btn-estornar-tx glass-pill text-red-400 p-1.5 rounded-lg hover:border-red-400/50">${svgIcon('trash', 'w-3.5 h-3.5')}</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        `;
      }

      function bindModoProfessor() {
        const selTurma = document.getElementById('sel-turma');
        if (selTurma) {
          selTurma.onchange = (e) => {
            session.turmaAtualId = Number(e.target.value);
            session.escolhendoTurma = false;
            session.selecionados.clear();
            session.selecaoMultipla = false;
            render();
          };
        }
        const btnVoltarSecao = document.getElementById('btn-voltar-secao');
        if (btnVoltarSecao) {
          btnVoltarSecao.onclick = () => {
            if (session.abaProfessor === 'turma' && !session.escolhendoTurma) {
              session.escolhendoTurma = true;
            } else if (session.abaProfessor === 'config' && session.subConfig !== null) {
              session.subConfig = null;
            } else {
              session.abaProfessor = session.abaAnterior && session.abaAnterior !== session.abaProfessor ? session.abaAnterior : 'turma';
            }
            render();
          };
        }

        document.getElementById('btn-ir-aluno').onclick = () => {
          session.modo = 'aluno';
          session.alunoTurmaId = null;
          session.alunoBusca = '';
          session.alunoAtivoId = null;
          session.carrinho = {};
          render();
        };
        document.querySelectorAll('.btn-nav').forEach(b => {
          b.onclick = () => {
            if (b.dataset.aba !== session.abaProfessor) {
              session.abaAnterior = session.abaProfessor;
            }
            session.abaProfessor = b.dataset.aba;
            session.fabMenuAberto = false;
            if (b.dataset.aba === 'config') session.subConfig = null;
            render();
          };
        });
