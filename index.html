        function abrirModalHorariosGlobal(turmaIdInicial) {
          let turmaIdSel = turmaIdInicial || turmasOrdenadas()[0]?.id;
          let rascunhos = (db.horariosAula || [])
            .filter(h => h.turmaId === turmaIdSel)
            .sort((a, b) => a.diaSemana - b.diaSemana || a.inicio.localeCompare(b.inicio))
            .map(h => ({ id: h.id, diaSemana: h.diaSemana, inicio: h.inicio, fim: h.fim }));
          if (rascunhos.length === 0) {
            rascunhos.push({ id: genId(), diaSemana: new Date().getDay(), inicio: '07:30', fim: somarMinutos('07:30', 45) });
          }

          function lerCamposAtuais() {
            rascunhos = rascunhos.map((r, idx) => {
              const diaEl = document.getElementById(`hor-dia-${idx}`);
              const iniEl = document.getElementById(`hor-ini-${idx}`);
              const fimEl = document.getElementById(`hor-fim-${idx}`);
              return {
                id: r.id,
                diaSemana: diaEl ? Number(diaEl.value) : r.diaSemana,
                inicio: iniEl ? iniEl.value : r.inicio,
                fim: fimEl ? fimEl.value : r.fim
              };
            });
          }

          function renderEditor() {
            const linhas = rascunhos.length === 0
              ? `<p class="text-xs text-gray-400 mb-3">Nenhum horário para esta turma. Adicione abaixo.</p>`
              : rascunhos.map((r, idx) => `
                  <div class="glass-pill rounded-2xl p-3 mb-2.5">
                    <div class="flex items-center justify-between gap-2 mb-2">
                      <select id="hor-dia-${idx}" class="bg-[#121218] border border-white/15 rounded-xl px-2.5 py-1.5 text-xs text-white font-semibold">
                        ${DIAS_SEMANA.map((d, i) => `<option value="${i}" ${i === r.diaSemana ? 'selected' : ''}>${d}</option>`).join('')}
                      </select>
                      <button type="button" data-rem-slot="${idx}" class="btn-rem-slot text-red-400 text-xs font-bold px-2 py-1">Remover &times;</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                      <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">Início</label>
                        <input id="hor-ini-${idx}" data-slot-idx="${idx}" type="time" value="${r.inicio}" class="inp-hor-ini w-full bg-[#121218] border border-white/15 rounded-xl px-2.5 py-1.5 text-xs text-white" />
                      </div>
                      <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">Fim</label>
                        <input id="hor-fim-${idx}" type="time" value="${r.fim}" class="w-full bg-[#121218] border border-white/15 rounded-xl px-2.5 py-1.5 text-xs text-white" />
                      </div>
                    </div>
                  </div>
                `).join('');

            abrirModal(`
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-lg">Horários da Turma</h3>
                <button id="btn-fechar-modal" class="text-gray-400 text-xl px-2">&times;</button>
              </div>
              <label class="block text-xs text-gray-400 mb-1">Turma</label>
              <select id="inp-hor-turma" class="w-full glass-pill rounded-xl px-3 py-2.5 text-sm text-white mb-3">
                ${turmasOrdenadas().map(t => `<option value="${t.id}" class="bg-[#18181D]" ${t.id === turmaIdSel ? 'selected' : ''}>${escapeHtml(t.nome)}</option>`).join('')}
              </select>
              <div class="max-h-64 overflow-y-auto pr-0.5 mb-3">${linhas}</div>
              <button type="button" id="btn-add-mais-horario" class="w-full glass-accent-purple text-white text-xs font-bold py-2.5 rounded-xl mb-2.5">+ Adicionar outro horário</button>
              <button type="button" id="btn-save-hor" class="w-full glass-gold-btn font-bold py-3 rounded-xl">Salvar e encerrar</button>
            `);

            document.getElementById('btn-fechar-modal').onclick = fecharModal;
            document.getElementById('inp-hor-turma').onchange = (e) => {
              turmaIdSel = Number(e.target.value);
              rascunhos = (db.horariosAula || [])
                .filter(h => h.turmaId === turmaIdSel)
                .sort((a, b) => a.diaSemana - b.diaSemana || a.inicio.localeCompare(b.inicio))
                .map(h => ({ id: h.id, diaSemana: h.diaSemana, inicio: h.inicio, fim: h.fim }));
              renderEditor();
            };
            document.querySelectorAll('.btn-rem-slot').forEach(b => {
              b.onclick = () => {
                lerCamposAtuais();
                rascunhos.splice(Number(b.dataset.remSlot), 1);
                renderEditor();
              };
            });
            document.querySelectorAll('.inp-hor-ini').forEach(inp => {
              inp.onchange = () => {
                const idx = Number(inp.dataset.slotIdx);
                const fimEl = document.getElementById(`hor-fim-${idx}`);
                if (fimEl && inp.value) fimEl.value = somarMinutos(inp.value, 45);
              };
            });
            document.getElementById('btn-add-mais-horario').onclick = () => {
              lerCamposAtuais();
              const ultimo = rascunhos[rascunhos.length - 1];
              const novoIni = ultimo ? ultimo.fim : '07:30';
              rascunhos.push({
                id: genId(),
                diaSemana: ultimo ? ultimo.diaSemana : new Date().getDay(),
                inicio: novoIni,
                fim: somarMinutos(novoIni, 45)
              });
              renderEditor();
            };
            document.getElementById('btn-save-hor').onclick = () => {
              lerCamposAtuais();
              for (const r of rascunhos) {
                if (!r.inicio || !r.fim || r.fim <= r.inicio) {
                  toast('Verifique um horário com fim menor ou igual ao início.', 'erro');
                  return;
                }
              }
              db.horariosAula = (db.horariosAula || []).filter(h => h.turmaId !== turmaIdSel);
              rascunhos.forEach(r => {
                db.horariosAula.push({ id: r.id || genId(), turmaId: turmaIdSel, diaSemana: r.diaSemana, inicio: r.inicio, fim: r.fim });
              });
              salvarEstado();
              fecharModal();
              toast('Horários salvos!', 'sucesso');
              render();
            };
          }
          renderEditor();
        }

              const reader = new FileReader();
              reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                  const maxDim = 96;
                  const scale = Math.min(maxDim / img.width, maxDim / img.height, 1);
                  const w = Math.max(1, Math.round(img.width * scale));
                  const h = Math.max(1, Math.round(img.height * scale));
                  const canvas = document.createElement('canvas');
                  canvas.width = w;
                  canvas.height = h;
                  const ctx = canvas.getContext('2d');
                  ctx.drawImage(img, 0, 0, w, h);
                  const imgData = ctx.getImageData(0, 0, w, h);
                  const data = imgData.data;
                  // Amostra a cor de fundo do canto superior esquerdo
                  const bgR = data[0], bgG = data[1], bgB = data[2];
                  for (let i = 0; i < data.length; i += 4) {
                    const dr = data[i] - bgR;
                    const dg = data[i + 1] - bgG;
                    const db2 = data[i + 2] - bgB;
                    const dist = Math.sqrt(dr * dr + dg * dg + db2 * db2);
                    if (dist < 48) {
                      data[i + 3] = 0;
                    } else if (dist < 75) {
                      data[i + 3] = Math.round(((dist - 48) / 27) * data[i + 3]);
                    }
                  }
                  ctx.putImageData(imgData, 0, 0);
                  db.config.moedaIcone = canvas.toDataURL('image/png');
                  salvarEstado();
                  toast('Ícone atualizado sem fundo!', 'sucesso');

      function bindModoAluno() {
        const btnVoltar = document.getElementById('btn-voltar-prof');
        if (btnVoltar) btnVoltar.onclick = pedirPinProfessor;

        document.querySelectorAll('.btn-aluno-turma').forEach(b => {
          b.onclick = () => {
            session.alunoTurmaId = Number(b.dataset.alunoTurma);
            session.alunoBusca = '';
            render();
          };
        });

        const btnVoltarTurmas = document.getElementById('btn-voltar-turmas-aluno');
        if (btnVoltarTurmas) {
          btnVoltarTurmas.onclick = () => {
            session.alunoTurmaId = null;
            session.alunoBusca = '';
            render();
          };
        }

        const inpBusca = document.getElementById('inp-busca-aluno');
        if (inpBusca) {
          inpBusca.oninput = () => {
            session.alunoBusca = inpBusca.value;
            const pos = inpBusca.selectionStart;
            render();
            const el = document.getElementById('inp-busca-aluno');
            if (el) {
              el.focus();
              el.setSelectionRange(pos, pos);
            }
          };
        }

        document.querySelectorAll('.btn-escolher-aluno').forEach(b => {
          b.onclick = () => {
            session.alunoAtivoId = Number(b.dataset.escolherAluno);
            session.alunoTela = 'menu';
            session.carrinho = {};
            render();
          };
        });

        const btnTrilhaAluno = document.getElementById('btn-abrir-trilha-b2');
        if (btnTrilhaAluno) {
          btnTrilhaAluno.onclick = () => abrirTrilhaBloco2(session.alunoAtivoId);
        }
        const btnIrNota = document.getElementById('btn-aluno-ir-nota');
        if (btnIrNota) btnIrNota.onclick = () => { session.alunoTela = 'nota'; render(); };
        const btnIrMercado = document.getElementById('btn-aluno-ir-mercado');
        if (btnIrMercado) btnIrMercado.onclick = () => { session.alunoTela = 'mercado'; render(); };
        const btnVoltarMenuAluno = document.getElementById('btn-aluno-voltar-menu');
        if (btnVoltarMenuAluno) btnVoltarMenuAluno.onclick = () => { session.alunoTela = 'menu'; render(); };
        document.querySelectorAll('.btn-aluno-broche').forEach(b => {
          b.onclick = () => {
            const ok = b.dataset.brocheOk === '1';
            toast(`${b.dataset.brocheInfo}: ${ok ? 'Conquistado!' : 'Ainda não conquistado'}`, ok ? 'sucesso' : 'info');
          };
        });
        const btnFechar = document.getElementById('btn-fechar-aluno');
        if (btnFechar) {
          btnFechar.onclick = () => {
            session.alunoAtivoId = null;
            session.carrinho = {};
            render();
          };
        }

        document.querySelectorAll('.btn-add-cart').forEach(b => {
          b.onclick = () => {
            const id = Number(b.dataset.add);
            const it = db.itensMercadinho.find(x => x.id === id);
            const atual = session.carrinho[id] || 0;
            if (it && it.estoque !== null && atual >= it.estoque) {
              toast('Estoque máximo atingido.', 'erro');
              return;
            }
            session.carrinho[id] = atual + 1;
            render();
          };
        });

        document.querySelectorAll('.btn-rem-cart').forEach(b => {
          b.onclick = () => {
            const id = Number(b.dataset.rem);
            if ((session.carrinho[id] || 0) <= 1) delete session.carrinho[id];
            else session.carrinho[id] -= 1;
            render();
          };
        });

        const btnFin = document.getElementById('btn-finalizar-compra');
        if (btnFin) {
          btnFin.onclick = () => {
            const aluno = db.usuarios.find(u => u.id === session.alunoAtivoId);
            if (!aluno) return;
            const itens = [];
            let total = 0;
            Object.entries(session.carrinho).forEach(([id, qtd]) => {
              const it = db.itensMercadinho.find(x => x.id === Number(id));
              if (it && qtd > 0) {
                itens.push({ itemId: it.id, nome: it.nome, qtd, preco: it.preco });
                total += it.preco * qtd;
              }
            });
            if (!itens.length || total > aluno.saldo || alunoJaResgatouHoje(aluno.id)) return;

            aluno.saldo -= total;
            itens.forEach(i => {
              const orig = db.itensMercadinho.find(x => x.id === i.itemId);
              if (orig && orig.estoque !== null) orig.estoque = Math.max(0, orig.estoque - i.qtd);
            });
            const pedidoId = genId();
            const now = new Date().toISOString();
            db.pedidos.unshift({
              id: pedidoId,
              alunoId: aluno.id,
              turmaId: session.turmaAtualId,
              itens,
              total,
              status: 'pendente_entrega',
              criadoEm: now,
              entregueEm: null
            });
            db.transacoes.unshift({
              id: genId(),
              turmaId: session.turmaAtualId,
              origemId: aluno.id,
              destinoId: aluno.id,
              valor: -total,
              tipo: 'compra',
              motivo: `Mercadinho: ${itens.map(i => `${i.qtd}x ${i.nome}`).join(', ')}`,
              criadoEm: now
            });
            salvarEstado();
            session.carrinho = {};

            let segs = 10;
            abrirModal(`
              <div class="text-center py-2">
                <div class="w-16 h-16 mx-auto rounded-2xl glass-accent-purple flex items-center justify-center text-amarelo mb-3">${svgIcon('check', 'w-9 h-9')}</div>
                <h3 class="font-extrabold text-xl mb-1">Compra confirmada!</h3>
                <p class="text-xs text-gray-300 mb-4">O professor recebeu seu pedido para entrega.</p>
                <button id="btn-desfazer-compra" class="w-full bg-red-700/85 border border-red-400/30 text-white font-bold py-3 rounded-xl mb-2">Desfazer (<span id="undo-sec">10</span>s)</button>
                <button id="btn-concluir-aluno" class="w-full glass-gold-btn font-bold py-3 rounded-xl">Concluir agora</button>
              </div>
            `);

            const timer = setInterval(() => {
              segs -= 1;
              const el = document.getElementById('undo-sec');
              if (el) el.textContent = String(segs);
              if (segs <= 0) {
                clearInterval(timer);
                fecharModal();
                session.alunoAtivoId = null;
                render();
              }
            }, 1000);

            document.getElementById('btn-concluir-aluno').onclick = () => {
              clearInterval(timer);
              fecharModal();
              session.alunoAtivoId = null;
              render();
            };

            document.getElementById('btn-desfazer-compra').onclick = () => {
              clearInterval(timer);
              const ped = db.pedidos.find(p => p.id === pedidoId);
              if (ped) {
                ped.status = 'cancelado';
                aluno.saldo += ped.total;
                ped.itens.forEach(i => {
                  const orig = db.itensMercadinho.find(x => x.id === i.itemId);
                  if (orig && orig.estoque !== null) orig.estoque += i.qtd;
                });
                db.transacoes.unshift({
                  id: genId(),
                  turmaId: session.turmaAtualId,
                  origemId: aluno.id,
                  destinoId: aluno.id,
                  valor: ped.total,
                  tipo: 'estorno',
                  motivo: 'Compra desfeita pelo aluno',
                  criadoEm: new Date().toISOString()
                });
                salvarEstado();
              }
              fecharModal();
              toast('Compra desfeita e saldo devolvido!', 'sucesso');
              render();
            };
          };
        }
      }

      const SESSION_TAB_KEY = 'economia_turma_tab_session_v1';
      const SESSION_IDLE_TIMEOUT_MS = 30 * 60 * 1000;
      let lastActivityTs = Date.now();
      let lastActivitySaveTs = 0;

      function limparSessaoAba() {
        try { sessionStorage.removeItem(SESSION_TAB_KEY); } catch (e) {}
      }

      function salvarSessaoAba(force = false) {
        if (!session.contaAtiva || session.modo === 'login') {
          limparSessaoAba();
          return;
        }
        const now = Date.now();
        if (!force && (now - lastActivitySaveTs < 10000)) return;
        lastActivityTs = now;
        lastActivitySaveTs = now;
        try {
          sessionStorage.setItem(SESSION_TAB_KEY, JSON.stringify({
            contaAtiva: session.contaAtiva,
            escolaAtualId: session.escolaAtualId,
            modo: session.modo,
            abaProfessor: session.abaProfessor,
            turmaAtualId: session.turmaAtualId,
            escolhendoTurma: session.escolhendoTurma,
            alunoTurmaId: session.alunoTurmaId,
            alunoAtivoId: session.alunoAtivoId,
            lastActivity: now
          }));
        } catch (e) {}
      }

      function registrarAtividadeSessao() {
        if (!session.contaAtiva || session.modo === 'login') return;
        const now = Date.now();
        lastActivityTs = now;
        if (now - lastActivitySaveTs >= 10000) {
          salvarSessaoAba(true);
        }
      }

      function verificarInatividadeSessao() {
        if (!session.contaAtiva || session.modo === 'login') return;
        if (Date.now() - lastActivityTs >= SESSION_IDLE_TIMEOUT_MS) {
          session.contaAtiva = null;
          session.modo = 'login';
          limparSessaoAba();
          fecharModal();
          render();
          toast('Sessão encerrada após 30 min sem atividade.', 'roxo');
        }
      }

      function restaurarSessaoAba() {
        try {
          const raw = sessionStorage.getItem(SESSION_TAB_KEY);
          if (!raw) return false;
          const saved = JSON.parse(raw);
          if (!saved || !saved.contaAtiva || !saved.modo || saved.modo === 'login') {
            limparSessaoAba();
            return false;
          }
          const elapsed = Date.now() - Number(saved.lastActivity || 0);
          if (elapsed >= SESSION_IDLE_TIMEOUT_MS) {
            limparSessaoAba();
            return false;
          }
          session.contaAtiva = saved.contaAtiva;
          if (saved.escolaAtualId) {
            session.escolaAtualId = saved.escolaAtualId;
            if (saved.contaAtiva.papel !== 'admin') {
              trocarEscolaAtiva(saved.escolaAtualId);
            }
          }
          session.modo = saved.modo;
          if (saved.abaProfessor) session.abaProfessor = saved.abaProfessor;
          if (saved.turmaAtualId != null) session.turmaAtualId = saved.turmaAtualId;
          if (typeof saved.escolhendoTurma === 'boolean') session.escolhendoTurma = saved.escolhendoTurma;
          if (saved.alunoTurmaId != null) session.alunoTurmaId = saved.alunoTurmaId;
          if (saved.alunoAtivoId != null) session.alunoAtivoId = saved.alunoAtivoId;
          // Atualização da página conta como atividade (reinicia o contador de 30 min)
          lastActivityTs = Date.now();
          salvarSessaoAba(true);
          return true;
        } catch (e) {
          limparSessaoAba();
          return false;
        }
      }

      const navHistoryStack = [];
      let isHandlingPopState = false;

      function getNavSnapshot() {
        return {
          modo: session.modo,
          abaProfessor: session.abaProfessor,
          turmaAtualId: session.turmaAtualId,
          escolhendoTurma: !!session.escolhendoTurma,
          subConfig: session.subConfig || null,
          alunoTurmaId: session.alunoTurmaId || null,
          alunoAtivoId: session.alunoAtivoId || null,
          alunoTela: session.alunoTela || null,
          selecaoMultipla: !!session.selecaoMultipla
        };
      }

      function getNavKey(snap) {
        return [
          snap.modo, snap.abaProfessor, snap.turmaAtualId, snap.escolhendoTurma,
          snap.subConfig, snap.alunoTurmaId, snap.alunoAtivoId, snap.alunoTela, snap.selecaoMultipla
        ].join('|');
      }

      function aplicarNavSnapshot(snap) {
        if (!snap) return;
        session.modo = snap.modo;
        session.abaProfessor = snap.abaProfessor;
        session.turmaAtualId = snap.turmaAtualId;
        session.escolhendoTurma = snap.escolhendoTurma;
        session.subConfig = snap.subConfig;
        session.alunoTurmaId = snap.alunoTurmaId;
        session.alunoAtivoId = snap.alunoAtivoId;
        if ('alunoTela' in session || snap.alunoTela !== null) session.alunoTela = snap.alunoTela;
        session.selecaoMultipla = snap.selecaoMultipla;
        if (!snap.selecaoMultipla && session.selecionados) session.selecionados.clear();
        session.fabMenuAberto = false;
      }

      function voltarPassoLogico() {
        if (session.modo === 'aluno') {
          if (session.alunoTela) { session.alunoTela = null; return true; }
          if (session.alunoAtivoId) { session.alunoAtivoId = null; return true; }
          if (session.alunoTurmaId) { session.alunoTurmaId = null; return true; }
          return false;
        }
        if (session.modo === 'professor') {
          if (session.selecaoMultipla) { session.selecaoMultipla = false; session.selecionados.clear(); return true; }
          if (session.abaProfessor === 'config' && session.subConfig !== null) { session.subConfig = null; return true; }
          if (session.abaProfessor !== 'turma') { session.abaProfessor = 'turma'; return true; }
          if (!session.escolhendoTurma) { session.escolhendoTurma = true; return true; }
          return false;
        }
        return false;
      }

      const _origRender = render;
      render = function () {
        _origRender();
        if (!isHandlingPopState) {
          const snap = getNavSnapshot();
          const key = getNavKey(snap);
          const last = navHistoryStack[navHistoryStack.length - 1];
          if (!last) {
            navHistoryStack.push({ key, snap });
            try { history.replaceState({ appNav: true, idx: 0 }, ''); } catch (e) {}
          } else if (last.key !== key) {
            if (snap.modo === 'login') {
              navHistoryStack.length = 0;
              navHistoryStack.push({ key, snap });
              try { history.replaceState({ appNav: true, idx: 0 }, ''); } catch (e) {}
            } else {
              navHistoryStack.push({ key, snap });
              if (navHistoryStack.length > 40) navHistoryStack.shift();
              try { history.pushState({ appNav: true, idx: navHistoryStack.length - 1 }, ''); } catch (e) {}
            }
          }
        }
        if (session.contaAtiva && session.modo !== 'login') {
          salvarSessaoAba(true);
        } else {
          limparSessaoAba();
        }
      };

      window.addEventListener('popstate', () => {
        const backdrop = document.getElementById('modal-backdrop');
        if (backdrop && !backdrop.classList.contains('hidden')) {
          fecharModal(true);
          return;
        }
        isHandlingPopState = true;
        try {
          if (navHistoryStack.length > 1) {
            navHistoryStack.pop();
            const prev = navHistoryStack[navHistoryStack.length - 1];
            aplicarNavSnapshot(prev.snap);
            _origRender();
            if (session.contaAtiva && session.modo !== 'login') salvarSessaoAba(true);
          } else if (voltarPassoLogico()) {
            const snap = getNavSnapshot();
            navHistoryStack[0] = { key: getNavKey(snap), snap };
            _origRender();
            try { history.pushState({ appNav: true, idx: 0 }, ''); } catch (e) {}
            if (session.contaAtiva && session.modo !== 'login') salvarSessaoAba(true);
          } else if (session.modo !== 'login') {
            try { history.pushState({ appNav: true, idx: 0 }, ''); } catch (e) {}
          }
        } finally {
          isHandlingPopState = false;
        }
      });

      ['pointerdown', 'keydown', 'touchstart', 'scroll', 'click'].forEach(evt => {
        window.addEventListener(evt, registrarAtividadeSessao, { passive: true });
      });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) verificarInatividadeSessao();
      });
      setInterval(verificarInatividadeSessao, 30000);

      const sessaoRestaurada = restaurarSessaoAba();
      render();
      if (sessaoRestaurada) {
        sincronizarComNuvem(true).then(() => {
          if (session.contaAtiva && session.modo !== 'login') render();
        });
      }
    })();
  </script>
</body>
</html>
