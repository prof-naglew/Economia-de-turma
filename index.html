<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <title>Economia da Turma — IPs</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #07070B;
      color: #F5F5F7;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
    /* Orbes de luz ambiente para o efeito Liquid Glass */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .orb-purple {
      position: absolute;
      width: 420px;
      height: 420px;
      top: -120px;
      left: -100px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.38) 0%, rgba(106, 27, 154, 0.08) 55%, transparent 75%);
      filter: blur(28px);
    }
    .orb-gold {
      position: absolute;
      width: 340px;
      height: 340px;
      bottom: 8%;
      right: -110px;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(255, 214, 0, 0.20) 0%, rgba(255, 214, 0, 0.04) 55%, transparent 75%);
      filter: blur(32px);
    }
    .orb-deep {
      position: absolute;
      width: 380px;
      height: 380px;
      top: 42%;
      left: 25%;
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(88, 28, 135, 0.24) 0%, transparent 70%);
      filter: blur(40px);
    }

    /* Superfícies Liquid Glass */
    .glass-card {
      background: linear-gradient(145deg, rgba(34, 30, 46, 0.58), rgba(16, 15, 22, 0.68));
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .glass-header {
      background: linear-gradient(180deg, rgba(28, 18, 44, 0.72), rgba(14, 12, 22, 0.62));
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.05);
    }
    .glass-nav {
      background: linear-gradient(180deg, rgba(22, 20, 30, 0.72), rgba(10, 10, 14, 0.86));
      backdrop-filter: blur(26px) saturate(190%);
      -webkit-backdrop-filter: blur(26px) saturate(190%);
      border-top: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }
    .glass-accent-purple {
      background: linear-gradient(135deg, rgba(126, 87, 194, 0.48), rgba(56, 0, 107, 0.62));
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 16px 36px rgba(56, 0, 107, 0.45);
    }
    .glass-gold-btn {
      background: linear-gradient(135deg, #FFE44D, #FFD600);
      color: #09090D;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.65), 0 8px 22px rgba(255, 214, 0, 0.25);
    }
    .text-amarelo { color: #FFD600; }
    .border-card { border-color: rgba(255, 255, 255, 0.13); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Tema Claro Liquid Glass */
    body.theme-light {
      background-color: #F2EFF9;
      color: #181622;
    }
    body.theme-light .orb-purple {
      background: radial-gradient(circle, rgba(138, 43, 226, 0.22) 0%, rgba(106, 27, 154, 0.04) 55%, transparent 75%);
    }
    body.theme-light .orb-gold {
      background: radial-gradient(circle, rgba(255, 196, 0, 0.25) 0%, transparent 75%);
    }
    body.theme-light .glass-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.78), rgba(242, 238, 252, 0.85));
      border-color: rgba(106, 27, 154, 0.16);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 8px 24px rgba(56, 0, 107, 0.08);
      color: #181622;
    }
    body.theme-light .glass-header {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.85), rgba(242, 238, 252, 0.78));
      border-bottom-color: rgba(106, 27, 154, 0.14);
      color: #181622;
    }
    body.theme-light .glass-nav {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(245, 242, 252, 0.95));
      border-top-color: rgba(106, 27, 154, 0.14);
    }
    body.theme-light .glass-pill {
      background: rgba(106, 27, 154, 0.08);
      border-color: rgba(106, 27, 154, 0.18);
      color: #181622;
    }
    body.theme-light .text-white { color: #181622 !important; }
    body.theme-light .text-gray-200,
    body.theme-light .text-gray-300 { color: #38344A !important; }
    body.theme-light .text-gray-400,
    body.theme-light .text-gray-500 { color: #635E78 !important; }
    body.theme-light .text-amarelo { color: #8A5A00 !important; }
    body.theme-light .glass-accent-purple,
    body.theme-light .glass-accent-purple *,
    body.theme-light .glass-accent-purple .text-white { color: #FFFFFF !important; }
    body.theme-light .glass-accent-purple .text-amarelo { color: #FFD600 !important; }
    body.theme-light .glass-gold-btn,
    body.theme-light .glass-gold-btn * { color: #09090D !important; }
    body.theme-light .bg-white\/10,
    body.theme-light .bg-white\/5 { background-color: rgba(106, 27, 154, 0.10) !important; }
    body.theme-light .bg-\[\#121218\],
    body.theme-light .bg-\[\#18181D\] {
      background-color: rgba(255, 255, 255, 0.92) !important;
      color: #181622 !important;
      border-color: rgba(106, 27, 154, 0.25) !important;
    }
    body.theme-light select option {
      background-color: #FFFFFF !important;
      color: #181622 !important;
    }
    body.theme-light .border-white\/10,
    body.theme-light .border-white\/15,
    body.theme-light .border-white\/20 {
      border-color: rgba(106, 27, 154, 0.18) !important;
    }
    body.theme-light .text-emerald-300,
    body.theme-light .text-emerald-400 { color: #047857 !important; }
    body.theme-light .text-red-400 { color: #B91C1C !important; }
    body.theme-light .text-purple-100,
    body.theme-light .text-purple-200,
    body.theme-light .text-purple-300 { color: #581C87 !important; }
    body.theme-light .glass-accent-purple .text-purple-100,
    body.theme-light .glass-accent-purple .text-purple-200 { color: #F3E8FF !important; }
    body.theme-light .bg-red-950\/50,
    body.theme-light .bg-red-950\/35 {
      background-color: #FEE2E2 !important;
      border-color: #DC2626 !important;
    }
    body.theme-light .text-red-300,
    body.theme-light .text-red-200\/90,
    body.theme-light .text-red-200 { color: #991B1B !important; }

      function hojeISO() {
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function formatarDataCurta(yyyyMmDd) {
        const [y, m, d] = yyyyMmDd.split('-');
        return `${d}/${m}/${y}`;
      }

      function formatarDataHora(iso) {
        const d = new Date(iso);
        const day = String(d.getDate()).padStart(2, '0');
        const mon = String(d.getMonth() + 1).padStart(2, '0');
        const h = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${day}/${mon} ${h}:${min}`;
      }

      function carregarEstado() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (!Array.isArray(parsed.horariosAula)) parsed.horariosAula = [];
            if (!parsed.config.tema) parsed.config.tema = 'escuro';
            if (typeof parsed.config.biometriaAtivada !== 'boolean') parsed.config.biometriaAtivada = false;
            if (typeof parsed.config.presencaAtiva !== 'boolean') parsed.config.presencaAtiva = true;
            if (typeof parsed.config.presencaValor !== 'number') parsed.config.presencaValor = 1;
            if (!Array.isArray(parsed.bimestres)) parsed.bimestres = [];
            parsed.regras = (parsed.regras || []).filter(r => !r.ehPresenca && r.titulo.toLowerCase() !== 'presença');
            if (!parsed.presencaMigrada) {
              const jaTem = (parsed.regras || []).some(r => r.ehPresenca || r.titulo.toLowerCase() === 'presença');
              if (!jaTem) {
                parsed.regras.unshift({ id: 99, titulo: 'Presença', valor: 1, icone: 'check', ehPresenca: true });
              }
              parsed.presencaMigrada = true;
            }
            return parsed;
          }
        } catch (e) {}
        return criarEstadoInicial();
      }

      function somarMinutos(hhmm, minutos = 45) {
        if (!hhmm || !hhmm.includes(':')) return '08:15';
        const [h, m] = hhmm.split(':').map(Number);
        const total = Math.min(23 * 60 + 59, h * 60 + m + minutos);
        return `${String(Math.floor(total / 60)).padStart(2, '0')}:${String(total % 60).padStart(2, '0')}`;
      }

      function turmasOrdenadas() {
        return db.turmas.slice().sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { numeric: true, sensitivity: 'base' }));
      }

      function alunosDaTurmaOrdenados(turmaId) {
        return db.usuarios
          .filter(u => u.turmaId === turmaId && u.papel !== 'professor')
          .sort((a, b) => a.apelido.localeCompare(b.apelido, 'pt-BR', { sensitivity: 'base' }));
      }

      function totalTokensTurma(turmaId) {
        return db.usuarios
          .filter(u => u.turmaId === turmaId && u.papel !== 'professor')
          .reduce((acc, u) => acc + (u.saldo || 0), 0);
      }

      function cargosDaTurma(turmaId) {
        return db.cargos.filter(c => c.turmaId === null || c.turmaId === turmaId);
      }

      function getOcupanteCargo(cargo, turmaId) {
        if (cargo.turmaId === null) {
          return (cargo.ocupantes && cargo.ocupantes[turmaId]) || null;
        }
        return cargo.usuarioId || null;
      }

      function setOcupanteCargo(cargo, turmaId, usuarioId) {
        if (cargo.turmaId === null) {
          if (!cargo.ocupantes) cargo.ocupantes = {};
          cargo.ocupantes[turmaId] = usuarioId || null;
        } else {
          cargo.usuarioId = usuarioId || null;
        }
      }

      function getPagamentoCargo(cargo, turmaId) {
        if (cargo.turmaId === null) {
          return (cargo.pagamentos && cargo.pagamentos[turmaId]) || null;
        }
        return cargo.ultimoPagamento || null;
      }

      function setPagamentoCargo(cargo, turmaId, dataRef) {
        if (cargo.turmaId === null) {
          if (!cargo.pagamentos) cargo.pagamentos = {};
          cargo.pagamentos[turmaId] = dataRef;
        } else {
          cargo.ultimoPagamento = dataRef;
        }
      }

      function encontrarHorarioAtivoAgora() {
        const agora = new Date();
        const dia = agora.getDay();
        const hhmm = `${String(agora.getHours()).padStart(2, '0')}:${String(agora.getMinutes()).padStart(2, '0')}`;
        return (db.horariosAula || []).find(h => h.diaSemana === dia && hhmm >= h.inicio && hhmm <= h.fim) || null;
      }

      function iconeMoedaImg(sizeClass = 'w-4 h-4') {
        const src = db.config.moedaIcone || IPE_ICON_DEFAULT;
        return `<img src="${src}" alt="Ficha" class="${sizeClass} object-contain inline-block shrink-0" />`;
      }

      function fmtMoeda(valor) {
        const n = Number(valor) || 0;
        return `${n} ${n === 1 ? db.config.moedaSingular : db.config.moedaPlural}`;
      }

      function encontrarBimestreAtual() {
        const hoje = hojeISO();
        return (db.bimestres || []).find(b => b.inicio && b.fim && hoje >= b.inicio && hoje <= b.fim) || null;
      }

      const horarioInicial = encontrarHorarioAtivoAgora();
      const session = {
        modo: 'professor',
        abaProfessor: 'turma',
        turmaAtualId: horarioInicial ? horarioInicial.turmaId : (db.turmas[0]?.id || 1),
        escolhendoTurma: !horarioInicial,
        selecaoMultipla: false,
        selecionados: new Set(),
        alunoTurmaId: null,
        alunoBusca: '',
        alunoAtivoId: null,
        carrinho: {},
        dataSelecionada: hojeISO(),
        calMes: new Date().getMonth(),
        calAno: new Date().getFullYear(),
        historicoPeriodo: 'tudo',
        historicoTurmaId: 'todas',
        abaAnterior: 'turma',
        subConfig: null,
        fabMenuAberto: false
      };
      let fabAppearTimer = null;
      let fabFadeTimer = null;

      function limparTimersFab() {
        if (fabAppearTimer) { clearTimeout(fabAppearTimer); fabAppearTimer = null; }
        if (fabFadeTimer) { clearTimeout(fabFadeTimer); fabFadeTimer = null; }
      }

      function toast(msg, tipo = 'roxo') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const div = document.createElement('div');
        const ehPerigo = tipo === 'erro' || tipo === 'perigo';
        const cor = ehPerigo
          ? 'bg-red-700/95 border-red-300/70'
          : (tipo === 'sucesso' ? 'bg-emerald-800/90 border-emerald-400/40' : 'bg-purple-900/90 border-purple-300/30');
        div.className = `${cor} backdrop-blur-xl text-white px-4 py-3 rounded-2xl shadow-2xl text-sm font-bold flex items-center justify-center gap-2 border transition-opacity`;
        div.innerHTML = `${ehPerigo ? svgIcon('alertTriangle', 'w-5 h-5 text-white') : ''}<span>${escapeHtml(msg)}</span>`;
        container.appendChild(div);
        setTimeout(() => {
          div.style.opacity = '0';
          setTimeout(() => div.remove(), 250);
        }, 2600);
      }

      function abrirModal(html) {
        const backdrop = document.getElementById('modal-backdrop');
        const content = document.getElementById('modal-content');
        content.innerHTML = html;
        backdrop.classList.remove('hidden');
        backdrop.classList.add('flex');
      }

      function fecharModal() {
        const backdrop = document.getElementById('modal-backdrop');
        backdrop.classList.add('hidden');
        backdrop.classList.remove('flex');
      }

      document.getElementById('modal-backdrop').addEventListener('click', (e) => {
        if (e.target.id === 'modal-backdrop') fecharModal();
      });

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function lancarIps(origemId, destinoIds, valor, motivo, tipo = 'ganho', dataRef = null) {
        const hoje = hojeISO();
        const alvoData = dataRef || hoje;
        const criadoEm = alvoData === hoje ? new Date().toISOString() : `${alvoData}T12:00:00.000Z`;
        destinoIds.forEach(id => {
          const u = db.usuarios.find(x => x.id === id);
          if (!u) return;
          u.saldo = (u.saldo || 0) + valor;
          db.transacoes.unshift({
            id: genId(),
            turmaId: session.turmaAtualId,
            origemId,
            destinoId: id,
            valor,
            tipo,
            motivo,
            criadoEm
          });
        });
        salvarEstado();
      }

      function pontosDoAlunoNaData(alunoId, dataYmd) {
        return db.transacoes
          .filter(t => t.destinoId === alunoId && t.valor > 0 && t.criadoEm.startsWith(dataYmd))
          .reduce((acc, t) => acc + t.valor, 0);
      }

      function abrirModalCalendario() {
        const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
        const hoje = hojeISO();

        function renderCal() {
          const ano = session.calAno;
          const mes = session.calMes;
          const primeiroDia = new Date(ano, mes, 1).getDay();
          const diasNoMes = new Date(ano, mes + 1, 0).getDate();
          const diasComRegistro = new Set(
            db.transacoes
              .filter(t => t.turmaId === session.turmaAtualId && t.valor > 0)
              .map(t => t.criadoEm.slice(0, 10))
          );

          let celulas = '';
          for (let i = 0; i < primeiroDia; i++) {
            celulas += '<div></div>';
          }
          for (let d = 1; d <= diasNoMes; d++) {
            const ymd = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const futuro = ymd > hoje;
            const sel = ymd === session.dataSelecionada;
            const temReg = diasComRegistro.has(ymd);
            celulas += `
              <button type="button" data-cal-ymd="${ymd}" ${futuro ? 'disabled' : ''} class="btn-cal-dia h-10 rounded-xl text-xs font-bold flex flex-col items-center justify-center relative transition ${sel ? 'glass-gold-btn' : (futuro ? 'text-gray-600 opacity-40' : 'glass-pill text-white hover:border-[#FFD600]/60')}">
                <span>${d}</span>
                ${temReg ? `<span class="w-1.5 h-1.5 rounded-full ${sel ? 'bg-black' : 'bg-[#FFD600]'} mt-0.5"></span>` : ''}
              </button>
            `;
          }

          abrirModal(`
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-bold text-base flex items-center gap-2">${svgIcon('calendar', 'w-5 h-5 text-amarelo')} <span>Calendário de Lançamentos</span></h3>
              <button id="btn-fechar-modal" class="text-gray-400 text-xl px-2">&times;</button>
            </div>
            <div class="flex items-center justify-between mb-3">
              <button id="cal-prev" class="glass-pill px-3 py-1.5 rounded-xl text-xs font-bold">&larr;</button>
              <span class="font-bold text-sm">${meses[mes]} ${ano}</span>
              <button id="cal-next" class="glass-pill px-3 py-1.5 rounded-xl text-xs font-bold">&rarr;</button>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-[10px] text-gray-400 font-semibold mb-1.5">
              <div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div>
            </div>
            <div class="grid grid-cols-7 gap-1.5 mb-4">${celulas}</div>
            <button id="cal-hoje" class="w-full glass-accent-purple text-white text-xs font-bold py-2.5 rounded-xl">Voltar para Hoje (${formatarDataCurta(hoje)})</button>
          `);

          document.getElementById('btn-fechar-modal').onclick = fecharModal;
          document.getElementById('cal-prev').onclick = () => {
            session.calMes -= 1;
            if (session.calMes < 0) { session.calMes = 11; session.calAno -= 1; }
            renderCal();
          };
          document.getElementById('cal-next').onclick = () => {
            session.calMes += 1;
            if (session.calMes > 11) { session.calMes = 0; session.calAno += 1; }
            renderCal();
          };
          document.getElementById('cal-hoje').onclick = () => {
            session.dataSelecionada = hoje;
            fecharModal();
            render();
          };
          document.querySelectorAll('.btn-cal-dia').forEach(b => {
            b.onclick = () => {
              session.dataSelecionada = b.dataset.calYmd;
              fecharModal();
              render();
            };
          });
        }
        renderCal();
      }



      function alunoJaResgatouHoje(alunoId) {
        const hoje = hojeISO();
        return db.pedidos.some(p => p.alunoId === alunoId && p.status !== 'cancelado' && p.criadoEm.startsWith(hoje));
      }

      // --- Modais ---
      function abrirModalLancar(alvosIds) {
        const alvos = db.usuarios.filter(u => alvosIds.includes(u.id));
        if (!alvos.length) return;
        const regras = db.regras;
        const dataAtiva = session.dataSelecionada;
        const ehRetro = dataAtiva !== hojeISO();
        const titulo = alvos.length === 1
          ? `Dar ${db.config.moedaPlural} para ${escapeHtml(alvos[0].apelido)}`
          : `Dar ${db.config.moedaPlural} para ${alvos.length} alunos`;

        const listaRegras = regras.length === 0
          ? `<p class="text-sm text-gray-400">Nenhuma regra liberada.</p>`
          : regras.map(r => `
              <button data-regra-id="${r.id}" class="btn-aplicar-regra w-full flex items-center justify-between p-3.5 rounded-2xl glass-pill hover:border-[#FFD600] transition mb-2.5 text-left">
                <div class="flex items-center gap-3">
                  <span class="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center text-white/90">${renderRegraIcone(r.icone, 'w-5 h-5')}</span>
                  <span class="font-semibold text-sm">${escapeHtml(r.titulo)}</span>
                </div>
                <span class="glass-gold-btn font-extrabold text-xs px-3 py-1 rounded-full">+${r.valor}</span>
              </button>
            `).join('');

        abrirModal(`
          <div class="flex items-center justify-between mb-2">
            <h3 class="font-bold text-lg text-white flex items-center gap-2">${svgIcon('bolt', 'w-5 h-5 text-amarelo')} <span>${titulo}</span></h3>
            <button id="btn-fechar-modal" class="text-gray-400 hover:text-white text-xl px-2">&times;</button>
          </div>
          ${ehRetro ? `<p class="text-xs text-amarelo mb-3">Lançamento retroativo para ${formatarDataCurta(dataAtiva)}</p>` : `<p class="text-xs text-gray-400 mb-3">Data: ${formatarDataCurta(dataAtiva)}</p>`}
          <div class="max-h-72 overflow-y-auto">${listaRegras}</div>
        `);

        document.getElementById('btn-fechar-modal').onclick = fecharModal;
        document.querySelectorAll('.btn-aplicar-regra').forEach(btn => {
          btn.onclick = () => {
            const regraId = Number(btn.dataset.regraId);
            const regra = db.regras.find(r => r.id === regraId);
            if (!regra) return;

            lancarIps(1, alvos.map(a => a.id), regra.valor, regra.titulo, 'ganho', dataAtiva);
            session.selecaoMultipla = false;
            session.selecionados.clear();
            fecharModal();
            toast(`+${fmtMoeda(regra.valor)} (${regra.titulo}) lançado!`, 'sucesso');
            render();
          };
        });
      }

      function abrirModalNovoAluno(turmaIdAlvo = null) {
        const tid = turmaIdAlvo || session.turmaAtualId;
        const turma = db.turmas.find(t => t.id === tid);
        const cargosTurma = cargosDaTurma(tid);
        let rascunhos = [{ apelido: '', cargoId: '' }];

      const BIO_KEY = 'economia_turma_bio_id';

      function bufferToBase64(buf) {
        return btoa(String.fromCharCode(...new Uint8Array(buf)));
      }

      function base64ToBuffer(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes.buffer;
      }

      async function cadastrarBiometriaWeb() {
        if (!window.PublicKeyCredential || !navigator.credentials) {
          throw new Error('Navegador sem suporte a biometria web');
        }
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);
        const userId = new Uint8Array(16);
        crypto.getRandomValues(userId);
        const cred = await navigator.credentials.create({
          publicKey: {
            challenge,
            rp: { name: 'Economia da Turma' },
            user: { id: userId, name: 'professor', displayName: 'Professor' },
            pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
            timeout: 60000
          }
        });
        if (cred && cred.rawId) {
          try { localStorage.setItem(BIO_KEY, bufferToBase64(cred.rawId)); } catch (e) {}
          return true;
        }
        return false;
      }

      async function verificarBiometriaWeb() {
        let savedId = null;
        try { savedId = localStorage.getItem(BIO_KEY); } catch (e) {}
        if (!savedId) return false;
        const challenge = new Uint8Array(32);
        crypto.getRandomValues(challenge);
        const assertion = await navigator.credentials.get({
          publicKey: {
            challenge,
            allowCredentials: [{ type: 'public-key', id: base64ToBuffer(savedId) }],
            userVerification: 'required',
            timeout: 60000
          }
        });
        return Boolean(assertion);
      }

      function renderGradeSemanalHtml() {
        const dias = [1, 2, 3, 4, 5, 6]; // Seg a Sáb
        const aulas = (db.horariosAula || []).filter(h => h.diaSemana >= 1 && h.diaSemana <= 6);
        const toMin = (hhmm) => {
          const [h, m] = hhmm.split(':').map(Number);
          return h * 60 + m;
        };

        let minStart = 7 * 60;
        let maxEnd = 12 * 60 + 30;
        if (aulas.length > 0) {
          minStart = Math.min(...aulas.map(a => toMin(a.inicio)));
          maxEnd = Math.max(...aulas.map(a => toMin(a.fim)));
          minStart = Math.floor(minStart / 60) * 60;
          maxEnd = Math.ceil(maxEnd / 60) * 60;
        }
        const totalMin = Math.max(60, maxEnd - minStart);
        const pxPerMin = 1.15;
        const heightPx = Math.round(totalMin * pxPerMin);

        const hourMarks = [];
        for (let m = minStart; m <= maxEnd; m += 60) {
          const top = Math.round((m - minStart) * pxPerMin);
          const lbl = `${String(Math.floor(m / 60)).padStart(2, '0')}:00`;
          hourMarks.push({ top, lbl });
        }

        const colsHtml = dias.map(d => {
          const doDia = aulas.filter(a => a.diaSemana === d);
          const blocos = doDia.map(a => {
            const top = Math.round((toMin(a.inicio) - minStart) * pxPerMin);
            const h = Math.max(26, Math.round((toMin(a.fim) - toMin(a.inicio)) * pxPerMin) - 2);
            const t = db.turmas.find(x => x.id === a.turmaId);
            return `
              <div style="top:${top}px;height:${h}px" class="absolute left-0.5 right-0.5 rounded-xl bg-[#6A1B9A]/80 border border-[#FFD600]/45 px-1 py-0.5 flex flex-col justify-center overflow-hidden shadow">
                <div class="text-[9px] font-extrabold text-[#FFD600] leading-tight truncate">${t ? escapeHtml(t.nome) : 'Aula'}</div>
                <div class="text-[8px] text-white/90 leading-tight">${a.inicio}–${a.fim}</div>
              </div>
            `;
          }).join('');
          const linhas = hourMarks.map(hm => `<div style="top:${hm.top}px" class="absolute left-0 right-0 border-t border-white/10"></div>`).join('');
          return `
            <div class="flex-1 min-w-[68px] border-l border-white/10 relative" style="height:${heightPx}px">
              ${linhas}
              ${blocos}
            </div>
          `;
        }).join('');

        return `
          <div class="overflow-x-auto">
            <div class="min-w-[460px]">
              <div class="flex border-b border-white/15 pb-1.5 mb-1 text-[10px] font-bold text-gray-300">
                <div class="w-10 shrink-0">Hora</div>
                ${dias.map(d => `<div class="flex-1 min-w-[68px] text-center">${DIAS_SEMANA[d]}</div>`).join('')}
              </div>
              <div class="flex">
                <div class="w-10 shrink-0 relative" style="height:${heightPx}px">
                  ${hourMarks.map(hm => `<div style="top:${Math.max(0, hm.top - 6)}px" class="absolute left-0 text-[9px] font-mono text-gray-400">${hm.lbl}</div>`).join('')}
                </div>
                ${colsHtml}
              </div>
            </div>
          </div>
        `;
      }

      function renderAbaHistorico() {
        const hoje = hojeISO();
        const agoraMs = Date.now();
        const filtradas = db.transacoes.filter(t => {
          if (session.historicoTurmaId !== 'todas' && t.turmaId !== Number(session.historicoTurmaId)) {
            return false;
          }
          if (session.historicoPeriodo === 'hoje') {
            return t.criadoEm.startsWith(hoje);
          }
          if (session.historicoPeriodo === 'semana') {
            return (agoraMs - new Date(t.criadoEm).getTime()) <= 7 * 86400000;
          }
          if (session.historicoPeriodo === 'mes') {
            return (agoraMs - new Date(t.criadoEm).getTime()) <= 30 * 86400000;
          }
          return true;
        });
        const lista = filtradas.slice(0, 80);
        const periodos = [
          ['tudo', 'Tudo'],
          ['hoje', 'Dia atual'],
          ['semana', '1 semana'],
          ['mes', '1 mês']
        ];
        return `
          <div class="flex items-center justify-between mb-3">
            <h2 class="font-extrabold text-lg">Histórico (${filtradas.length})</h2>
            <select id="sel-hist-turma" class="glass-pill rounded-xl px-3 py-1.5 text-xs text-white font-semibold">
              <option value="todas" class="bg-[#18181D]" ${session.historicoTurmaId === 'todas' ? 'selected' : ''}>Todas as turmas</option>
              ${turmasOrdenadas().map(t => `<option value="${t.id}" class="bg-[#18181D]" ${String(t.id) === String(session.historicoTurmaId) ? 'selected' : ''}>${escapeHtml(t.nome)}</option>`).join('')}
            </select>
          </div>
          <div class="flex gap-1.5 overflow-x-auto no-scrollbar mb-4">
            ${periodos.map(([id, label]) => `
              <button data-hist-per="${id}" class="btn-hist-per px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 ${session.historicoPeriodo === id ? 'glass-gold-btn' : 'glass-pill text-gray-300'}">${label}</button>
            `).join('')}
          </div>
          ${lista.length === 0 ? `<p class="text-sm text-gray-400">Sem registros.</p>` : `
            <div class="space-y-2.5">
              ${lista.map(t => {
                const orig = db.usuarios.find(u => u.id === t.origemId);
                const dest = db.usuarios.find(u => u.id === t.destinoId);
                const turma = db.turmas.find(tu => tu.id === t.turmaId);
                const sinal = t.valor >= 0 ? '+' : '';
                return `
                  <div class="glass-card rounded-3xl p-3.5 flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3">
                      <span class="w-9 h-9 rounded-xl bg-white/10 flex items-center justify-center text-white/90">${dest ? renderAvatar(dest.avatarId, 'w-5 h-5') : svgIcon('user', 'w-5 h-5')}</span>
                      <div>
                        <div class="font-bold text-sm">${dest ? escapeHtml(dest.apelido) : 'Aluno'} • ${escapeHtml(t.motivo)}</div>
                        <div class="text-[11px] text-gray-400 mt-0.5">Por ${orig ? escapeHtml(orig.apelido) : 'Sistema'} (${turma ? escapeHtml(turma.nome) : ''}) • ${formatarDataHora(t.criadoEm)}</div>
                      </div>
                    </div>
                    <span class="font-extrabold text-sm ${t.valor >= 0 ? 'text-amarelo' : 'text-red-400'} shrink-0">${sinal}${fmtMoeda(t.valor)}</span>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        `;
      }

      function bindModoProfessor() {
        const selTurma = document.getElementById('sel-turma');
        if (selTurma) {
          selTurma.onchange = (e) => {
            session.turmaAtualId = Number(e.target.value);
            session.escolhendoTurma = false;
            session.selecionados.clear();
            session.selecaoMultipla = false;
            render();
          };
        }
        const btnVoltarSecao = document.getElementById('btn-voltar-secao');
        if (btnVoltarSecao) {
          btnVoltarSecao.onclick = () => {
            if (session.abaProfessor === 'turma' && !session.escolhendoTurma) {
              session.escolhendoTurma = true;
            } else if (session.abaProfessor === 'config' && session.subConfig !== null) {
              session.subConfig = null;
            } else {
              session.abaProfessor = session.abaAnterior && session.abaAnterior !== session.abaProfessor ? session.abaAnterior : 'turma';
            }
            render();
          };
        }

        document.getElementById('btn-ir-aluno').onclick = () => {
          session.modo = 'aluno';
          session.alunoTurmaId = null;
          session.alunoBusca = '';
          session.alunoAtivoId = null;
          session.carrinho = {};
          render();
        };
        document.querySelectorAll('.btn-nav').forEach(b => {
          b.onclick = () => {
            if (b.dataset.aba !== session.abaProfessor) {
              session.abaAnterior = session.abaProfessor;
            }
            session.abaProfessor = b.dataset.aba;
            session.fabMenuAberto = false;
            if (b.dataset.aba === 'config') session.subConfig = null;
            render();
          };
        });

        function abrirModalHorariosGlobal(turmaIdInicial) {
          let turmaIdSel = turmaIdInicial || turmasOrdenadas()[0]?.id;
          let rascunhos = (db.horariosAula || [])
            .filter(h => h.turmaId === turmaIdSel)
            .sort((a, b) => a.diaSemana - b.diaSemana || a.inicio.localeCompare(b.inicio))
            .map(h => ({ id: h.id, diaSemana: h.diaSemana, inicio: h.inicio, fim: h.fim }));
          if (rascunhos.length === 0) {
            rascunhos.push({ id: genId(), diaSemana: new Date().getDay(), inicio: '07:30', fim: somarMinutos('07:30', 45) });
          }

          function lerCamposAtuais() {
            rascunhos = rascunhos.map((r, idx) => {
              const diaEl = document.getElementById(`hor-dia-${idx}`);
              const iniEl = document.getElementById(`hor-ini-${idx}`);
              const fimEl = document.getElementById(`hor-fim-${idx}`);
              return {
                id: r.id,
                diaSemana: diaEl ? Number(diaEl.value) : r.diaSemana,
                inicio: iniEl ? iniEl.value : r.inicio,
                fim: fimEl ? fimEl.value : r.fim
              };
            });
          }

          function renderEditor() {
            const linhas = rascunhos.length === 0
              ? `<p class="text-xs text-gray-400 mb-3">Nenhum horário para esta turma. Adicione abaixo.</p>`
              : rascunhos.map((r, idx) => `
                  <div class="glass-pill rounded-2xl p-3 mb-2.5">
                    <div class="flex items-center justify-between gap-2 mb-2">
                      <select id="hor-dia-${idx}" class="bg-[#121218] border border-white/15 rounded-xl px-2.5 py-1.5 text-xs text-white font-semibold">
                        ${DIAS_SEMANA.map((d, i) => `<option value="${i}" ${i === r.diaSemana ? 'selected' : ''}>${d}</option>`).join('')}
                      </select>
                      <button type="button" data-rem-slot="${idx}" class="btn-rem-slot text-red-400 text-xs font-bold px-2 py-1">Remover &times;</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                      <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">Início</label>
                        <input id="hor-ini-${idx}" data-slot-idx="${idx}" type="time" value="${r.inicio}" class="inp-hor-ini w-full bg-[#121218] border border-white/15 rounded-xl px-2.5 py-1.5 text-xs text-white" />
                      </div>
                      <div>
                        <label class="block text-[10px] text-gray-400 mb-0.5">Fim</label>
                        <input id="hor-fim-${idx}" type="time" value="${r.fim}" class="w-full bg-[#121218] border border-white/15 rounded-xl px-2.5 py-1.5 text-xs text-white" />
                      </div>
                    </div>
                  </div>
                `).join('');

            abrirModal(`
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-lg">Horários da Turma</h3>
                <button id="btn-fechar-modal" class="text-gray-400 text-xl px-2">&times;</button>
              </div>
              <label class="block text-xs text-gray-400 mb-1">Turma</label>
              <select id="inp-hor-turma" class="w-full glass-pill rounded-xl px-3 py-2.5 text-sm text-white mb-3">
                ${turmasOrdenadas().map(t => `<option value="${t.id}" class="bg-[#18181D]" ${t.id === turmaIdSel ? 'selected' : ''}>${escapeHtml(t.nome)}</option>`).join('')}
              </select>
              <div class="max-h-64 overflow-y-auto pr-0.5 mb-3">${linhas}</div>
              <button type="button" id="btn-add-mais-horario" class="w-full glass-accent-purple text-white text-xs font-bold py-2.5 rounded-xl mb-2.5">+ Adicionar outro horário</button>
              <button type="button" id="btn-save-hor" class="w-full glass-gold-btn font-bold py-3 rounded-xl">Salvar e encerrar</button>
            `);

            document.getElementById('btn-fechar-modal').onclick = fecharModal;
            document.getElementById('inp-hor-turma').onchange = (e) => {
              turmaIdSel = Number(e.target.value);
              rascunhos = (db.horariosAula || [])
                .filter(h => h.turmaId === turmaIdSel)
                .sort((a, b) => a.diaSemana - b.diaSemana || a.inicio.localeCompare(b.inicio))
                .map(h => ({ id: h.id, diaSemana: h.diaSemana, inicio: h.inicio, fim: h.fim }));
              renderEditor();
            };
            document.querySelectorAll('.btn-rem-slot').forEach(b => {
              b.onclick = () => {
                lerCamposAtuais();
                rascunhos.splice(Number(b.dataset.remSlot), 1);
                renderEditor();
              };
            });
            document.querySelectorAll('.inp-hor-ini').forEach(inp => {
              inp.onchange = () => {
                const idx = Number(inp.dataset.slotIdx);
                const fimEl = document.getElementById(`hor-fim-${idx}`);
                if (fimEl && inp.value) fimEl.value = somarMinutos(inp.value, 45);
              };
            });
            document.getElementById('btn-add-mais-horario').onclick = () => {
              lerCamposAtuais();
              const ultimo = rascunhos[rascunhos.length - 1];
              const novoIni = ultimo ? ultimo.fim : '07:30';
              rascunhos.push({
                id: genId(),
                diaSemana: ultimo ? ultimo.diaSemana : new Date().getDay(),
                inicio: novoIni,
                fim: somarMinutos(novoIni, 45)
              });
              renderEditor();
            };
            document.getElementById('btn-save-hor').onclick = () => {
              lerCamposAtuais();
              for (const r of rascunhos) {
                if (!r.inicio || !r.fim || r.fim <= r.inicio) {
                  toast('Verifique um horário com fim menor ou igual ao início.', 'erro');
                  return;
                }
              }
              db.horariosAula = (db.horariosAula || []).filter(h => h.turmaId !== turmaIdSel);
              rascunhos.forEach(r => {
                db.horariosAula.push({ id: r.id || genId(), turmaId: turmaIdSel, diaSemana: r.diaSemana, inicio: r.inicio, fim: r.fim });
              });
              salvarEstado();
              fecharModal();
              toast('Horários salvos!', 'sucesso');
              render();
            };
          }
          renderEditor();
        }

        function abrirModalRegraGlobal(regraExistente = null) {
          let iconeSel = regraExistente ? regraExistente.icone : ICONES_ATIVIDADES[0];
          let titVal = regraExistente ? regraExistente.titulo : '';
          let valVal = regraExistente ? String(regraExistente.valor) : '2';

          function renderRegraModal() {
            const iconesHtml = ICONES_ATIVIDADES.map(ic => `
              <button type="button" data-ic="${ic}" class="btn-ic-regra w-10 h-10 rounded-xl flex items-center justify-center border transition ${iconeSel === ic ? 'border-[#FFD600] bg-yellow-400/20 text-amarelo' : 'border-white/10 bg-white/5 text-white/80'}">
                ${svgIcon(ic, 'w-5 h-5')}
              </button>
            `).join('');

            abrirModal(`
              <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-lg">${regraExistente ? 'Editar Atividade' : 'Nova Atividade'}</h3>
                <button id="btn-fechar-modal" class="text-gray-400 text-xl px-2">&times;</button>
              </div>
              <label class="block text-xs text-gray-400 mb-1">Nome da atividade</label>
              <input id="inp-regra-tit" value="${escapeHtml(titVal)}" placeholder="Ex.: Caderno organizado" class="w-full glass-pill rounded-xl px-3 py-2 text-sm mb-2.5 text-white" />
              <label class="block text-xs text-gray-400 mb-1">Quantidade de ${escapeHtml(db.config.moedaPlural)}</label>
              <input id="inp-regra-val" type="number" value="${escapeHtml(valVal)}" class="w-full glass-pill rounded-xl px-3 py-2 text-sm mb-3 text-white" />
              <label class="block text-xs text-gray-400 mb-2">Ícone da atividade (20 opções)</label>
              <div class="grid grid-cols-5 gap-2 mb-4">${iconesHtml}</div>
              <button id="btn-save-regra" class="w-full glass-gold-btn font-bold py-2.5 rounded-xl mb-2">${regraExistente ? 'Salvar Alterações' : 'Criar Atividade'}</button>
              ${regraExistente ? `<button id="btn-del-regra" class="w-full bg-red-900/50 border border-red-400/30 text-red-200 font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5">${svgIcon('trash', 'w-4 h-4')} <span>Excluir Atividade</span></button>` : ''}
            `);

            document.getElementById('btn-fechar-modal').onclick = fecharModal;
            document.querySelectorAll('.btn-ic-regra').forEach(b => {
              b.onclick = () => {
                titVal = document.getElementById('inp-regra-tit').value;
                valVal = document.getElementById('inp-regra-val').value;
                iconeSel = b.dataset.ic;
                renderRegraModal();
              };
            });
            document.getElementById('btn-save-regra').onclick = () => {
              const titulo = document.getElementById('inp-regra-tit').value.trim();
              const valor = Number(document.getElementById('inp-regra-val').value) || 0;
              if (!titulo || valor <= 0) { toast('Preencha nome e valor válido.', 'erro'); return; }
              if (regraExistente) {
                regraExistente.titulo = titulo;
                regraExistente.valor = valor;
                regraExistente.icone = iconeSel;
                toast('Atividade atualizada!', 'sucesso');
              } else {
                db.regras.push({ id: genId(), titulo, valor, icone: iconeSel, monitorPode: true });
                toast('Atividade criada!', 'sucesso');
              }
              salvarEstado();
              fecharModal();
              render();
            };
            const btnDel = document.getElementById('btn-del-regra');
            if (btnDel) {
              btnDel.onclick = () => {
                db.regras = db.regras.filter(r => r.id !== regraExistente.id);
                salvarEstado();
                fecharModal();
                toast('Atividade excluída.', 'sucesso');
                render();
              };
            }
          }
          renderRegraModal();
        }

        limparTimersFab();
        const btnFab = document.getElementById('btn-fab-adicionar');
        const speedDial = document.getElementById('fab-speed-dial');
        if (btnFab) {
          const opcoes = [];
          if (session.abaProfessor === 'turma') {
            if (session.escolhendoTurma) {
              opcoes.push({ label: 'Nova Turma', icone: 'users', fn: abrirModalNovaTurma });
            } else {
              opcoes.push({ label: 'Adicionar Alunos', icone: 'user', fn: () => abrirModalNovoAluno() });
              opcoes.push({ label: 'Nova Turma', icone: 'users', fn: abrirModalNovaTurma });
            }

              const file = e.target.files && e.target.files[0];
              if (!file) return;
              const reader = new FileReader();
              reader.onload = () => {
                const img = new Image();
                img.onload = () => {
                  const maxDim = 96;
                  const scale = Math.min(maxDim / img.width, maxDim / img.height, 1);
                  const w = Math.max(1, Math.round(img.width * scale));
                  const h = Math.max(1, Math.round(img.height * scale));
                  const canvas = document.createElement('canvas');
                  canvas.width = w;
                  canvas.height = h;
                  const ctx = canvas.getContext('2d');
                  ctx.drawImage(img, 0, 0, w, h);
                  const imgData = ctx.getImageData(0, 0, w, h);
                  const data = imgData.data;
                  // Amostra a cor de fundo do canto superior esquerdo
                  const bgR = data[0], bgG = data[1], bgB = data[2];
                  for (let i = 0; i < data.length; i += 4) {
                    const dr = data[i] - bgR;
                    const dg = data[i + 1] - bgG;
                    const db2 = data[i + 2] - bgB;
                    const dist = Math.sqrt(dr * dr + dg * dg + db2 * db2);
                    if (dist < 48) {
                      data[i + 3] = 0;
                    } else if (dist < 75) {
                      data[i + 3] = Math.round(((dist - 48) / 27) * data[i + 3]);
                    }
                  }
                  ctx.putImageData(imgData, 0, 0);
                  db.config.moedaIcone = canvas.toDataURL('image/png');
                  salvarEstado();
                  toast('Ícone atualizado sem fundo!', 'sucesso');
                  render();

                img.src = reader.result;

              <h3 class="font-extrabold text-base mb-2.5 flex items-center gap-2">${svgIcon('store', 'w-5 h-5 text-amarelo')} <span>Mercadinho</span></h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${itensAtivos.map(it => {
                  const qtd = session.carrinho[it.id] || 0;
                  return `
                    <div class="glass-card rounded-3xl p-3.5 flex items-center justify-between gap-3">
                      <div class="flex items-center gap-3">
                        <span class="w-11 h-11 rounded-2xl bg-white/10 flex items-center justify-center text-white/95">${renderRegraIcone(it.icone, 'w-5 h-5')}</span>
                        <div>
                          <div class="font-bold text-sm">${escapeHtml(it.nome)}</div>
                          <div class="text-xs text-amarelo font-extrabold">${fmtMoeda(it.preco)}</div>
                        </div>
                      </div>
                      <div class="flex items-center gap-2">
                        ${qtd > 0 ? `<button data-rem="${it.id}" class="btn-rem-cart w-8 h-8 rounded-xl glass-pill font-bold">-</button><span class="text-sm font-bold w-4 text-center">${qtd}</span>` : ''}
                        <button data-add="${it.id}" ${jaResgatou ? 'disabled' : ''} class="btn-add-cart w-8 h-8 rounded-xl glass-gold-btn font-extrabold disabled:opacity-40">+</button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </main>

          ${totalCarrinho > 0 ? `
            <div class="fixed bottom-0 left-0 right-0 glass-nav p-4 z-40">
              <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
                <div>
                  <div class="text-xs text-gray-400">Total: <span class="text-white font-bold">${fmtMoeda(totalCarrinho)}</span></div>
                  <div class="text-xs ${saldoRestante < 0 ? 'text-red-400 font-bold' : 'text-emerald-400'}">
                    Saldo restante: ${fmtMoeda(saldoRestante)}
                  </div>
                </div>
                <button id="btn-finalizar-compra" ${saldoRestante < 0 || jaResgatou ? 'disabled' : ''} class="glass-gold-btn font-extrabold px-5 py-3 rounded-2xl disabled:opacity-40">
                  Finalizar compra
                </button>
              </div>
            </div>
          ` : ''}
        `;
      }

      function bindModoAluno() {
        const btnVoltar = document.getElementById('btn-voltar-prof');
        if (btnVoltar) btnVoltar.onclick = pedirPinProfessor;

        document.querySelectorAll('.btn-aluno-turma').forEach(b => {
          b.onclick = () => {
            session.alunoTurmaId = Number(b.dataset.alunoTurma);
            session.alunoBusca = '';
            render();
          };
        });

        const btnVoltarTurmas = document.getElementById('btn-voltar-turmas-aluno');
        if (btnVoltarTurmas) {
          btnVoltarTurmas.onclick = () => {
            session.alunoTurmaId = null;
            session.alunoBusca = '';
            render();
          };
        }

        const inpBusca = document.getElementById('inp-busca-aluno');
        if (inpBusca) {
          inpBusca.oninput = () => {
            session.alunoBusca = inpBusca.value;
            const pos = inpBusca.selectionStart;
            render();
            const el = document.getElementById('inp-busca-aluno');
            if (el) {
              el.focus();
              el.setSelectionRange(pos, pos);
            }
          };
        }

        document.querySelectorAll('.btn-escolher-aluno').forEach(b => {
          b.onclick = () => {
            session.alunoAtivoId = Number(b.dataset.escolherAluno);
            session.carrinho = {};
            render();
          };
        });

        const btnFechar = document.getElementById('btn-fechar-aluno');
        if (btnFechar) {
          btnFechar.onclick = () => {
            session.alunoAtivoId = null;
            session.carrinho = {};
            render();
          };
        }

        document.querySelectorAll('.btn-add-cart').forEach(b => {
          b.onclick = () => {
            const id = Number(b.dataset.add);
            const it = db.itensMercadinho.find(x => x.id === id);
            const atual = session.carrinho[id] || 0;
            if (it && it.estoque !== null && atual >= it.estoque) {
              toast('Estoque máximo atingido.', 'erro');
              return;
            }
            session.carrinho[id] = atual + 1;
            render();
          };
        });

        document.querySelectorAll('.btn-rem-cart').forEach(b => {
          b.onclick = () => {
            const id = Number(b.dataset.rem);
            if ((session.carrinho[id] || 0) <= 1) delete session.carrinho[id];
            else session.carrinho[id] -= 1;
            render();
          };
        });

        const btnFin = document.getElementById('btn-finalizar-compra');
        if (btnFin) {
          btnFin.onclick = () => {
            const aluno = db.usuarios.find(u => u.id === session.alunoAtivoId);
            if (!aluno) return;
            const itens = [];
            let total = 0;
            Object.entries(session.carrinho).forEach(([id, qtd]) => {
              const it = db.itensMercadinho.find(x => x.id === Number(id));
              if (it && qtd > 0) {
                itens.push({ itemId: it.id, nome: it.nome, qtd, preco: it.preco });
                total += it.preco * qtd;
              }
            });
            if (!itens.length || total > aluno.saldo || alunoJaResgatouHoje(aluno.id)) return;

            aluno.saldo -= total;
            itens.forEach(i => {
              const orig = db.itensMercadinho.find(x => x.id === i.itemId);
              if (orig && orig.estoque !== null) orig.estoque = Math.max(0, orig.estoque - i.qtd);
            });
            const pedidoId = genId();
            const now = new Date().toISOString();
            db.pedidos.unshift({
              id: pedidoId,
              alunoId: aluno.id,
              turmaId: session.turmaAtualId,
              itens,
              total,
              status: 'pendente_entrega',
              criadoEm: now,
              entregueEm: null
            });
            db.transacoes.unshift({
              id: genId(),
              turmaId: session.turmaAtualId,
              origemId: aluno.id,
              destinoId: aluno.id,
              valor: -total,
              tipo: 'compra',
              motivo: `Mercadinho: ${itens.map(i => `${i.qtd}x ${i.nome}`).join(', ')}`,
              criadoEm: now
            });
            salvarEstado();
            session.carrinho = {};

            let segs = 10;
            abrirModal(`
              <div class="text-center py-2">
                <div class="w-16 h-16 mx-auto rounded-2xl glass-accent-purple flex items-center justify-center text-amarelo mb-3">${svgIcon('check', 'w-9 h-9')}</div>
                <h3 class="font-extrabold text-xl mb-1">Compra confirmada!</h3>
                <p class="text-xs text-gray-300 mb-4">O professor recebeu seu pedido para entrega.</p>
                <button id="btn-desfazer-compra" class="w-full bg-red-700/85 border border-red-400/30 text-white font-bold py-3 rounded-xl mb-2">Desfazer (<span id="undo-sec">10</span>s)</button>
                <button id="btn-concluir-aluno" class="w-full glass-gold-btn font-bold py-3 rounded-xl">Concluir agora</button>
              </div>
            `);

            const timer = setInterval(() => {
              segs -= 1;
              const el = document.getElementById('undo-sec');
              if (el) el.textContent = String(segs);
              if (segs <= 0) {
                clearInterval(timer);
                fecharModal();
                session.alunoAtivoId = null;
                render();
              }
            }, 1000);

            document.getElementById('btn-concluir-aluno').onclick = () => {
              clearInterval(timer);
              fecharModal();
              session.alunoAtivoId = null;
              render();
            };

            document.getElementById('btn-desfazer-compra').onclick = () => {
              clearInterval(timer);
              const ped = db.pedidos.find(p => p.id === pedidoId);
              if (ped) {
                ped.status = 'cancelado';
                aluno.saldo += ped.total;
                ped.itens.forEach(i => {
                  const orig = db.itensMercadinho.find(x => x.id === i.itemId);
                  if (orig && orig.estoque !== null) orig.estoque += i.qtd;
                });
                db.transacoes.unshift({
                  id: genId(),
                  turmaId: session.turmaAtualId,
                  origemId: aluno.id,
                  destinoId: aluno.id,
                  valor: ped.total,
                  tipo: 'estorno',
                  motivo: 'Compra desfeita pelo aluno',
                  criadoEm: new Date().toISOString()
                });
                salvarEstado();
              }
              fecharModal();
              toast('Compra desfeita e saldo devolvido!', 'sucesso');
              render();
            };
          };
        }
      }

      render();
    })();
  </script>
</body>
</html>
